name: p16-wake-dispatch

on:
  push:
    branches:
      - main
      - "p16/**"
    paths:
      - "src/aios_core/wake/**"
      - "src/aios_core/runtime/**"
      - "src/aios_core/execution/**"
      - "src/aios_core/contracts/enums.py"
      - "tests/integration/test_v3_wake_dispatch.py"
      - "tests/integration/test_v3_wake_routing.py"
      - ".github/workflows/p16-wake-dispatch.yml"
  pull_request:
    paths:
      - "src/aios_core/wake/**"
      - "src/aios_core/runtime/**"
      - "src/aios_core/execution/**"
      - "src/aios_core/contracts/enums.py"
      - "tests/integration/test_v3_wake_dispatch.py"
      - ".github/workflows/p16-wake-dispatch.yml"

jobs:
  p16-wake-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run durable Wake to resident-runtime closure
        run: |
          pytest \
            tests/integration/test_v3_wake_dispatch.py \
            tests/integration/test_v3_execution_world.py \
            tests/integration/test_v3_periodic_review.py \
            tests/integration/test_v3_fused_turn_runtime.py \
            tests/runtime/test_cognitive_runtime.py
