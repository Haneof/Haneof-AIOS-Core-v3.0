name: p16-convergence-gate

on:
  push:
    branches:
      - main
    paths:
      - "src/aios_core/**"
      - "tests/**"
      - ".github/workflows/p16-convergence-gate.yml"
  pull_request:
    paths:
      - "src/aios_core/**"
      - "tests/**"
      - ".github/workflows/p16-convergence-gate.yml"

jobs:
  full-core-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full CI may be merge-result)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record actual tested SHA vs event head
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "event_head_sha=${{ github.event.pull_request.head.sha || github.sha }}"
          echo "tested_sha=$(git rev-parse HEAD)"
          echo "If pull_request, this run tests merge-result refs/pull/.../merge, not PR head directly"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run full AIOS Core and P16 regression suite
        run: pytest -q
