name: p16-convergence-gate

on:
  push:
    branches:
      - main
    paths:
      - "src/aios_core/**"
      - "tests/**"
      - ".github/workflows/p16-convergence-gate.yml"
  pull_request:
    paths:
      - "src/aios_core/**"
      - "tests/**"
      - ".github/workflows/p16-convergence-gate.yml"

jobs:
  full-core-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run full AIOS Core and P16 regression suite
        run: |
          pytest -v 2>&1 | tee full.log
          cat full.log
