name: dimension-discovery

on:
  push:
    branches:
      - main
      - feat/native-tools-protocol
    paths:
      - "src/aios_core/**"
      - "tests/unit/test_dimension_discovery.py"
      - "experiments/dimension_discovery/**"
      - ".github/workflows/dimension-discovery.yml"
  pull_request:
    paths:
      - "src/aios_core/**"
      - "tests/unit/test_dimension_discovery.py"
      - "experiments/dimension_discovery/**"
      - ".github/workflows/dimension-discovery.yml"

jobs:
  discovery-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run dimension-discovery end-to-end verification
        run: PYTHONPATH=src python experiments/dimension_discovery/verify_discovery.py
