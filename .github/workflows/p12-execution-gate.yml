name: p12-execution-gate

on:
  push:
    branches: [main]
    paths:
      - "src/aios_core/execution/**"
      - "src/aios_core/runtime/**"
      - "src/aios_core/ingest/conversation.py"
      - "src/aios_core/query/**"
      - "src/aios_core/contracts/models.py"
      - "tests/integration/test_v3_execution_world.py"
      - "tests/integration/test_v3_fused_turn_runtime.py"
      - ".github/workflows/p12-execution-gate.yml"
  pull_request:
    paths:
      - "src/aios_core/execution/**"
      - "src/aios_core/runtime/**"
      - "src/aios_core/ingest/conversation.py"
      - "tests/integration/test_v3_execution_world.py"
      - "tests/integration/test_v3_fused_turn_runtime.py"

jobs:
  p12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run P12 execution closure
        run: |
          pytest             tests/integration/test_v3_execution_world.py             tests/integration/test_v3_fused_turn_runtime.py             tests/integration/test_v3_ai_world.py             tests/integration/test_v3_cognition_revision.py             tests/integration/test_v3_memory_recommendation.py             tests/integration/test_m0_prime_store_delta_and_search.py             tests/runtime/test_cognitive_runtime.py
