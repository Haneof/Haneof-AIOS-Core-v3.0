name: p14-long-context

on:
  push:
    branches:
      - main
      - "p14/long-conversation-continuity-*"
    paths:
      - "src/aios_core/context/**"
      - "src/aios_core/ingest/conversation.py"
      - "src/aios_core/runtime/turn_runtime.py"
      - "tests/integration/test_v3_long_context_continuity.py"
      - "tests/integration/test_v3_conversation_world_ingest.py"
      - "tests/integration/test_v3_dimension_summary.py"
      - "tests/integration/test_v3_fused_turn_runtime.py"
      - ".github/workflows/p14-long-context.yml"
  pull_request:
    paths:
      - "src/aios_core/context/**"
      - "src/aios_core/ingest/conversation.py"
      - "src/aios_core/runtime/turn_runtime.py"
      - "tests/integration/test_v3_long_context_continuity.py"
      - ".github/workflows/p14-long-context.yml"

jobs:
  p14:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run P14 continuity gate
        run: |
          pytest \
            tests/integration/test_v3_long_context_continuity.py \
            tests/integration/test_v3_conversation_world_ingest.py \
            tests/integration/test_v3_dimension_summary.py \
            tests/integration/test_v3_fused_turn_runtime.py
