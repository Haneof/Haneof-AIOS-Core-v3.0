name: tmp-extract-hidden
on:
  workflow_dispatch:
  push:
    branches:
      - "arena/sol-yearlong-resident-20260921"
    paths:
      - ".github/workflows/tmp-extract-hidden.yml"

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/sol-yearlong-resident-20260921
      - name: Download sealed Segment 003 Life Director package
        uses: actions/download-artifact@v4
        with:
          name: sol-segment-003-hidden-35553766484
          path: artifacts/hidden-segment-003
          github-token: ${{ github.token }}
          repository: Haneof/Haneof-AIOS-Core-v3.0
          run-id: 35553766484
      - name: Copy fixture to repo
        run: |
          set -e
          FIXTURE=$(find artifacts/hidden-segment-003 -type f -name sealed_fixture.json -print -quit)
          echo "Found $FIXTURE"
          ls -lh $FIXTURE
          sha256sum $FIXTURE
          cp $FIXTURE ./sealed_fixture_003.json
          ls -lh ./sealed_fixture_003.json
          head -n 20 ./sealed_fixture_003.json
      - name: Commit fixture file
        run: |
          set -e
          git config user.name "arena-bot"
          git config user.email "arena-bot@example.com"
          git add sealed_fixture_003.json
          git commit -m "tmp: add sealed_fixture_003.json for local reconstruction" || echo "no changes"
          git push origin arena/sol-yearlong-resident-20260921
