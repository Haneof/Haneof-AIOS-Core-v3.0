name: p10-ai-world-gate

on:
  push:
    branches: [main]
    paths:
      - "src/aios_core/ai_world/**"
      - "src/aios_core/writeback/**"
      - "src/aios_core/revision/**"
      - "src/aios_core/runtime/**"
      - "src/aios_core/context/**"
      - "src/aios_core/recommendation/**"
      - "src/aios_core/query/**"
      - "tests/integration/test_v3_ai_world.py"
      - "tests/integration/test_v3_fused_turn_runtime.py"
      - "tests/integration/test_v3_cognition_revision.py"
      - "tests/integration/test_v3_cognition_writeback.py"
      - ".github/workflows/p10-ai-world-gate.yml"
  pull_request:
    paths:
      - "src/aios_core/ai_world/**"
      - "src/aios_core/runtime/**"
      - "tests/integration/test_v3_ai_world.py"
      - "tests/integration/test_v3_fused_turn_runtime.py"

jobs:
  p10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run P10 unified AI-world closure
        run: |
          pytest             tests/integration/test_v3_ai_world.py             tests/integration/test_v3_fused_turn_runtime.py             tests/integration/test_v3_cognition_revision.py             tests/integration/test_v3_cognition_writeback.py             tests/integration/test_v3_memory_recommendation.py             tests/runtime/test_cognitive_runtime.py
