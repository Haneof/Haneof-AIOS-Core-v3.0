name: window23-review-evidence-exact-publisher

on:
  push:
    branches:
      - publication/window23-review-exact-publisher
    paths:
      - .github/workflows/window23-review-evidence-exact-publisher.yml

permissions:
  contents: write

jobs:
  publish-exact-review-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publisher branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact Window 23 reviewer commit and publish REVIEW_ONLY ref
        shell: bash
        env:
          REVIEW_MESSAGE_B64: 
        run: |
          set -euo pipefail

          candidate="7ecb2250a488766915e1042a76472b3cd26d9107"
          staging_branch="publication/window23-review-tree-staging"
          review_branch="arena/review-window23-fresh-ia-01a101e0"
          expected_tree="28593da131e7026de1de0037a87b6b892a5988ba"
          expected_commit="22aa00cb3793c252512142a1eae33ca8aae9d841"

          git fetch origin "$staging_branch:refs/remotes/origin/$staging_branch"
          git cat-file -e "$candidate^{commit}"

          tree="$(git rev-parse "refs/remotes/origin/$staging_branch^{tree}")"
          echo "staging_tree=$tree"
          test "$tree" = "$expected_tree"

          printf '%s' "$REVIEW_MESSAGE_B64" | base64 --decode > /tmp/window23-review-message.txt

          rebuilt="$(
            GIT_AUTHOR_NAME='Window23 Reviewer' \
            GIT_AUTHOR_EMAIL='reviewer@arena.ai' \
            GIT_AUTHOR_DATE='2026-10-04T13:00:07+00:00' \
            GIT_COMMITTER_NAME='Window23 Reviewer' \
            GIT_COMMITTER_EMAIL='reviewer@arena.ai' \
            GIT_COMMITTER_DATE='2026-10-04T13:00:07+00:00' \
            git commit-tree "$tree" -p "$candidate" < /tmp/window23-review-message.txt
          )"

          echo "rebuilt_commit=$rebuilt"
          test "$rebuilt" = "$expected_commit"
          test "$(git rev-parse "$rebuilt^{tree}")" = "$expected_tree"
          test "$(git rev-parse "$rebuilt^")" = "$candidate"

          if git ls-remote --exit-code origin "refs/heads/$review_branch" >/tmp/existing 2>/dev/null; then
            existing="$(cut -f1 /tmp/existing)"
            echo "existing_review_head=$existing"
            test "$existing" = "$expected_commit"
          else
            git push origin "$rebuilt:refs/heads/$review_branch"
          fi

          remote="$(git ls-remote origin "refs/heads/$review_branch" | cut -f1)"
          echo "remote_review_head=$remote"
          test "$remote" = "$expected_commit"

          echo "REVIEW_EVIDENCE_PUBLISHED"
          echo "ACCEPTANCE_PASS"
          echo "blocker=0"
          echo "READY_FOR_PM_INTEGRATION"
          echo "DO_NOT_MERGE"
