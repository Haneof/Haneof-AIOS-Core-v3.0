name: c14-cognitive-derivation-loop

on:
  pull_request:
    paths:
      - "src/aios_core/runtime/**"
      - "src/aios_core/summaries/**"
      - "src/aios_core/wake/**"
      - "src/aios_core/ai_world/**"
      - "src/aios_core/writeback/**"
      - "src/aios_core/revision/**"
      - "tests/integration/test_v3_c14_cognitive_derivation_runtime.py"
      - "tests/integration/test_v3_c14_cognitive_derivation_scheduler.py"
      - ".github/workflows/c14-cognitive-derivation-loop.yml"
  push:
    branches: [main]
    paths:
      - "src/aios_core/runtime/**"
      - "src/aios_core/summaries/**"
      - "src/aios_core/wake/**"
      - "src/aios_core/ai_world/**"
      - "src/aios_core/writeback/**"
      - "src/aios_core/revision/**"
      - "tests/integration/test_v3_c14_cognitive_derivation_runtime.py"
      - "tests/integration/test_v3_c14_cognitive_derivation_scheduler.py"
      - ".github/workflows/c14-cognitive-derivation-loop.yml"

jobs:
  c14-loop-targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: C14 LOOP scheduler runtime bundle restart and scale
        run: |
          pytest -q \
            tests/integration/test_v3_c14_cognitive_derivation_scheduler.py \
            tests/integration/test_v3_c14_cognitive_derivation_runtime.py

  runtime-wake-attention-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: CognitiveRuntime Wake AttentionBundle and BackgroundBudgetGate
        run: |
          pytest -q \
            tests/runtime/test_cognitive_runtime.py \
            tests/integration/test_v3_wake_dispatch.py \
            tests/integration/test_v3_background_budget_gate.py \
            tests/integration/test_v3_fused_turn_runtime.py

  cognition-ai-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Cognition writeback revision AI-world and constitutional closure
        run: |
          pytest -q \
            tests/integration/test_v3_cognition_writeback.py \
            tests/integration/test_v3_cognition_revision.py \
            tests/integration/test_v3_ai_world.py \
            tests/integration/test_v3_constitutional_cognition_closure.py \
            tests/integration/test_v3_completeness_closure.py

  summary-index-p12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Dimension summaries world index and P12 execution
        run: |
          pytest -q \
            tests/integration/test_v3_dimension_summary.py \
            tests/integration/test_v3_summary_hierarchy.py \
            tests/integration/test_m0_prime_store_delta_and_search.py \
            tests/integration/test_v3_execution_world.py

  p15-c13-p14-t28:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Periodic Review metering long context and T28
        run: |
          pytest -q \
            tests/integration/test_v3_periodic_review.py \
            tests/runtime/test_metering_ledger.py \
            tests/integration/test_v3_background_budget_gate.py \
            tests/integration/test_v3_long_context_continuity.py \
            tests/integration/test_v3_memory_recommendation.py \
            tests/habitation/test_t28_proactive_memory_boundary.py

  p16-habitation-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/habitation

  p16-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Full AIOS Core and P16 regression
        run: pytest -q
