name: p13-reality-ingest

on:
  push:
    branches: [main]
    paths:
      - "src/aios_core/ingest/**"
      - "tests/integration/test_v3_reality_ingest.py"
      - ".github/workflows/p13-reality-ingest.yml"
  pull_request:
    paths:
      - "src/aios_core/ingest/**"
      - "tests/integration/test_v3_reality_ingest.py"

jobs:
  p13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_v3_reality_ingest.py tests/integration/test_v3_conversation_world_ingest.py
