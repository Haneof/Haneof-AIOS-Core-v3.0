name: core-rc-refreeze-002-formal-gate

on:
  pull_request:
    paths:
      - ".github/workflows/core-rc-refreeze-002-formal-gate.yml"
      - "src/aios_core/**"
      - "tests/**"
      - "pyproject.toml"
      - "reviews/CORE_RC_REFREEZE_002/**"
      - "release/rc/CORE_RC_REFREEZE_002*"

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  formal-python312-full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Freeze environment identity
        run: |
          set -euo pipefail
          python -c "import sys,platform; print('python', sys.version); print('platform', platform.platform())"
          python -c "import pip,pydantic,pytest; print('pip', pip.__version__); print('pydantic', pydantic.VERSION); print('pytest', pytest.__version__)"
          python -m pip freeze
      - name: Fresh full pytest -q
        run: |
          set -euo pipefail
          pytest -q --tb=no | tee /tmp/full-pytest.txt
          tail -20 /tmp/full-pytest.txt
          echo "::notice title=full pytest::$(tail -1 /tmp/full-pytest.txt)"
      - name: Focused authenticity / recovery / headless / scale / writer
        run: |
          set -euo pipefail
          pytest -q --tb=short \
            tests/integration/test_core_background_response_recovery_001_corrective_002_authenticity.py \
            tests/integration/test_core_background_response_recovery_001_corrective_002_recovery.py \
            tests/integration/test_core_background_response_recovery_001.py \
            tests/runtime/test_cognitive_runtime_trusted_return.py \
            tests/integration/test_core_headless.py \
            tests/integration/test_core_recovery.py \
            tests/integration/test_core_scale_semantics.py \
            tests/integration/test_core_gap_fix_002_background_attempts.py \
            tests/runtime/test_turn_execution_recovery.py \
            | tee /tmp/focused-pytest.txt
          echo "::notice title=focused pytest::$(tail -1 /tmp/focused-pytest.txt)"
          python -c "import sys,pydantic,pytest; print('ENV', sys.version.split()[0], pydantic.VERSION, pytest.__version__)" | tee /tmp/env.txt
          echo "::notice title=formal env::$(cat /tmp/env.txt)"
      - name: Publish freeze gate summary as PR comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "## CORE-RC-REFREEZE-002 formal CPython 3.12 gate"
            echo
            echo "- run: ${{ github.run_id }}"
            echo "- sha: \`${{ github.sha }}\`"
            echo "- python: \`$(python -c 'import sys; print(sys.version.split()[0])')\`"
            echo "- pydantic: \`$(python -c 'import pydantic; print(pydantic.VERSION)')\`"
            echo "- pytest: \`$(python -c 'import pytest; print(pytest.__version__)')\`"
            echo
            echo "### full pytest -q"
            echo '```'
            tail -5 /tmp/full-pytest.txt
            echo '```'
            echo
            echo "### focused"
            echo '```'
            tail -5 /tmp/focused-pytest.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md
