name: p15-periodic-review-growth

on:
  push:
    branches:
      - main
      - "p15/periodic-review-growth-*"
    paths:
      - "src/aios_core/review/**"
      - "src/aios_core/runtime/turn_runtime.py"
      - "src/aios_core/runtime/__init__.py"
      - "tests/integration/test_v3_periodic_review_growth.py"
      - ".github/workflows/p15-periodic-review-growth.yml"
  pull_request:
    paths:
      - "src/aios_core/review/**"
      - "src/aios_core/runtime/turn_runtime.py"
      - "src/aios_core/runtime/__init__.py"
      - "tests/integration/test_v3_periodic_review_growth.py"
      - ".github/workflows/p15-periodic-review-growth.yml"

jobs:
  p15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run P15 review-growth closure
        run: |
          pytest \
            tests/integration/test_v3_periodic_review_growth.py \
            tests/integration/test_v3_ai_world.py \
            tests/integration/test_v3_cognition_revision.py \
            tests/integration/test_v3_cognition_writeback.py \
            tests/integration/test_v3_execution_world.py \
            tests/integration/test_v3_long_context_continuity.py \
            tests/integration/test_v3_fused_turn_runtime.py
