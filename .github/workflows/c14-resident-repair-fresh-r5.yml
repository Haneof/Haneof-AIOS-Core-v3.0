name: C14 Resident Repair Fresh Run R5

on:
  push:
    branches:
      - c14/semantic-repair-resident-20260922-fresh-r5
    paths:
      - reviews/internal_habitation/c14-resident/semantic-repair-v1/runs/resident-repair-20260922-fresh-r5/live_driver.py
      - .github/workflows/c14-resident-repair-live-r3.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: c14-sem-repair-resident-live-r5
  cancel-in-progress: false

jobs:
  resident-live-r5:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout resident branch
        uses: actions/checkout@v4
        with:
          ref: c14/semantic-repair-resident-20260922-fresh-r5
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AIOS Core
        run: python -m pip install -e .

      - name: Configure evidence commits
        run: |
          git config user.name "aios-resident-evidence"
          git config user.email "aios-resident-evidence@users.noreply.github.com"

      - name: Run real Resident interactive bridge fresh r5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python reviews/internal_habitation/c14-resident/semantic-repair-v1/runs/resident-repair-20260922-fresh-r5/live_driver.py
