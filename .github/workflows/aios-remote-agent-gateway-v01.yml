name: aios-remote-agent-gateway-v01

# Public-only, no credentialed Resident execution. Dispatch becomes available
# only after this workflow is separately reviewed and merged to default main.
on:
  pull_request:
    paths:
      - ".github/workflows/aios-remote-agent-gateway-v01.yml"
      - "tools/agent_gateway/**"
      - "tests/agent_gateway/**"
      - "docs/AIOS_REMOTE_AGENT_GATEWAY_V01.md"
  workflow_dispatch:
    inputs:
      task:
        description: "Only approved public read-only tasks"
        required: true
        type: choice
        default: gateway-selftest
        options:
          - gateway-selftest
          - pr370-source-boundary
          - pr370-artifact-audit

permissions:
  contents: read

concurrency:
  group: aios-agent-gateway-v01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-readonly-checks:
    # Prevent manually dispatching this workflow on an arbitrary code branch.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact event code (no saved token)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Standard-library Python for non-formal public CI
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Gateway policy and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python -I -m unittest discover -s tests/agent_gateway -p 'test_*.py' -v 2>&1 | tee gateway-unittest.log

      - name: Execute allowlisted read-only task
        env:
          AIOS_GATEWAY_TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || 'gateway-selftest' }}
          AIOS_GATEWAY_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          python -I tools/agent_gateway/runner.py --task "$AIOS_GATEWAY_TASK"
          if [ "$AIOS_GATEWAY_EVENT" = "pull_request" ]; then
            # CI proves the two public PR370 audits before any main activation.
            python -I tools/agent_gateway/runner.py --task pr370-source-boundary
            python -I tools/agent_gateway/runner.py --task pr370-artifact-audit
          fi

      - name: Public-only task summary
        if: always()
        shell: bash
        run: |
          echo "### AIOS Remote Agent Gateway v0.1" >> "$GITHUB_STEP_SUMMARY"
          echo "Non-formal, read-only CI. No Resident/Operator identity or Window69 acceptance." >> "$GITHUB_STEP_SUMMARY"
          for receipt in gateway-evidence/*/result.json; do
            if [ -f "$receipt" ]; then
              AIOS_GATEWAY_RECEIPT="$receipt" python -I -c 'import json,os; p=json.load(open(os.environ["AIOS_GATEWAY_RECEIPT"])); print("Task:",p["task"],"Status:",p["status"],"Class:",p["classification"])' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload sanitized JUnit, SHA256 and diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aios-gateway-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            gateway-evidence/
            gateway-unittest.log
          if-no-files-found: warn
          retention-days: 7
