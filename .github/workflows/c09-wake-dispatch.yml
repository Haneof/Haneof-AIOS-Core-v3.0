name: c09-wake-dispatch

on:
  push:
    branches:
      - main
      - "fix/p16-c09-wake-bus-dispatch-*"
    paths:
      - "src/aios_core/wake/**"
      - "src/aios_core/runtime/**"
      - "src/aios_core/contracts/enums.py"
      - "tests/integration/test_v3_wake_dispatch.py"
      - ".github/workflows/c09-wake-dispatch.yml"
  pull_request:
    paths:
      - "src/aios_core/wake/**"
      - "src/aios_core/runtime/**"
      - "src/aios_core/contracts/enums.py"
      - "tests/integration/test_v3_wake_dispatch.py"

jobs:
  c09:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: C09 wake bus and dispatch closure
        run: |
          pytest -q             tests/integration/test_v3_wake_dispatch.py             tests/integration/test_v3_execution_world.py             tests/integration/test_v3_periodic_review.py             tests/integration/test_v3_reality_ingest.py             tests/integration/test_v3_fused_turn_runtime.py             tests/runtime/test_cognitive_runtime.py

# CORE-RC-FREEZE-001 transient probe trigger; no command or test semantics changed.
