name: p13-external-fact-ingest

on:
  push:
    branches:
      - main
      - "parallel/p13-external-fact-ingest-*"
    paths:
      - "src/aios_core/ingest/external.py"
      - "tests/integration/test_v3_external_fact_ingest.py"
      - ".github/workflows/p13-external-fact-ingest.yml"
  pull_request:
    paths:
      - "src/aios_core/ingest/external.py"
      - "tests/integration/test_v3_external_fact_ingest.py"
      - ".github/workflows/p13-external-fact-ingest.yml"

jobs:
  p13-external-fact-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_v3_external_fact_ingest.py
