name: p16-self-resident-gpt56-sol

on:
  push:
    branches:
      - p16/self-resident-gpt56-sol-20260920

jobs:
  self-resident:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      P16_OUTPUT_DIR: artifacts/p16/self-resident-gpt56-sol
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Verify OpenAI secret exists
        shell: bash
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not configured"; exit 2; }

      - name: Run GPT-5.6 Sol sealed resident life
        shell: bash
        run: |
          python -m tests.habitation.run_provider_benchmark \
            --fixture-root tests/habitation/fixtures \
            --manifest cognition_system_closure_v1.manifest.json \
            --provider openai \
            --model gpt-5.6-sol \
            --max-output-tokens 4096 \
            --output-dir "$P16_OUTPUT_DIR"

      - name: Upload auditable resident artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p16-self-resident-gpt56-sol-${{ github.run_id }}
          path: artifacts/p16/
          if-no-files-found: error
