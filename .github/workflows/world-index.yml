name: world-index

on:
  push:
    branches: [main]
    paths:
      - "src/aios_core/query/**"
      - "src/aios_core/storage/**"
      - "src/aios_core/contracts/**"
      - "tests/integration/test_m0_prime_store_delta_and_search.py"
      - ".github/workflows/world-index.yml"
  pull_request:
    paths:
      - "src/aios_core/query/**"
      - "src/aios_core/storage/**"
      - "src/aios_core/contracts/**"
      - "tests/integration/test_m0_prime_store_delta_and_search.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_m0_prime_store_delta_and_search.py

