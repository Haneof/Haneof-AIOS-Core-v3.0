name: C15 Resident A Rerun Mechanical Executor
on:
  push:
    branches:
      - resident/c15-rcc-res-a-rerun-20260922-sol
    paths:
      - 'resident_ops/c15_rerun_command.sh'
permissions:
  contents: write
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Execute mechanical resident command
        shell: bash
        run: |
          set -o pipefail
          mkdir -p resident_ops
          bash resident_ops/c15_rerun_command.sh 2>&1 | tee resident_ops/c15_rerun_output.txt
      - name: Persist mechanical state/output
        if: always()
        shell: bash
        run: |
          git config user.name 'c15-resident-mechanical-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add resident_ops
          if [ -d reviews/internal_habitation/c15-rcc/v1/runs/resident-a-rerun-20260922 ]; then
            git add reviews/internal_habitation/c15-rcc/v1/runs/resident-a-rerun-20260922
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'evidence(c15): persist Resident A rerun mechanical state'
            git push origin HEAD:resident/c15-rcc-res-a-rerun-20260922-sol
          fi
