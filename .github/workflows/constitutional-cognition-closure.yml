name: constitutional-cognition-closure

on:
  pull_request:
    paths:
      - "src/aios_core/**"
      - "tests/integration/test_v3_constitutional_cognition_closure.py"
      - "tests/habitation/**"
      - ".github/workflows/constitutional-cognition-closure.yml"
  push:
    branches:
      - "hardening/constitutional-cognition-closure-20260920"
  workflow_dispatch:

jobs:
  constitutional-cognition-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Constitutional cognition closure gate
        run: |
          python -m pytest             tests/integration/test_v3_constitutional_cognition_closure.py             tests/integration/test_v3_memory_recommendation.py             tests/integration/test_v3_dimension_summary.py             tests/integration/test_v3_all_dimensions_projection.py             tests/integration/test_v3_cognition_writeback.py             tests/integration/test_v3_ai_world.py             tests/integration/test_v3_dimension_registry.py             tests/integration/test_v3_execution_world.py             tests/integration/test_v3_wake_dispatch.py
      - name: P16 harness regression
        run: python -m pytest tests/habitation
