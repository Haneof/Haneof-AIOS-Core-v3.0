name: C14 Resident Control Relay R2

on:
  push:
    branches:
      - c14/semantic-repair-resident-control-20260922-sol
    paths:
      - resident-control-r2.txt

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c14/semantic-repair-resident-control-20260922-sol
      - name: Relay exact Resident decision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path
          body = base64.b64decode(Path("resident-control-r2.txt").read_text(encoding="ascii").strip()).decode("utf-8")
          req = urllib.request.Request(
              "https://api.github.com/repos/Haneof/Haneof-AIOS-Core-v3.0/issues/84/comments",
              data=json.dumps({"body": body}, ensure_ascii=False).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "aios-resident-control-relay-r2",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(resp.status)
          PY
