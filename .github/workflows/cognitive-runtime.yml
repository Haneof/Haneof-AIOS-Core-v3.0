name: cognitive-runtime

on:
  push:
    branches: [main]
    paths:
      - "src/aios_core/runtime/capabilities.py"
      - "src/aios_core/runtime/cognitive_runtime.py"
      - "tests/runtime/test_cognitive_runtime.py"
      - ".github/workflows/cognitive-runtime.yml"
  pull_request:
    paths:
      - "src/aios_core/runtime/capabilities.py"
      - "src/aios_core/runtime/cognitive_runtime.py"
      - "tests/runtime/test_cognitive_runtime.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/runtime/test_cognitive_runtime.py
