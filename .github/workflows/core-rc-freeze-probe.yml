name: core-rc-freeze-probe

on:
  pull_request:
    paths:
      - ".github/workflows/core-rc-freeze-probe.yml"

permissions:
  contents: write

jobs:
  noneditable-release-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build clean wheel and install non-editable
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          mkdir -p dist rc-evidence
          python -m pip wheel . --no-deps -w dist
          python -m pip install dist/*.whl "pytest>=8,<9"
      - name: Generate exact frozen source manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          BASE = "773876f92d5f8e53422f8f5a68cc651953d93052"
          def git(*args):
              return subprocess.check_output(["git", *args]).decode().strip()
          def at(path):
              return subprocess.check_output(["git","show",f"{BASE}:{path}"])
          def rec(path):
              data=at(path)
              return {
                  "path": path,
                  "size": len(data),
                  "git_blob_sha1": git("rev-parse", f"{BASE}:{path}"),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          core_files=sorted(p.as_posix() for p in Path("src/aios_core").rglob("*") if p.is_file())
          workflow_files=sorted(p.as_posix() for p in Path(".github/workflows").glob("*.yml") if p.name != "core-rc-freeze-probe.yml")
          manifest={
              "schema": "CORE_RC_FREEZE_001_MANIFEST.v1",
              "frozen_main_sha": BASE,
              "probe_head": os.environ.get("GITHUB_SHA"),
              "top_tree_sha1": git("rev-parse", f"{BASE}^{{tree}}"),
              "core_tree_sha1": git("rev-parse", f"{BASE}:src/aios_core"),
              "tests_tree_sha1": git("rev-parse", f"{BASE}:tests"),
              "workflow_tree_sha1": git("rev-parse", f"{BASE}:.github/workflows"),
              "core_files": [rec(p) for p in core_files],
              "workflow_files": [rec(p) for p in workflow_files],
              "package_metadata": rec("pyproject.toml"),
              "constitution_registry": rec("docs/constitution/AIOS_v3.0_Fused_Baseline_Registry.md"),
              "task_board": rec("governance/AIOS_SINGLE_WINDOW_TASK_BOARD.md"),
              "checkpoint": rec("AIOS_v3.0_CURRENT_CHECKPOINT.md"),
              "notes": [
                  "Hashes are generated mechanically from the exact frozen base commit, not from the transient probe workflow tree.",
                  "Private Resident Worlds, run databases, credentials, and generated caches are excluded."
              ]
          }
          Path("rc-evidence/source-manifest.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("===RC_SOURCE_MANIFEST_BEGIN===")
          print(json.dumps(manifest,indent=2,sort_keys=True))
          print("===RC_SOURCE_MANIFEST_END===")
          PY
      - name: Record exact environment and wheel metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, importlib.metadata as md, json, os, platform, sqlite3, sys, zipfile
          from pathlib import Path
          wheel = next(Path("dist").glob("*.whl"))
          metadata_text = ""
          with zipfile.ZipFile(wheel) as zf:
              meta_name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              metadata_text = zf.read(meta_name).decode("utf-8")
          eps = [
              {"name": ep.name, "value": ep.value, "group": ep.group}
              for ep in md.entry_points(group="console_scripts")
              if ep.name == "aios-core-headless"
          ]
          dists = {}
          for dist in md.distributions():
              name = dist.metadata.get("Name")
              if name:
                  dists[name.lower()] = dist.version
          payload = {
              "probe_head": os.environ.get("GITHUB_SHA"),
              "python": sys.version,
              "python_executable": sys.executable,
              "implementation": platform.python_implementation(),
              "platform": platform.platform(),
              "system": platform.system(),
              "release": platform.release(),
              "machine": platform.machine(),
              "architecture": platform.architecture(),
              "sqlite": sqlite3.sqlite_version,
              "package": {"name": "aios-core", "version": md.version("aios-core")},
              "entrypoints": eps,
              "installed_distributions": dict(sorted(dists.items())),
              "wheel": {
                  "filename": wheel.name,
                  "sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
                  "metadata": metadata_text,
              },
              "build_backend": "setuptools.build_meta",
              "build_requires": ["setuptools>=75", "wheel"],
              "install_mode": "non-editable wheel",
          }
          Path("rc-evidence/environment.json").write_text(json.dumps(payload, indent=2, sort_keys=True)+"\n")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY
          python -m pip freeze | sort | tee rc-evidence/pip-freeze.txt
          command -v aios-core-headless | tee rc-evidence/entrypoint.txt
          aios-core-headless --help > rc-evidence/headless-help.txt
      - name: Full software-only direct regression on installed package
        run: pytest -q
      - name: Installed headless lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rc-freeze-headless"
          WORLD="$ROOT/world.sqlite"
          INDEX="$ROOT/world.index.sqlite"
          MODEL="aios_core.headless.testing:deterministic_model_handler"
          mkdir -p "$ROOT"
          aios-core-headless --world "$WORLD" --index "$INDEX" --model-handler "$MODEL" status | tee rc-evidence/headless-status-before.json
          aios-core-headless --world "$WORLD" --index "$INDEX" --model-handler "$MODEL" turn             --session rc-smoke --turn-index 1 --text "mechanical rc smoke"             --at "2026-09-24T14:58:00+00:00" | tee rc-evidence/headless-turn.json
          aios-core-headless --world "$WORLD" --index "$INDEX" --model-handler "$MODEL" status | tee rc-evidence/headless-status-after.json
          aios-core-headless --world "$WORLD" --index "$INDEX" --model-handler "$MODEL" inspect-turn             --session rc-smoke --turn-index 1 --text "mechanical rc smoke"             --at "2026-09-24T14:58:00+00:00" | tee rc-evidence/headless-inspect.json
      - name: Fresh backup restore index rebuild and source immutability smoke
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/rc-freeze-recovery"
          WORLD="$ROOT/world.sqlite"
          INDEX="$ROOT/world.index.sqlite"
          BACKUP="$ROOT/world.backup.sqlite"
          RESTORED="$ROOT/restored.sqlite"
          MODEL="aios_core.headless.testing:deterministic_model_handler"
          mkdir -p "$ROOT"
          aios-core-headless --world "$WORLD" --index "$INDEX" --model-handler "$MODEL" turn             --session rc-recovery --turn-index 1 --text "backup restore rc smoke"             --at "2026-09-24T15:00:00+00:00"
          python - "$WORLD" rc-evidence/source-before.json <<'PY'
          import hashlib, json, sqlite3, sys
          from pathlib import Path
          db=Path(sys.argv[1])
          with sqlite3.connect(db) as c:
              tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
              def count(name):
                  return c.execute(f"select count(*) from {name}").fetchone()[0] if name in tables else None
              payload={
                  "sha256": hashlib.sha256(db.read_bytes()).hexdigest(),
                  "world_revision": c.execute("select coalesce(max(world_revision),0) from world_commits").fetchone()[0],
                  "object_revisions": count("object_revisions"),
                  "background_model_attempts": count("background_model_attempts"),
                  "metering_records": count("metering_records"),
              }
          Path(sys.argv[2]).write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          print(payload)
          PY
          aios-core-headless --world "$WORLD" --index "$INDEX" backup --to "$BACKUP"
          python - "$WORLD" rc-evidence/source-after.json <<'PY'
          import hashlib, json, sqlite3, sys
          from pathlib import Path
          db=Path(sys.argv[1])
          with sqlite3.connect(db) as c:
              tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
              def count(name):
                  return c.execute(f"select count(*) from {name}").fetchone()[0] if name in tables else None
              payload={
                  "sha256": hashlib.sha256(db.read_bytes()).hexdigest(),
                  "world_revision": c.execute("select coalesce(max(world_revision),0) from world_commits").fetchone()[0],
                  "object_revisions": count("object_revisions"),
                  "background_model_attempts": count("background_model_attempts"),
                  "metering_records": count("metering_records"),
              }
          Path(sys.argv[2]).write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n")
          print(payload)
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("rc-evidence/source-before.json").read_text())
          b=json.loads(Path("rc-evidence/source-after.json").read_text())
          logical = lambda x: {k:v for k,v in x.items() if k != "sha256"}
          assert logical(a) == logical(b), (a,b)
          print("source logical state unchanged; physical SQLite bytes may change due to WAL/checkpoint", a["sha256"], b["sha256"])
          PY
          aios-core-headless --world "$RESTORED" restore --from-backup "$BACKUP"
          aios-core-headless --world "$RESTORED" rebuild-index
          aios-core-headless --world "$RESTORED" --model-handler "$MODEL" status | tee rc-evidence/restored-status.json
          python - "$WORLD" "$RESTORED" rc-evidence/restore-compare.json <<'PY'
          import json, sqlite3, sys
          from pathlib import Path
          def snap(path):
              with sqlite3.connect(path) as c:
                  tables={r[0] for r in c.execute("select name from sqlite_master where type='table'")}
                  def count(name):
                      return c.execute(f"select count(*) from {name}").fetchone()[0] if name in tables else None
                  ids=[tuple(r) for r in c.execute("select object_id, revision from object_revisions order by object_id, revision")]
                  return {
                      "world_revision": c.execute("select coalesce(max(world_revision),0) from world_commits").fetchone()[0],
                      "object_revisions": count("object_revisions"),
                      "background_model_attempts": count("background_model_attempts"),
                      "metering_records": count("metering_records"),
                      "object_identity": ids,
                  }
          a,b=snap(sys.argv[1]),snap(sys.argv[2])
          assert a == b, (a,b)
          Path(sys.argv[3]).write_text(json.dumps({"source":a,"restored":b,"equal":True},indent=2,sort_keys=True)+"\n")
          print("restore logical state equal", a)
          PY
      - name: Writer restart and FIX-001/002/003 spot checks
        run: |
          pytest -q             tests/integration/test_core_headless.py             tests/integration/test_core_recovery.py             tests/integration/test_core_scale_semantics.py             tests/integration/test_core_gap_fix_002_background_attempts.py             tests/runtime/test_turn_execution_recovery.py             tests/integration/test_v3_periodic_review.py             tests/integration/test_v3_c14_cognitive_derivation_runtime.py             tests/integration/test_v3_fused_turn_runtime.py
      - name: Materialize machine-readable RC manifests on PR branch
        if: success()
        shell: bash
        env:
          RC_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cp rc-evidence/source-manifest.json "$RUNNER_TEMP/CORE_RC_FREEZE_001_MANIFEST.json"
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path("rc-evidence/environment.json").read_text())
          out={
              "schema":"CORE_RC_FREEZE_001_DEPENDENCIES.v1",
              "frozen_software_commit":"773876f92d5f8e53422f8f5a68cc651953d93052",
              "clean_install_probe":src,
              "repository_constraints":{
                  "requires_python":">=3.12",
                  "runtime":["pydantic>=2.10,<3"],
                  "dev":["pytest>=8,<9"],
                  "build_backend":"setuptools.build_meta",
                  "build_requires":["setuptools>=75","wheel"]
              },
              "reproduction_note":"The repository has version ranges rather than a lockfile. This manifest pins the exact successful RC clean-install environment; no new lockfile is introduced by RC-FREEZE."
          }
          Path("$RUNNER_TEMP/CORE_RC_FREEZE_001_DEPENDENCIES.json").write_text(json.dumps(out,indent=2,sort_keys=True)+"\n")
          PY
          git fetch origin "$RC_BRANCH"
          git checkout -B "$RC_BRANCH" "origin/$RC_BRANCH"
          mkdir -p release/rc
          cp "$RUNNER_TEMP/CORE_RC_FREEZE_001_MANIFEST.json" release/rc/CORE_RC_FREEZE_001_MANIFEST.json
          cp "$RUNNER_TEMP/CORE_RC_FREEZE_001_DEPENDENCIES.json" release/rc/CORE_RC_FREEZE_001_DEPENDENCIES.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/rc/CORE_RC_FREEZE_001_MANIFEST.json release/rc/CORE_RC_FREEZE_001_DEPENDENCIES.json
          if git diff --cached --quiet; then
            echo "RC manifests already materialized"
          else
            git commit -m "release(rc): materialize CORE-RC-FREEZE-001 manifests"
            git push origin HEAD:"$RC_BRANCH"
          fi
      - name: Upload RC probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-rc-freeze-probe
          path: rc-evidence/
          if-no-files-found: warn
