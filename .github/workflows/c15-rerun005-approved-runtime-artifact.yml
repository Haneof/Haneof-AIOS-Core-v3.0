name: c15-rerun005-approved-runtime-artifact
on:
  push:

permissions:
  contents: read

concurrency:
  group: c15-rerun005-approved-runtime-artifact
  cancel-in-progress: true

jobs:
  build-approved-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact artifact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build, verify, and package approved runtime
        run: bash operator_artifacts/build_c15_rerun005_runtime_artifact.sh

      - name: Upload durable approved runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: c15-rerun005-approved-runtime-linux-x86_64
          path: |
            out/aios-c15-resident-runtime-3.12.14.tar.gz
            out/aios-c15-resident-runtime-3.12.14.tar.gz.sha256
            out/AIOS_C15_RESIDENT_RUNTIME_3_12_14_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
