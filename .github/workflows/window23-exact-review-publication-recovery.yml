name: window23-exact-review-publication-recovery

on:
  push:
    branches:
      - publication/window23-review-tree-staging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-exact-review-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact historical reviewer commit and publish only on exact SHA match
        env:
          EXPECTED_SHA: 22aa00cb3793c252512142a1eae33ca8aae9d841
          EXPECTED_TREE: 28593da131e7026de1de0037a87b6b892a5988ba
          EXPECTED_PARENT: 7ecb2250a488766915e1042a76472b3cd26d9107
          REVIEW_BRANCH: arena/review-window23-fresh-ia-01a101e0
          MSG_B64: 
        run: |
          set -euo pipefail
          git cat-file -e "$EXPECTED_TREE^{tree}"
          git cat-file -e "$EXPECTED_PARENT^{commit}"
          printf '%s' "$MSG_B64" | base64 -d > /tmp/window23-review-message.txt

          export GIT_AUTHOR_NAME='Window23 Reviewer'
          export GIT_AUTHOR_EMAIL='reviewer@arena.ai'
          export GIT_AUTHOR_DATE='1791118807 +0000'
          export GIT_COMMITTER_NAME='Window23 Reviewer'
          export GIT_COMMITTER_EMAIL='reviewer@arena.ai'
          export GIT_COMMITTER_DATE='1791118807 +0000'

          actual="$(git commit-tree "$EXPECTED_TREE" -p "$EXPECTED_PARENT" -F /tmp/window23-review-message.txt)"
          echo "actual=$actual"
          echo "expected=$EXPECTED_SHA"
          test "$actual" = "$EXPECTED_SHA"

          test "$(git rev-parse "$actual^{tree}")" = "$EXPECTED_TREE"
          test "$(git rev-parse "$actual^")" = "$EXPECTED_PARENT"

          remote="$(git ls-remote origin "refs/heads/$REVIEW_BRANCH" | cut -f1)"
          if [ -n "$remote" ] && [ "$remote" != "$EXPECTED_SHA" ]; then
            echo "remote review branch exists at unexpected SHA: $remote"
            exit 23
          fi
          if [ "$remote" = "$EXPECTED_SHA" ]; then
            echo "exact review branch already published"
            exit 0
          fi

          git push origin "$EXPECTED_SHA:refs/heads/$REVIEW_BRANCH"
          observed="$(git ls-remote origin "refs/heads/$REVIEW_BRANCH" | cut -f1)"
          test "$observed" = "$EXPECTED_SHA"
          echo "REVIEW_EVIDENCE_PUBLISHED=$observed"
