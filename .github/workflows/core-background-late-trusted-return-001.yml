name: core-background-late-trusted-return-001

on:
  pull_request:
    paths:
      - "src/aios_core/**"
      - "tests/**"
      - ".github/workflows/core-background-late-trusted-return-001.yml"
  workflow_dispatch:

jobs:
  formal-core-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"
      - run: python -m pip install -e . pydantic==2.13.5 pytest==8.4.2
      - name: Record exact formal environment and enumeration
        run: |
          python - <<'PY'
          import ssl, sys, sqlite3, pydantic, pytest
          print('Python:', sys.version)
          print('Pydantic:', pydantic.__version__)
          print('pytest:', pytest.__version__)
          print('SQLite:', sqlite3.sqlite_version)
          print('OpenSSL:', ssl.OPENSSL_VERSION)
          PY
          pytest -o addopts='' --collect-only -q > collected.txt
          tail -n 3 collected.txt
      - name: Late trusted return and not_submitted guard gate
        run: |
          pytest -o addopts='' -q --junitxml=late.xml \
            tests/integration/test_core_background_late_trusted_return_001.py \
            tests/integration/test_core_background_late_trusted_return_001_not_submitted.py \
            tests/integration/test_core_background_late_trusted_return_001_adversarial.py
      - name: Accepted trusted-return regression gate
        run: |
          pytest -o addopts='' -q --junitxml=accepted.xml \
            tests/integration/test_core_background_trusted_return_recovery_001.py \
            tests/integration/test_core_background_trusted_return_adversarial_001.py \
            tests/integration/test_core_background_trusted_return_r5_001.py \
            tests/integration/test_core_background_trusted_return_r5_conflicts_001.py \
            tests/integration/test_core_background_trusted_return_corrective_001_process_loss.py \
            tests/integration/test_core_background_trusted_return_corrective_001_store_fail_closed.py \
            tests/integration/test_core_background_trusted_return_corrective_001_capability_replay.py \
            tests/integration/test_core_background_response_recovery_001.py \
            tests/integration/test_core_background_response_recovery_001_corrective_001.py \
            tests/integration/test_core_background_response_recovery_001_corrective_002_authenticity.py \
            tests/integration/test_core_background_response_recovery_001_corrective_002_recovery.py \
            tests/integration/test_core_gap_fix_002_background_attempts.py \
            tests/runtime/test_background_model_attempt.py \
            tests/runtime/test_cognitive_runtime_trusted_return.py \
            tests/runtime/test_turn_execution_recovery.py
      - name: Annotate failure identities
        if: failure()
        run: |
          python - <<'PYTEST'
          import os, xml.etree.ElementTree as ET
          for name in ('late', 'accepted'):
              path = name + '.xml'
              if not os.path.isfile(path):
                  continue
              for case in ET.parse(path).getroot().iter('testcase'):
                  for error in (*case.findall('failure'), *case.findall('error')):
                      text = (error.text or '').strip().splitlines()
                      message = (' | '.join(text[-14:]) if text else error.attrib.get('message', 'unknown'))
                      print(f"::error file=tests/{name}::FAILED {case.get('classname')}::{case.get('name')}: {message}")
          PYTEST
      - name: Complete Core regression
        if: always()
        run: pytest -o addopts='' -q --junitxml=full.xml
      - name: Publish formal environment and exact JUnit counts
        if: always()
        run: |
          python - <<'PYGATE'
          import sqlite3, ssl, sys, xml.etree.ElementTree as ET
          import pydantic, pytest
          print(f"::notice title=Formal environment::Python {sys.version.split()[0]} / Pydantic {pydantic.__version__} / pytest {pytest.__version__} / SQLite {sqlite3.sqlite_version} / OpenSSL {ssl.OPENSSL_VERSION}")
          for name in ('late', 'accepted', 'full'):
              try:
                  suite = ET.parse(name + '.xml').getroot().find('testsuite')
                  fields = ', '.join(f"{k}={suite.get(k)}" for k in ('tests', 'failures', 'errors', 'skipped', 'time'))
                  print(f"::notice title={name} exact JUnit::{fields}")
              except (FileNotFoundError, AttributeError) as exc:
                  print(f"::warning title={name} JUnit unavailable::{exc}")
          PYGATE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-late-trusted-return-formal-results
          path: |
            collected.txt
            late.xml
            accepted.xml
            full.xml
