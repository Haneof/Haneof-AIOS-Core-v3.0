name: p9-revision-gate

on:
  push:
    branches: [main]
    paths:
      - "src/aios_core/revision/**"
      - "src/aios_core/writeback/**"
      - "src/aios_core/dependency/**"
      - "src/aios_core/query/**"
      - "src/aios_core/summaries/**"
      - "src/aios_core/runtime/**"
      - "tests/integration/test_v3_cognition_revision.py"
      - "tests/integration/test_v3_cognition_writeback.py"
      - "tests/integration/test_v3_fused_turn_runtime.py"
      - "tests/integration/test_v3_dimension_summary.py"
      - ".github/workflows/p9-revision-gate.yml"
  pull_request:
    paths:
      - "src/aios_core/revision/**"
      - "src/aios_core/writeback/**"
      - "src/aios_core/dependency/**"
      - "src/aios_core/query/**"
      - "src/aios_core/summaries/**"
      - "src/aios_core/runtime/**"
      - "tests/integration/test_v3_cognition_revision.py"
      - "tests/integration/test_v3_cognition_writeback.py"
      - "tests/integration/test_v3_fused_turn_runtime.py"
      - "tests/integration/test_v3_dimension_summary.py"

jobs:
  p9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run P9 revision closure
        run: |
          pytest             tests/integration/test_v3_cognition_revision.py             tests/integration/test_v3_cognition_writeback.py             tests/integration/test_v3_fused_turn_runtime.py             tests/integration/test_v3_dimension_summary.py             tests/integration/test_v3_memory_recommendation.py             tests/integration/test_m0_prime_store_delta_and_search.py             tests/runtime/test_cognitive_runtime.py
