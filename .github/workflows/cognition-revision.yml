name: cognition-revision

on:
  push:
    branches: [main]
    paths:
      - "src/aios_core/revision/**"
      - "src/aios_core/dependency/**"
      - "src/aios_core/writeback/**"
      - "src/aios_core/query/**"
      - "tests/integration/test_v3_cognition_revision.py"
      - ".github/workflows/cognition-revision.yml"
  pull_request:
    paths:
      - "src/aios_core/revision/**"
      - "tests/integration/test_v3_cognition_revision.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_v3_cognition_revision.py
