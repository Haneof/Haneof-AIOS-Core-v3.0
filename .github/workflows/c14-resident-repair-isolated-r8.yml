name: C14 Resident Repair Isolated R8

on:
  push:
    branches:
      - c14/sem-res-sol-r8-3e8a71
    paths:
      - reviews/internal_habitation/c14-resident/semantic-repair-v1/runs/resident-repair-20260922-r8-3e8a71/live_driver.py
      - .github/workflows/c14-resident-repair-isolated-r8.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: c14-sem-repair-resident-isolated-r8-3e8a71
  cancel-in-progress: false

jobs:
  resident-isolated-r8:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout isolated Resident branch
        uses: actions/checkout@v4
        with:
          ref: c14/sem-res-sol-r8-3e8a71
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: |
          git config user.name "aios-resident-evidence"
          git config user.email "aios-resident-evidence@users.noreply.github.com"
      - run: python -m py_compile reviews/internal_habitation/c14-resident/semantic-repair-v1/runs/resident-repair-20260922-r8-3e8a71/live_driver.py
      - name: Run real Resident bridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESIDENT_PR_NUMBER: "88"
        run: python reviews/internal_habitation/c14-resident/semantic-repair-v1/runs/resident-repair-20260922-r8-3e8a71/live_driver.py
