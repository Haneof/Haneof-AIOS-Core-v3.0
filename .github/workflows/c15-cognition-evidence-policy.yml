name: c15-cognition-evidence-policy

on:
  push:
    branches: [main]
    paths:
      - "src/aios_core/policy/**"
      - "src/aios_core/writeback/**"
      - "src/aios_core/revision/**"
      - "src/aios_core/ai_world/**"
      - "src/aios_core/summaries/cognitive_derivation.py"
      - "src/aios_core/runtime/turn_runtime.py"
      - "tests/integration/test_v3_c15_cognition_evidence_policy.py"
      - ".github/workflows/c15-cognition-evidence-policy.yml"
  pull_request:
    paths:
      - "src/aios_core/policy/**"
      - "src/aios_core/writeback/**"
      - "src/aios_core/revision/**"
      - "src/aios_core/ai_world/**"
      - "src/aios_core/summaries/cognitive_derivation.py"
      - "src/aios_core/runtime/turn_runtime.py"
      - "tests/integration/test_v3_c15_cognition_evidence_policy.py"
      - ".github/workflows/c15-cognition-evidence-policy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: C15 unified cognition evidence policy
        run: pytest tests/integration/test_v3_c15_cognition_evidence_policy.py
      - name: Cognition entrypoint regressions
        run: |
          pytest \
            tests/integration/test_v3_cognition_writeback.py \
            tests/integration/test_v3_cognition_revision.py \
            tests/integration/test_v3_ai_world.py \
            tests/habitation/test_current_core_target.py
