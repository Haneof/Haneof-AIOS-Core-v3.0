name: c14-cognitive-derivation-scheduler

on:
  pull_request:
    paths:
      - "src/aios_core/contracts/enums.py"
      - "src/aios_core/storage/sqlite_store.py"
      - "src/aios_core/summaries/**"
      - "tests/integration/test_v3_c14_cognitive_derivation_scheduler.py"
      - ".github/workflows/c14-cognitive-derivation-scheduler.yml"
  push:
    branches: [main]
    paths:
      - "src/aios_core/contracts/enums.py"
      - "src/aios_core/storage/sqlite_store.py"
      - "src/aios_core/summaries/**"
      - "tests/integration/test_v3_c14_cognitive_derivation_scheduler.py"
      - ".github/workflows/c14-cognitive-derivation-scheduler.yml"

jobs:
  c14-scheduler-targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/integration/test_v3_c14_cognitive_derivation_scheduler.py tests/integration/test_v3_dimension_summary.py tests/integration/test_v3_summary_hierarchy.py

  dimension-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/integration/test_v3_dimension_summary.py tests/integration/test_v3_summary_hierarchy.py

  world-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/integration/test_m0_prime_store_delta_and_search.py

  c09-wake-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/integration/test_v3_wake_dispatch.py tests/integration/test_v3_execution_world.py tests/integration/test_v3_periodic_review.py tests/integration/test_v3_reality_ingest.py tests/integration/test_v3_fused_turn_runtime.py tests/runtime/test_cognitive_runtime.py

  cognitive-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/runtime/test_cognitive_runtime.py

  fused-turn-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/integration/test_v3_fused_turn_runtime.py tests/runtime/test_cognitive_runtime.py

  p15-periodic-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/integration/test_v3_periodic_review.py tests/integration/test_v3_fused_turn_runtime.py tests/integration/test_v3_ai_world.py tests/integration/test_v3_cognition_revision.py tests/integration/test_v3_execution_world.py tests/integration/test_v3_long_context_continuity.py tests/runtime/test_cognitive_runtime.py

  c13-metering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/runtime/test_metering_ledger.py tests/integration/test_v3_background_budget_gate.py tests/integration/test_v3_periodic_review.py

  p14-long-context:
