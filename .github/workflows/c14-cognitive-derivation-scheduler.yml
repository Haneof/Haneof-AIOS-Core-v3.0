      - run: pip install -e ".[dev]"
      - run: pytest -q tests/integration/test_v3_memory_recommendation.py tests/integration/test_m0_prime_store_delta_and_search.py

  p16-habitation-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/habitation

  p16-convergence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: Full AIOS Core and P16 regression
        run: pytest -q
