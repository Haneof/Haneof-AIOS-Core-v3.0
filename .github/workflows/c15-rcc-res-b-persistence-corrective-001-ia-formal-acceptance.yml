name: c15-rcc-res-b-persistence-corrective-001-ia-formal-acceptance

# INDEPENDENT ACCEPTANCE — review-only, evidence-only.
#
# This workflow does NOT modify PR #216, the candidate branch, the persistence
# canonical ref, or any Stage A / Stage B canonical state. It checks out the
# exact frozen candidate read-only and runs the reviewer's own probes against
# it, then re-runs the candidate's own gates and the full regression.
#
#   tested exact candidate : 63ca592359c7e3fd71d6cc4ba349949e4f0b80e3
#   canonical Stage B      : 15c75ac3e97c57a5fa1f3085c282a852994d9acf
#   canonical persistence  : refs/heads/persistence/c15-persistence-synthetic-run-ae5c57221c83
#
# The job is deliberately a SINGLE job: the freeze step (hash + pytest
# --collect-only) must complete before the first execution step runs, and step
# ordering inside one job is the mechanical guarantee of that.
#
# Every step appends to $GITHUB_STEP_SUMMARY so the whole evidence record is
# readable from the check-run API.

on:
  pull_request:
    paths:
      - ".github/workflows/c15-rcc-res-b-persistence-corrective-001-ia-formal-acceptance.yml"
      - "reviews/C15_RCC_RES_B_PERSISTENCE_CORRECTIVE_001_INDEPENDENT_ACCEPTANCE_2026-09-27/**"
  workflow_dispatch:

permissions:
  contents: write
  checks: write
  pull-requests: write

env:
  CANDIDATE: "63ca592359c7e3fd71d6cc4ba349949e4f0b80e3"
  STAGE_B: "15c75ac3e97c57a5fa1f3085c282a852994d9acf"
  CANON_REF: "refs/heads/persistence/c15-persistence-synthetic-run-ae5c57221c83"
  LIT: "reviews/C15_RCC_RES_B_PERSISTENCE_CORRECTIVE_001_INDEPENDENT_ACCEPTANCE_2026-09-27"
  C15_PERSISTED_WORKSPACE: /home/runner/ia-workspace
  EV: reviews/C15_RCC_RES_B_PERSISTENCE_CORRECTIVE_001_INDEPENDENT_ACCEPTANCE_2026-09-27/evidence-run
  EVBRANCH: ia/c15-persistence-corrective-001-evidence
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  formal-acceptance:
    name: ia-formal-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: review
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          path: cand
          ref: ${{ env.CANDIDATE }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install formal dependency set
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "pydantic==2.13.5" "pytest==8.4.2" pytest-timeout

      - name: 0. Verify exact candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e
          {
            echo "## IA formal acceptance"
            echo
            echo "- run: \`${{ github.run_id }}\`"
            echo "- tested exact candidate: \`${{ env.CANDIDATE }}\`"
            echo "- canonical Stage B commit: \`${{ env.STAGE_B }}\`"
            echo "- canonical persistence ref: \`${{ env.CANON_REF }}\` (READ-ONLY)"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$(git -C cand rev-parse HEAD)" = "${{ env.CANDIDATE }}" || { echo "CANDIDATE DRIFT"; exit 1; }
          git -C cand fetch --no-tags -q origin \
            "+${{ env.CANON_REF }}:refs/remotes/origin/persistence/ia-review" || true
          echo "candidate HEAD = $(git -C cand rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "canonical ref  = $(git -C cand rev-parse refs/remotes/origin/persistence/ia-review 2>/dev/null || echo 'n/a')" >> "$GITHUB_STEP_SUMMARY"
          git -C cand cat-file -e "${{ env.STAGE_B }}^{commit}" || { echo "STAGE B MISSING"; exit 1; }

      - name: 1. Freeze environment identity
        env:
          PYTHONPATH: /__w/${{ github.workspace }}/cand/src:/__w/${{ github.workspace }}/cand
          IA_CANDIDATE_REPO: /__w/${{ github.workspace }}/cand
        run: |
          set -uo pipefail
          set +e
          {
            echo
            echo "### formal environment"
            echo '```'
            python -c "import sys,pydantic,pytest,sqlite3;print('python',sys.version);print('pydantic',pydantic.VERSION);print('pytest',pytest.__version__);print('sqlite',sqlite3.sqlite_version)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 2. FREEZE probe hashes + collect-only enumeration (before first execution)
        id: freeze
        continue-on-error: true
        env:
          PYTHONPATH: /__w/${{ github.workspace }}/cand/src:/__w/${{ github.workspace }}/cand
          IA_CANDIDATE_REPO: /__w/${{ github.workspace }}/cand
        run: |
          set -uo pipefail
          set +e
          mkdir -p "review/$EV"
          python "review/$LIT/freeze_ia_probe_manifest.py" > "review/$LIT/freeze.log" 2>&1
          rc=$?
          {
            echo
            echo "### freeze (rc=$rc)"
            echo '```'
            tail -40 "review/$LIT/freeze.log" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp "review/$LIT/freeze.log" "review/$EV/00-freeze.log" 2>/dev/null || true
          cp "review/$LIT/PROBE_MANIFEST.json" "review/$EV/00-PROBE_MANIFEST.json" 2>/dev/null || true
          cp "review/$LIT/PROBE_MANIFEST.sha256" "review/$EV/00-PROBE_MANIFEST.sha256" 2>/dev/null || true
          cp "review/$LIT/probe_enumeration.txt" "review/$EV/00-probe_enumeration.txt" 2>/dev/null || true
          cp "review/$LIT/collect_only.txt" "review/$EV/00-collect_only.txt" 2>/dev/null || true
          if [ $rc -ne 0 ]; then
            while IFS= read -r l; do echo "::error title=IA-FREEZE::${l:0:900}"; done < "review/$LIT/freeze.log"
            exit 1
          fi

      - name: 2b. diagnostic dump of freeze state
        if: always()
        run: |
          set -uo pipefail
          set +e
          mkdir -p "review/$EV"
          {
            echo "--- ls review IA dir ---"
            ls -la "review/$LIT" || true
            echo "--- freeze.log ---"
            cat "review/$LIT/freeze.log" 2>/dev/null || echo "(absent)"
            echo "--- collect_only.txt ---"
            cat "review/$LIT/collect_only.txt" 2>/dev/null || echo "(absent)"
            echo "--- python / pytest ---"
            which python; python -V
          } > "review/$EV/00b-freeze-diagnostic.txt" 2>&1
          cat "review/$EV/00b-freeze-diagnostic.txt" || true

      - name: 3. Verify frozen manifest before first execution
        continue-on-error: true
        env:
          PYTHONPATH: /__w/${{ github.workspace }}/cand/src:/__w/${{ github.workspace }}/cand
          IA_CANDIDATE_REPO: /__w/${{ github.workspace }}/cand
        run: |
          set -uo pipefail
          set +e
          cd "review/$LIT"
          sha256sum ia_probes.py ia_child.py > probe-files.sha256
          {
            echo
            echo "### frozen probe hashes"
            echo '```'
            cat probe-files.sha256
            echo "manifest digest: $(cut -d' ' -f1 PROBE_MANIFEST.sha256)"
            echo
            echo "### frozen enumeration (pytest --collect-only)"
            echo '```'
            cat probe_enumeration.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp probe_enumeration.txt "review/$EV/00-probe_enumeration.txt" 2>/dev/null || true
          cp probe-files.sha256 "review/$EV/00-probe-files.sha256" 2>/dev/null || true
          if [ ! -s probe_enumeration.txt ]; then
            echo "::error title=IA-FREEZE::enumeration is empty"
            exit 1
          fi
          sha256sum -c PROBE_MANIFEST.sha256 || { echo "::error title=IA-FREEZE::manifest digest mismatch"; exit 1; }

      - name: 4. FIRST EXECUTION of the frozen adversarial probes
        continue-on-error: true
        env:
          PYTHONPATH: /__w/${{ github.workspace }}/cand/src:/__w/${{ github.workspace }}/cand
          IA_CANDIDATE_REPO: /__w/${{ github.workspace }}/cand
        run: |
          set -uo pipefail
          set +e
          cd "review/$LIT"
          python -m pytest -v -rA -o addopts= -p no:cacheprovider \
            --timeout=1800 --tb=line ia_probes.py > FIRST_RUN.log 2>&1
          rc=$?
          {
            echo
            echo "### IA FIRST RUN (frozen probes) exit=$rc"
            echo '```'
            grep -E "^(FAILED|ERROR|PASSED)" FIRST_RUN.log | head -50
            echo "..."
            tail -4 FIRST_RUN.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp FIRST_RUN.log "$GITHUB_WORKSPACE/review/$EV/01-ia-first-run.log" 2>/dev/null || true
          while IFS= read -r l; do echo "::error title=IA-FIRST-RUN::${l:0:900}"; done < <(grep -E "^(FAILED|ERROR)" FIRST_RUN.log)
          exit $rc

      - name: 5a. author gate 1 — K1-K5 frozen kill-point suite
        if: always()
        run: |
          set -uo pipefail
          set +e
          cd cand
          python -m pytest -v -o addopts= --timeout=1800 tests/c15_persistence/killpoints/test_killpoints.py > /tmp/k.txt 2>&1
          rc=$?; cp /tmp/k.txt "$GITHUB_WORKSPACE/review/$EV/02-k1-k5.log" || true
          { echo; echo "### K1-K5 (rc=$rc)"; echo '```'; tail -3 /tmp/k.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: 5b. author gate 2 — production wiring
        if: always()
        run: |
          set -uo pipefail
          set +e
          cd cand
          python -m pytest -v -o addopts= --timeout=1800 tests/c15_persistence/test_operator_wiring.py > /tmp/w.txt 2>&1
          rc=$?; cp /tmp/w.txt "$GITHUB_WORKSPACE/review/$EV/03-production-wiring.log" || true
          { echo; echo "### production wiring (rc=$rc)"; echo '```'; tail -3 /tmp/w.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: 5c. author gate 3 — environment / remote reattach
        if: always()
        run: |
          set -uo pipefail
          set +e
          cd cand
          python -m pytest -v -rs -o addopts= --timeout=1800 tests/c15_persistence/test_environment_reattach.py > /tmp/r.txt 2>&1
          rc=$?; cp /tmp/r.txt "$GITHUB_WORKSPACE/review/$EV/04-env-remote-reattach.log" || true
          { echo; echo "### env/remote reattach (rc=$rc)"; echo '```'; tail -4 /tmp/r.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: 5d. author gate 4 — resident-visible surface
        if: always()
        run: |
          set -uo pipefail
          set +e
          cd cand
          python -m pytest -v -o addopts= --timeout=1800 tests/c15_persistence/test_resident_surface.py > /tmp/s.txt 2>&1
          rc=$?; cp /tmp/s.txt "$GITHUB_WORKSPACE/review/$EV/05-resident-surface.log" || true
          { echo; echo "### resident surface (rc=$rc)"; echo '```'; tail -3 /tmp/s.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: 5e. author gate 5 — historical persistence journal (frozen unittest contract)
        if: always()
        run: |
          set -uo pipefail
          set +e
          sudo install -d -m 0755 /home/user
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" /home/user/c15-persistence-unit-probes
          cd cand
          python -m unittest discover -s tests/c15_persistence -p "test_journal.py" -v > /tmp/j.txt 2>&1
          rc=$?; cp /tmp/j.txt "$GITHUB_WORKSPACE/review/$EV/06-historical-journal.log" || true
          { echo; echo "### historical journal (rc=$rc)"; echo '```'; tail -4 /tmp/j.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: 5f. author gate 6 — src/aios_core/** zero diff
        if: always()
        run: |
          set -uo pipefail
          set +e
          cd cand
          n=$(git diff --name-only 56c01b919c397b67024df1acb320874144d87f42 HEAD -- src/aios_core/ | wc -l)
          { echo; echo "### src/aios_core zero diff vs merge-base 56c01b91: $n files"; } >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only 56c01b919c397b67024df1acb320874144d87f42 HEAD -- src/aios_core/ >> "$GITHUB_STEP_SUMMARY"
          test "$n" -eq 0

      - name: 6. full regression
        if: always()
        run: |
          set -uo pipefail
          set +e
          cd cand
          python -m pytest -q -rs -o addopts= -p no:cacheprovider --timeout=3600 tests/ > /tmp/full.txt 2>&1
          rc=$?
          {
            echo
            echo "### full regression (rc=$rc)"
            echo '```'
            grep -E "^(FAILED|ERROR)" /tmp/full.txt | head -30
            tail -3 /tmp/full.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp /tmp/full.txt "$GITHUB_WORKSPACE/review/$EV/07-full-regression.log" || true
          while IFS= read -r l; do echo "::error title=IA-FULL-REGRESSION::${l:0:900}"; done < <(grep -E "^(FAILED|ERROR)" /tmp/full.txt | head -10)
          exit $rc

      - name: 7. publish durable review evidence to the IA evidence branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e
          cd review
          mkdir -p "reviews/C15_RCC_RES_B_PERSISTENCE_CORRECTIVE_001_INDEPENDENT_ACCEPTANCE_2026-09-27/evidence-run"
          {
            echo "run_id: ${{ github.run_id }}"
            echo "run_attempt: ${{ github.run_attempt }}"
            echo "head_sha: ${{ github.sha }}"
            echo "tested_exact_candidate: ${{ env.CANDIDATE }}"
            echo "canonical_stage_b: ${{ env.STAGE_B }}"
            echo "generated_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "--- formal environment ---"
            python -c "import sys,pydantic,pytest,sqlite3;print('python',sys.version);print('pydantic',pydantic.VERSION);print('pytest',pytest.__version__);print('sqlite',sqlite3.sqlite_version)"
            echo
            echo "--- files ---"
            find "reviews/C15_RCC_RES_B_PERSISTENCE_CORRECTIVE_001_INDEPENDENT_ACCEPTANCE_2026-09-27/evidence-run" -type f -exec sha256sum {} \;
          } > "reviews/C15_RCC_RES_B_PERSISTENCE_CORRECTIVE_001_INDEPENDENT_ACCEPTANCE_2026-09-27/evidence-run/99-MANIFEST.txt"
          git config user.name "AIOS IA Reviewer"
          git config user.email "ia-reviewer@invalid.local"
          git add -A "reviews/C15_RCC_RES_B_PERSISTENCE_CORRECTIVE_001_INDEPENDENT_ACCEPTANCE_2026-09-27"
          if git diff --cached --quiet; then
            echo "no evidence change"
          else
            git commit -q -m "IA evidence run ${{ github.run_id }} @ ${{ github.sha }}"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/Haneof/Haneof-AIOS-Core-v3.0.git"               "HEAD:refs/heads/${{ env.EVBRANCH }}" || echo "EVIDENCE PUSH FAILED"
          fi
