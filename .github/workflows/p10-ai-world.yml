name: p10-ai-world

on:
  push:
    branches: [main]
    paths:
      - "src/aios_core/ai_world/**"
      - "src/aios_core/writeback/**"
      - "src/aios_core/revision/**"
      - "tests/integration/test_v3_ai_world.py"
      - ".github/workflows/p10-ai-world.yml"
  pull_request:
    paths:
      - "src/aios_core/ai_world/**"
      - "tests/integration/test_v3_ai_world.py"

jobs:
  p10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_v3_ai_world.py tests/integration/test_v3_cognition_revision.py tests/integration/test_v3_cognition_writeback.py
