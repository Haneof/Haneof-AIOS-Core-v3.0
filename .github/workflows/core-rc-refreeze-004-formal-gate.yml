              with urllib.request.urlopen(req) as r: files=json.load(r)
              names=[f["filename"] for f in files]
              rel=[x for x in names if x.startswith(relevant_prefixes) or x=="pyproject.toml"]
              if rel or n in (310,311,321):
                  rows.append({"number":n,"title":pr["title"],"head":pr["head"]["sha"],"draft":pr["draft"],"files":rel})
          with open(out,"w",encoding="utf-8") as f:
              for row in rows:
                  f.write(json.dumps(row,sort_keys=True)+"\n")
          print(f"relevant_open_prs={len(rows)}")
          for row in rows: print(json.dumps(row,sort_keys=True))
          nums={r["number"] for r in rows}
