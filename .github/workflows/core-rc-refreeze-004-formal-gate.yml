          test "$(git -C "$RC004_TARGET" rev-parse HEAD:pyproject.toml)" = "$FROZEN_PYPROJECT_BLOB"
          git -C "$RC004_TARGET" diff --quiet --
          git -C "$RC004_TARGET" diff --cached --quiet --
          test -z "$(git -C "$RC004_TARGET" status --porcelain --untracked-files=no)"
          if git config --local --get-regexp '^http\\..*\\.extraheader$' >"$RC004_OUT/terminal-extraheaders.txt" 2>/dev/null; then
            cat "$RC004_OUT/terminal-extraheaders.txt"
            echo "TERMINAL_CHECKOUT_CREDENTIAL_PRESENT"; exit 1
          fi
          git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/rc004/terminal-main"
          terminal_main="$(git rev-parse refs/remotes/rc004/terminal-main)"
          test -n "$RC004_LIVE_MAIN" || { echo "INITIAL_MAIN_SNAPSHOT_MISSING"; exit 1; }
          bash "$GITHUB_WORKSPACE/reviews/CORE_RC_REFREEZE_004_CORRECTIVE_003/probes/terminal_protected_drift_guard.sh" "$RC004_LIVE_MAIN" "$terminal_main" "$RC004_OUT/terminal-protected-drift.txt"
          {
            echo "terminal_candidate_head=$(git rev-parse HEAD)"
            echo "terminal_remote_head=$remote_head"
            echo "terminal_frozen_head=$(git -C "$RC004_TARGET" rev-parse HEAD)"
            echo "terminal_frozen_root_tree=$(git -C "$RC004_TARGET" rev-parse HEAD^{tree})"
            echo "terminal_frozen_core_tree=$(git -C "$RC004_TARGET" rev-parse HEAD:src/aios_core)"
