          mkdir -p "$OUT"
          if [ -n "${RC004_TARGET:-}" ] && [ -d "$RC004_TARGET/.git" -o -e "$RC004_TARGET/.git" ]; then
            python - "$RC004_TARGET" "$OUT/source_manifest_runtime.json" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root=Path(sys.argv[1]); out=Path(sys.argv[2])
          def g(*args): return subprocess.check_output(["git","-C",str(root),*args],text=True).strip()
          paths=["src/aios_core","tests",".github/workflows","pyproject.toml","docs/constitution","governance/AIOS_CORE_BASELINE_001_DECISION_2026-09-24.md"]
          obj={p:g("rev-parse",f"HEAD:{p}") for p in paths}
          files=[]
          for line in g("ls-tree","-r","-l","HEAD").splitlines():
              meta,path=line.split("\t",1); parts=meta.split()
              files.append({"path":path,"mode":parts[0],"type":parts[1],"sha":parts[2],"size":None if parts[3]=="-" else int(parts[3])})
          manifest={"software_sha":g("rev-parse","HEAD"),"root_tree":g("rev-parse","HEAD^{tree}"),"objects":obj,"files":files}
          out.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
          fi
          find "$OUT" -maxdepth 1 -type f ! -name 'SHA256SUMS.runtime' -print0 | sort -z | xargs -0 sha256sum > "$OUT/SHA256SUMS.runtime" || true
          cat "$OUT/SHA256SUMS.runtime" || true


