  rc004-postread-control-gate:
    name: RC004 disposable hosted post-read control gate
    if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, '[W30-POSTREAD-CONTROL]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Read canonical A or successor B at control entry
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$CANONICAL_CORRECTIVE_BRANCH"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          response="$RUNNER_TEMP/w30-control-entry-branch.json"
          set +e
          code="$(curl -sS -o "$response" -w '%{http_code}' "${headers[@]}" "$api/git/ref/heads/$CANONICAL_CORRECTIVE_BRANCH")"
          rc=$?
          set -e
          test "$rc" -eq 0 || { echo "CONTROL_ENTRY_TRANSPORT_FAILURE rc=$rc"; exit 1; }
          test "$code" = "200" || { echo "CONTROL_ENTRY_HTTP_$code"; cat "$response"; exit 1; }
          head="$(jq -r '.object.sha // empty' "$response")"
          test "$head" = "$GITHUB_SHA" || { echo "CONTROL_ENTRY_HEAD_MISMATCH remote=$head event=$GITHUB_SHA"; exit 1; }
          echo "POSTREAD_CONTROL_GATE=PASS event_sha=$GITHUB_SHA"

  rc004-mandatory-pin-publisher:
    name: RC004 mandatory exact-pin publisher
    needs: [rc004-freeze-gate, rc004-postread-control-gate]
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && needs.rc004-freeze-gate.result == 'success') || (github.event_name == 'push' && needs.rc004-postread-control-gate.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pin_comment_id: ${{ steps.publish.outputs.comment_id }}
    steps:
      - name: Publish provisional exact candidate pin with pre/post identity checks
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_RESULT: ${{ needs.rc004-freeze-gate.result == 'success' && 'success' || needs.rc004-postread-control-gate.result }}
          GATE_KIND: ${{ needs.rc004-freeze-gate.result == 'success' && 'formal' || 'POSTREAD_CONTROL_ONLY' }}
        run: |
          set -euo pipefail
          test "$GATE_RESULT" = "success"
          if [ "$GATE_KIND" = "formal" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || { echo "FORMAL_PUBLISHER_EVENT_NOT_WORKFLOW_DISPATCH"; exit 1; }
            pin_title="CORE-RC-REFREEZE-004-POST-INTEGRATION-FINALIZATION-CORRECTIVE-008 provisional exact pin"
          elif [ "$GATE_KIND" = "POSTREAD_CONTROL_ONLY" ]; then
            test "$GITHUB_EVENT_NAME" = "push" || { echo "CONTROL_PUBLISHER_EVENT_NOT_PUSH"; exit 1; }
            pin_title="CORE-RC-REFREEZE-004-POST-INTEGRATION-FINALIZATION-CORRECTIVE-008 POSTREAD_CONTROL_ONLY pin"
          else
            echo "PIN_GATE_KIND_INVALID"; exit 1
          fi
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          pre="$RUNNER_TEMP/rc004-pre-publish-branch.json"
          set +e
          pre_code="$(curl -sS -o "$pre" -w '%{http_code}' "${headers[@]}" "$api/git/ref/heads/$CANONICAL_CORRECTIVE_BRANCH")"
          pre_rc=$?
          set -e
          test "$pre_rc" -eq 0 || { echo "PRE_PUBLISH_BRANCH_QUERY_TRANSPORT_FAILURE rc=$pre_rc"; exit 1; }
          test "$pre_code" = "200" || { echo "PRE_PUBLISH_BRANCH_QUERY_HTTP_$pre_code"; cat "$pre"; exit 1; }
          pre_head="$(jq -r '.object.sha // empty' "$pre")"
          test "$pre_head" = "$GITHUB_SHA" || { echo "PRE_PUBLISH_REMOTE_HEAD_MISMATCH remote=$pre_head event=$GITHUB_SHA"; exit 1; }
          echo "PRE_PUBLISH_REMOTE_HEAD_MATCH=$pre_head"

          body="$RUNNER_TEMP/rc004-mandatory-pin.md"
          {
            echo "## $pin_title"
            echo
            echo "- task: CORE-RC-REFREEZE-004-POST-INTEGRATION-FINALIZATION-CORRECTIVE-008"
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- run_attempt: $GITHUB_RUN_ATTEMPT"
            echo "- event: $GITHUB_EVENT_NAME"
            echo "- exact_candidate_sha: $GITHUB_SHA"
            echo "- frozen_software_sha: 1cee3c5ad12f4b9098232bae11b51df786c5eb2f"
            echo "- gate_kind: $GATE_KIND"
            echo "- gate_result: $GATE_RESULT"
            echo "- workflow: $GITHUB_WORKFLOW"
            echo "- canonical_branch: $CANONICAL_CORRECTIVE_BRANCH"
            echo "- publication_contract: HTTP_201_REQUIRED"
            echo "- publication_state: PROVISIONAL_PENDING_FINAL_IDENTITY_SEAL"
            echo "- authoritative_success_contract: live predicate only; overall_run_SUCCESS + exact-run-and-attempt seal + canonical branch equals exact candidate SHA at acceptance time + no newer workflow run; any later A-to-B movement invalidates this provisional pin"
            if [ "$GATE_KIND" = "POSTREAD_CONTROL_ONLY" ]; then
              echo "- control_pin: NOT_A_FORMAL_RELEASE_OR_ACCEPTANCE_PIN"
            fi
          } > "$body"
          jq -n --rawfile body "$body" '{body:$body}' > "$RUNNER_TEMP/rc004-mandatory-pin.json"

          set +e
          code="$(curl -sS -o "$RUNNER_TEMP/rc004-mandatory-pin-response.json" -w '%{http_code}' -X POST "${headers[@]}" "$api/commits/$GITHUB_SHA/comments" --data @"$RUNNER_TEMP/rc004-mandatory-pin.json")"
          curl_rc=$?
          set -e
          test "$curl_rc" -eq 0 || { echo "PIN_PUBLISH_TRANSPORT_FAILURE rc=$curl_rc"; exit 1; }
          echo "commit_comment_http_code=$code"
          if [ "$code" != "201" ]; then
            cat "$RUNNER_TEMP/rc004-mandatory-pin-response.json"
            exit 1
          fi
          comment_id="$(jq -r '.id // empty' "$RUNNER_TEMP/rc004-mandatory-pin-response.json")"
          test -n "$comment_id" || { echo "PIN_COMMENT_ID_MISSING"; exit 1; }
          echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"
          echo "provisional_pin_comment_id=$comment_id"

          post="$RUNNER_TEMP/rc004-post-publish-branch.json"
          set +e
          post_code="$(curl -sS -o "$post" -w '%{http_code}' "${headers[@]}" "$api/git/ref/heads/$CANONICAL_CORRECTIVE_BRANCH")"
          post_rc=$?
          set -e
          test "$post_rc" -eq 0 || { echo "POST_PUBLISH_BRANCH_QUERY_TRANSPORT_FAILURE rc=$post_rc"; exit 1; }
          test "$post_code" = "200" || { echo "POST_PUBLISH_BRANCH_QUERY_HTTP_$post_code"; cat "$post"; exit 1; }
          post_head="$(jq -r '.object.sha // empty' "$post")"
          test "$post_head" = "$GITHUB_SHA" || { echo "POST_PUBLISH_REMOTE_HEAD_MISMATCH remote=$post_head event=$GITHUB_SHA"; exit 1; }
          echo "POST_PUBLISH_REMOTE_HEAD_MATCH=$post_head"

  rc004-whole-run-identity-seal:
    name: RC004 whole-run identity seal
    needs: [rc004-freeze-gate, rc004-mandatory-pin-publisher]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.rc004-freeze-gate.result == 'success' && needs.rc004-mandatory-pin-publisher.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GATE_RESULT: ${{ needs.rc004-freeze-gate.result }}
      PUBLISHER_RESULT: ${{ needs.rc004-mandatory-pin-publisher.result }}
      PIN_COMMENT_ID: ${{ needs.rc004-mandatory-pin-publisher.outputs.pin_comment_id }}
    steps:
      - name: Validate exact run and pin, then perform the last canonical-branch read
        id: final_identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GATE_RESULT" = "success"
          test "$PUBLISHER_RESULT" = "success"
          test "$GITHUB_REF" = "refs/heads/$CANONICAL_CORRECTIVE_BRANCH"
          test -n "$PIN_COMMENT_ID"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          run_json="$RUNNER_TEMP/rc004-final-seal-run.json"
          set +e
          run_code="$(curl -sS -o "$run_json" -w '%{http_code}' "${headers[@]}" "$api/actions/runs/$GITHUB_RUN_ID")"
          run_rc=$?
          set -e
          test "$run_rc" -eq 0 || { echo "FINAL_SEAL_RUN_QUERY_TRANSPORT_FAILURE rc=$run_rc"; exit 1; }
          test "$run_code" = "200" || { echo "FINAL_SEAL_RUN_QUERY_HTTP_$run_code"; cat "$run_json"; exit 1; }
          test "$(jq -r '.id // empty' "$run_json")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.head_sha // empty' "$run_json")" = "$GITHUB_SHA"
          test "$(jq -r '.head_branch // empty' "$run_json")" = "$CANONICAL_CORRECTIVE_BRANCH"
          test "$(jq -r '.run_attempt // empty' "$run_json")" = "$GITHUB_RUN_ATTEMPT"
          test "$(jq -r '.event // empty' "$run_json")" = "workflow_dispatch" || { echo "FINAL_SEAL_EVENT_NOT_WORKFLOW_DISPATCH"; exit 1; }
          test "$(jq -r '.name // empty' "$run_json")" = "core-rc-refreeze-004-formal-gate"
          test "$(jq -r '.path // empty' "$run_json")" = ".github/workflows/core-rc-refreeze-004-formal-gate.yml"
          current_run_number="$(jq -r '.run_number // empty' "$run_json")"
          [[ "$current_run_number" =~ ^[0-9]+$ ]] || { echo "FINAL_SEAL_RUN_NUMBER_MISSING"; exit 1; }
          echo "RC004_CURRENT_RUN_NUMBER=$current_run_number" >> "$GITHUB_ENV"

          comment_json="$RUNNER_TEMP/rc004-final-seal-comment.json"
          set +e
          comment_code="$(curl -sS -o "$comment_json" -w '%{http_code}' "${headers[@]}" "$api/comments/$PIN_COMMENT_ID")"
          comment_rc=$?
          set -e
          test "$comment_rc" -eq 0 || { echo "FINAL_SEAL_COMMENT_QUERY_TRANSPORT_FAILURE rc=$comment_rc"; exit 1; }
          test "$comment_code" = "200" || { echo "FINAL_SEAL_COMMENT_QUERY_HTTP_$comment_code"; cat "$comment_json"; exit 1; }
          body="$(jq -r '.body // empty' "$comment_json")"
          grep -Fq -- "## CORE-RC-REFREEZE-004-POST-INTEGRATION-FINALIZATION-CORRECTIVE-008 provisional exact pin" <<<"$body"
          grep -Fq -- "- task: CORE-RC-REFREEZE-004-POST-INTEGRATION-FINALIZATION-CORRECTIVE-008" <<<"$body"
          grep -Fxq -- "- event: workflow_dispatch" <<<"$body"
          grep -Fxq -- "- gate_kind: formal" <<<"$body"
          if grep -Fq -- "POSTREAD_CONTROL_ONLY" <<<"$body"; then
            echo "FINAL_SEAL_CONTROL_PIN_REJECTED"; exit 1
          fi
          grep -Fq -- "- run_id: $GITHUB_RUN_ID" <<<"$body"
          grep -Fq -- "- run_attempt: $GITHUB_RUN_ATTEMPT" <<<"$body"
          grep -Fq -- "- exact_candidate_sha: $GITHUB_SHA" <<<"$body"
          grep -Fq -- "- canonical_branch: $CANONICAL_CORRECTIVE_BRANCH" <<<"$body"
          grep -Fq -- "- publication_state: PROVISIONAL_PENDING_FINAL_IDENTITY_SEAL" <<<"$body"

          branch_json="$RUNNER_TEMP/rc004-final-seal-branch.json"
          set +e
          branch_code="$(curl -sS -o "$branch_json" -w '%{http_code}' "${headers[@]}" "$api/git/ref/heads/$CANONICAL_CORRECTIVE_BRANCH")"
          branch_rc=$?
          set -e
          test "$branch_rc" -eq 0 || { echo "FINAL_SEAL_BRANCH_QUERY_TRANSPORT_FAILURE rc=$branch_rc"; exit 1; }
          test "$branch_code" = "200" || { echo "FINAL_SEAL_BRANCH_QUERY_HTTP_$branch_code"; cat "$branch_json"; exit 1; }
          branch_head="$(jq -r '.object.sha // empty' "$branch_json")"
          test "$branch_head" = "$GITHUB_SHA" || { echo "FINAL_SEAL_REMOTE_HEAD_MISMATCH remote=$branch_head event=$GITHUB_SHA"; exit 1; }
          echo "FINAL_CANONICAL_BRANCH_READ=PASS head=$branch_head"
          echo "POST_READ_AUTHORITY_PENDING_SETTLE=TRUE"

      - name: Post-read settle barrier and successor-run exclusion
        shell: bash
        run: |
          set -euo pipefail
          echo "POST_READ_SETTLE_BARRIER_STARTED event_sha=$GITHUB_SHA run=$GITHUB_RUN_ID"
          sleep 180
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          branch_q="$(jq -rn --arg branch "$CANONICAL_CORRECTIVE_BRANCH" '$branch|@uri')"
          url="$api/actions/workflows/core-rc-refreeze-004-formal-gate.yml/runs?branch=$branch_q&per_page=100"
          runs_json="$RUNNER_TEMP/rc004-postread-workflow-runs.json"
          set +e
          code="$(curl -sS -o "$runs_json" -w '%{http_code}' "${headers[@]}" "$url")"
          curl_rc=$?
          set -e
          test "$curl_rc" -eq 0 || { echo "POST_READ_RUN_LIST_TRANSPORT_FAILURE rc=$curl_rc"; exit 1; }
          test "$code" = "200" || { echo "POST_READ_RUN_LIST_HTTP_$code"; cat "$runs_json"; exit 1; }
          test "$(jq -r '.workflow_runs | type' "$runs_json")" = "array"
          self_count="$(jq --argjson id "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" --arg branch "$CANONICAL_CORRECTIVE_BRANCH" --argjson attempt "$GITHUB_RUN_ATTEMPT" '[.workflow_runs[] | select(.id == $id and .head_sha == $sha and .head_branch == $branch and .run_attempt == $attempt and .event == "workflow_dispatch")] | length' "$runs_json")"
          test "$self_count" = "1" || { echo "POST_READ_CURRENT_RUN_NOT_IN_WORKFLOW_LEDGER count=$self_count"; exit 1; }
          newer="$(jq -c --argjson current "$RC004_CURRENT_RUN_NUMBER" '[.workflow_runs[] | select(.run_number > $current) | {id,run_number,head_sha,status,conclusion}]' "$runs_json")"
          test "$newer" = "[]" || { echo "POST_READ_SUPERSEDED_BY_NEWER_RUN=$newer"; exit 1; }
          echo "POST_READ_SUCCESSOR_RUN_EXCLUSION=PASS current_run=$GITHUB_RUN_ID run_number=$RC004_CURRENT_RUN_NUMBER"
          echo "WHOLE_RUN_IDENTITY_SEAL=PASS head=$GITHUB_SHA comment_id=$PIN_COMMENT_ID"

  rc004-postread-control-seal:
    name: RC004 hosted post-read A-to-B control seal
    needs: [rc004-postread-control-gate, rc004-mandatory-pin-publisher]
    if: ${{ always() && needs.rc004-postread-control-gate.result == 'success' && needs.rc004-mandatory-pin-publisher.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GATE_RESULT: ${{ needs.rc004-postread-control-gate.result }}
      PUBLISHER_RESULT: ${{ needs.rc004-mandatory-pin-publisher.result }}
      PIN_COMMENT_ID: ${{ needs.rc004-mandatory-pin-publisher.outputs.pin_comment_id }}
      CONTROL_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Validate exact control run and pin, then perform the last canonical-branch read
        shell: bash
        run: |
          set -euo pipefail
          test "$GATE_RESULT" = "success"
          test "$PUBLISHER_RESULT" = "success"
          test "$GITHUB_REF" = "refs/heads/$CANONICAL_CORRECTIVE_BRANCH"
          if [[ "$CONTROL_COMMIT_MESSAGE" == "[W30-POSTREAD-CONTROL] A"* ]]; then
            control_role=A
          elif [[ "$CONTROL_COMMIT_MESSAGE" == "[W30-POSTREAD-CONTROL] B"* ]]; then
            control_role=B
          else
            echo "POSTREAD_CONTROL_ROLE_INVALID message=$CONTROL_COMMIT_MESSAGE"; exit 1
          fi
          echo "RC004_CONTROL_ROLE=$control_role" >> "$GITHUB_ENV"
          test -n "$PIN_COMMENT_ID"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          run_json="$RUNNER_TEMP/w30-control-run.json"
          set +e
          run_code="$(curl -sS -o "$run_json" -w '%{http_code}' "${headers[@]}" "$api/actions/runs/$GITHUB_RUN_ID")"
          run_rc=$?
          set -e
          test "$run_rc" -eq 0 || { echo "CONTROL_RUN_QUERY_TRANSPORT_FAILURE rc=$run_rc"; exit 1; }
          test "$run_code" = "200" || { echo "CONTROL_RUN_QUERY_HTTP_$run_code"; cat "$run_json"; exit 1; }
          test "$(jq -r '.id // empty' "$run_json")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.head_sha // empty' "$run_json")" = "$GITHUB_SHA"
          test "$(jq -r '.head_branch // empty' "$run_json")" = "$CANONICAL_CORRECTIVE_BRANCH"
          test "$(jq -r '.run_attempt // empty' "$run_json")" = "$GITHUB_RUN_ATTEMPT"
          current_run_number="$(jq -r '.run_number // empty' "$run_json")"
          [[ "$current_run_number" =~ ^[0-9]+$ ]] || { echo "CONTROL_RUN_NUMBER_MISSING"; exit 1; }
          echo "RC004_CURRENT_RUN_NUMBER=$current_run_number" >> "$GITHUB_ENV"

          comment_json="$RUNNER_TEMP/w30-control-comment.json"
          set +e
          comment_code="$(curl -sS -o "$comment_json" -w '%{http_code}' "${headers[@]}" "$api/comments/$PIN_COMMENT_ID")"
          comment_rc=$?
          set -e
          test "$comment_rc" -eq 0 || { echo "CONTROL_COMMENT_QUERY_TRANSPORT_FAILURE rc=$comment_rc"; exit 1; }
          test "$comment_code" = "200" || { echo "CONTROL_COMMENT_QUERY_HTTP_$comment_code"; cat "$comment_json"; exit 1; }
          body="$(jq -r '.body // empty' "$comment_json")"
          grep -Fq -- "## CORE-RC-REFREEZE-004-POST-INTEGRATION-FINALIZATION-CORRECTIVE-008 POSTREAD_CONTROL_ONLY pin" <<<"$body"
          grep -Fq -- "- task: CORE-RC-REFREEZE-004-POST-INTEGRATION-FINALIZATION-CORRECTIVE-008" <<<"$body"
          grep -Fq -- "- run_id: $GITHUB_RUN_ID" <<<"$body"
          grep -Fq -- "- run_attempt: $GITHUB_RUN_ATTEMPT" <<<"$body"
          grep -Fq -- "- exact_candidate_sha: $GITHUB_SHA" <<<"$body"
          grep -Fq -- "- canonical_branch: $CANONICAL_CORRECTIVE_BRANCH" <<<"$body"
          grep -Fxq -- "- gate_kind: POSTREAD_CONTROL_ONLY" <<<"$body"
          grep -Fxq -- "- event: push" <<<"$body"
          grep -Fq -- "- control_pin: NOT_A_FORMAL_RELEASE_OR_ACCEPTANCE_PIN" <<<"$body"

          branch_json="$RUNNER_TEMP/w30-control-last-branch-read.json"
          set +e
          branch_code="$(curl -sS -o "$branch_json" -w '%{http_code}' "${headers[@]}" "$api/git/ref/heads/$CANONICAL_CORRECTIVE_BRANCH")"
          branch_rc=$?
          set -e
          test "$branch_rc" -eq 0 || { echo "CONTROL_LAST_BRANCH_READ_TRANSPORT_FAILURE rc=$branch_rc"; exit 1; }
          test "$branch_code" = "200" || { echo "CONTROL_LAST_BRANCH_READ_HTTP_$branch_code"; cat "$branch_json"; exit 1; }
          branch_head="$(jq -r '.object.sha // empty' "$branch_json")"
          test "$branch_head" = "$GITHUB_SHA" || { echo "CONTROL_LAST_BRANCH_READ_MISMATCH remote=$branch_head event=$GITHUB_SHA"; exit 1; }
          echo "POSTREAD_CONTROL_LAST_CANONICAL_READ=PASS role=$control_role sha=$branch_head run=$GITHUB_RUN_ID"
          echo "POSTREAD_CONTROL_LAST_CANONICAL_READ_COMPLETE"

      - name: Controllable post-read barrier
        shell: bash
        run: |
          set -euo pipefail
          echo "POSTREAD_BARRIER_READY role=$RC004_CONTROL_ROLE run=$GITHUB_RUN_ID event_sha=$GITHUB_SHA"
          if [ "$RC004_CONTROL_ROLE" = "A" ]; then
            sleep 180
          else
            sleep 5
          fi
          echo "POSTREAD_BARRIER_RELEASED role=$RC004_CONTROL_ROLE"

      - name: Fail stale A or seal stable successor B from workflow-run lineage
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          branch_q="$(jq -rn --arg branch "$CANONICAL_CORRECTIVE_BRANCH" '$branch|@uri')"
          url="$api/actions/workflows/core-rc-refreeze-004-formal-gate.yml/runs?branch=$branch_q&per_page=100"
          runs_json="$RUNNER_TEMP/w30-control-runs.json"
          set +e
          code="$(curl -sS -o "$runs_json" -w '%{http_code}' "${headers[@]}" "$url")"
          curl_rc=$?
          set -e
          test "$curl_rc" -eq 0 || { echo "CONTROL_RUN_LIST_TRANSPORT_FAILURE rc=$curl_rc"; exit 1; }
          test "$code" = "200" || { echo "CONTROL_RUN_LIST_HTTP_$code"; cat "$runs_json"; exit 1; }
          newer="$(jq -c --argjson current "$RC004_CURRENT_RUN_NUMBER" '[.workflow_runs[] | select(.run_number > $current) | {id,run_number,head_sha,status,conclusion}]' "$runs_json")"
          if [ "$RC004_CONTROL_ROLE" = "A" ]; then
            test "$newer" != "[]" || { echo "OLD_A_CONTROL_DID_NOT_OBSERVE_SUCCESSOR_B"; exit 1; }
            echo "OLD_A_POSTREAD_SUPERSESSION_DETECTED=$newer"
            echo "OLD_A_MUST_NOT_SEAL_SUCCESS=PASS"
            exit 1
          fi
          test "$newer" = "[]" || { echo "SUCCESSOR_B_ALREADY_SUPERSEDED=$newer"; exit 1; }
          echo "SUCCESSOR_B_POSTREAD_CONTROL=PASS run=$GITHUB_RUN_ID sha=$GITHUB_SHA"
          echo "POSTREAD_CONTROL_SEAL=PASS"
