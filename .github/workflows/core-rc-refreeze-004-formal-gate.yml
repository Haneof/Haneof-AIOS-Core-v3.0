name: core-rc-refreeze-004-formal-gate

on:
  push:
    branches:
      - "release/core-rc-refreeze-004-finalization-corrective-008-window46"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: core-rc-refreeze-004-${{ github.ref }}
  cancel-in-progress: true

env:
  FROZEN_SHA: "1cee3c5ad12f4b9098232bae11b51df786c5eb2f"
  FROZEN_ROOT_TREE: "70b2711258567863ea0d93025a6a07e39631726a"
  FROZEN_CORE_TREE: "16f1487e291b009c55bee402abfd79fdacbae960"
  FROZEN_TESTS_TREE: "9db1bfa08143bc99fe03836e2752ee6e05694eb6"
  FROZEN_WORKFLOWS_TREE: "72cde9d2dc2b35d071bfa36c954dac2faff4a803"
  FROZEN_PYPROJECT_BLOB: "b38833c7537fa60d5c2f02ed4bb19158d8995a11"
  W20_REVIEW: "220311759e88fb3948ad3f4dba655058e0f392a8"
  W17_REVIEW: "e4161dd0ad0a2f825461311a1c8c5ff8234a07f8"
  W20_PROBE_DIR: "reviews/CORE_BACKGROUND_LATE_TRUSTED_RETURN_001_CORRECTIVE_002_IA_WINDOW_20/reviewer_probes"
  W17_PROBE_DIR: "reviews/CORE_BACKGROUND_LATE_TRUSTED_RETURN_001_CORRECTIVE_001_IA_WINDOW_17/reviewer_probes"
  SUITE_A_BLOB: "527edd8d92243cabc417f176c0f7c4f6c358e65c"
  SUITE_A_SHA256: "ec1dc5c2c5406d5d9e74825f62e0a17fb80f8ebd6dc250817fa048511ce292b5"
  SUITE_B_BLOB: "867f0ee993595c2d334a3940ad66308166693c97"
  SUITE_B_SHA256: "769242465817f31734661ba7ba9c3d5f7d06b8d3f5235d72d2026956d9b98eb1"
  W17_BLOB: "bb25d184a5cb813ae4058de9a75fa23d9591b041"
  W17_SHA256: "a6db33956bb7bc1e8af19cddd7cebdd320604bba98b6a2b906fd1eb363fba0c3"
  FORMAL_PYTHON: "3.12.14"
  FORMAL_PYDANTIC: "2.13.5"
  FORMAL_PYTEST: "8.4.2"
  ACCEPTED_RELEASE_BASELINE: "9eba4710e3cd841650191cb89f2126ca5c5b11c3"
  CANONICAL_CORRECTIVE_BRANCH: "release/core-rc-refreeze-004-finalization-corrective-008-window46"

jobs:
  rc004-freeze-gate:
    name: RC004 exact frozen software / formal gate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact RC evidence candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Historical C003 Probe Trust-Root Identity Gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          baseline = os.environ['ACCEPTED_RELEASE_BASELINE']
          assert baseline == '9eba4710e3cd841650191cb89f2126ca5c5b11c3', 'C003_BASELINE_NOT_ACCEPTED'
          source = git('show', 'HEAD:.github/workflows/core-rc-refreeze-004-formal-gate.yml')
          prefix = 'reviews/' + 'CORE_RC_REFREEZE_004_CORRECTIVE_003/'
          paths = set()
          for match in re.finditer(re.escape(prefix), source):
              tail = source[match.start():]
              parsed = re.match(re.escape(prefix) + r'[A-Za-z0-9_./-]+', tail)
              if parsed is None:
                  raise SystemExit('C003_REFERENCE_UNPARSEABLE')
              path = parsed.group(0)
              boundary = tail[len(path):len(path)+1]
              if boundary not in ('"', "'", ' ', '\n', ')') or path.endswith('/') or '..' in path.split('/'):
                  raise SystemExit('C003_REFERENCE_UNPARSEABLE ' + path)
              paths.add(path)
          if not paths:
              raise SystemExit('C003_REFERENCES_MISSING')
          rows = []
          for path in sorted(paths):
              try:
                  accepted = git('rev-parse', '--verify', baseline + ':' + path)
                  candidate = git('rev-parse', '--verify', 'HEAD:' + path)
                  if git('cat-file', '-t', accepted) != 'blob' or git('cat-file', '-t', candidate) != 'blob':
                      raise ValueError('not a file blob')
              except (subprocess.CalledProcessError, ValueError):
                  raise SystemExit('C003_TRUST_ROOT_PATH_MISSING_OR_NOT_BLOB ' + path)
              if accepted != candidate:
                  raise SystemExit('C003_TRUST_ROOT_BLOB_MISMATCH ' + path)
              rows.append(f'{path} accepted_baseline_blob={accepted} candidate_blob={candidate} MATCH=YES')
          rows += [f'TOTAL_REFERENCED_C003_FILES={len(paths)}', f'TOTAL_MATCHED_C003_FILES={len(rows)}', 'C003_TRUST_ROOT_GATE=PASS']
          out = Path(os.environ['GITHUB_WORKSPACE']) / 'reviews/CORE_RC_REFREEZE_004_FINALIZATION_CORRECTIVE_008/ci-output/raw/C003_TRUST_ROOT_BLOBS.txt'
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          print('\n'.join(rows))
          PY

      - name: Select formal CPython 3.12.14
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.FORMAL_PYTHON }}"

      - name: Exact-head, frozen identity, post-integration drift, and candidate scope
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/reviews/CORE_RC_REFREEZE_004_FINALIZATION_CORRECTIVE_008/ci-output"
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "$CANONICAL_CORRECTIVE_BRANCH" || { echo "NON_CANONICAL_CORRECTIVE_REF $GITHUB_REF_NAME"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF" = "refs/heads/$CANONICAL_CORRECTIVE_BRANCH" || { echo "WORKFLOW_DISPATCH_REF_REJECTED $GITHUB_REF"; exit 1; }
          fi
          if git config --local --get-regexp '^http\\..*\\.extraheader$' >"$OUT/checkout-extraheaders.txt" 2>/dev/null; then
            cat "$OUT/checkout-extraheaders.txt"
            echo "CHECKOUT_CREDENTIAL_PERSISTED"; exit 1
          fi
          git fetch --all --prune
          git branch -r --sort=refname | sed "s/^[[:space:]]*//" | tee "$OUT/remote-branch-snapshot.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA" || { echo "FORMAL_CI_NOT_EXACT_HEAD remote=$remote_head event=$GITHUB_SHA"; exit 1; }

          git fetch --no-tags --force origin "+refs/heads/main:refs/remotes/rc004/main"
          live_main="$(git rev-parse refs/remotes/rc004/main)"
          test "$live_main" = "$ACCEPTED_RELEASE_BASELINE" || { echo "MAIN_MOVED_SINCE_PM_ADJUDICATION"; exit 1; }
          test "$(git rev-parse HEAD^)" = "$ACCEPTED_RELEASE_BASELINE" || { echo "CANDIDATE_PARENT_NOT_ACCEPTED_BASELINE"; exit 1; }
          git cat-file -e "${FROZEN_SHA}^{commit}"

          target="$RUNNER_TEMP/aios-rc004-frozen-software"
          git worktree add --detach "$target" "$FROZEN_SHA"
          test "$(git -C "$target" rev-parse HEAD)" = "$FROZEN_SHA"
          test "$(git -C "$target" rev-parse HEAD^{tree})" = "$FROZEN_ROOT_TREE"
          test "$(git -C "$target" rev-parse HEAD:src/aios_core)" = "$FROZEN_CORE_TREE"
          test "$(git -C "$target" rev-parse HEAD:tests)" = "$FROZEN_TESTS_TREE"
          test "$(git -C "$target" rev-parse HEAD:.github/workflows)" = "$FROZEN_WORKFLOWS_TREE"
          test "$(git -C "$target" rev-parse HEAD:pyproject.toml)" = "$FROZEN_PYPROJECT_BLOB"

          bash "$GITHUB_WORKSPACE/reviews/CORE_RC_REFREEZE_004_CORRECTIVE_003/probes/terminal_protected_drift_guard.sh" "$FROZEN_SHA" "$live_main" "$OUT/post-integration-drift.txt" || true

          base="$(git merge-base refs/remotes/rc004/main HEAD)"
          git diff --name-status "$base" HEAD | tee "$OUT/candidate-scope.txt"
          if git diff --no-renames --name-only "$base" HEAD | grep -Ev '^((\.github/workflows/core-rc-refreeze-004-formal-gate\.yml)|(reviews/CORE_RC_REFREEZE_004_FINALIZATION_CORRECTIVE_008/.*))$' | grep -q .; then
            echo "RC004_CANDIDATE_SCOPE_VIOLATION"; exit 1
          fi

          {
            echo "candidate_head=$GITHUB_SHA"
            echo "candidate_parent=$(git rev-parse HEAD^)"
            echo "candidate_tree=$(git rev-parse HEAD^{tree})"
            echo "live_main=$live_main"
            echo "frozen_software=$FROZEN_SHA"
            echo "frozen_root_tree=$(git -C "$target" rev-parse HEAD^{tree})"
            echo "frozen_core_tree=$(git -C "$target" rev-parse HEAD:src/aios_core)"
            echo "frozen_tests_tree=$(git -C "$target" rev-parse HEAD:tests)"
            echo "frozen_workflows_tree=$(git -C "$target" rev-parse HEAD:.github/workflows)"
            echo "frozen_pyproject_blob=$(git -C "$target" rev-parse HEAD:pyproject.toml)"
          } | tee "$OUT/frozen_identity.txt"

          echo "RC004_TARGET=$target" >> "$GITHUB_ENV"
          echo "RC004_OUT=$OUT" >> "$GITHUB_ENV"
          echo "RC004_LIVE_MAIN=$live_main" >> "$GITHUB_ENV"

      - name: Create isolated formal environment and record exact runtime
        shell: bash
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/rc004-formal-venv"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/python" -m pip install -e "$RC004_TARGET" "pydantic==$FORMAL_PYDANTIC" "pytest==$FORMAL_PYTEST"
          "$VENV/bin/python" - <<'PY' | tee "$RC004_OUT/environment_manifest.txt"
          import aios_core, platform, sqlite3, ssl, sys
          import pydantic, pytest
          assert sys.version_info[:3] == (3, 12, 14), sys.version
          assert pydantic.__version__ == "2.13.5", pydantic.__version__
          assert pytest.__version__ == "8.4.2", pytest.__version__
          print("task=CORE-RC-REFREEZE-004")
          print("software_sha=1cee3c5ad12f4b9098232bae11b51df786c5eb2f")
          print("python=" + sys.version.replace("\n"," "))
          print("python_executable=" + sys.executable)
          print("implementation=" + platform.python_implementation())
          print("pydantic=" + pydantic.__version__)
          print("pytest=" + pytest.__version__)
          print("sqlite=" + sqlite3.sqlite_version)
          print("openssl=" + ssl.OPENSSL_VERSION)
          print("platform=" + platform.platform())
          print("machine=" + platform.machine())
          print("aios_core.__file__=" + str(aios_core.__file__))
          PY
          {
            echo "kernel=$(uname -a)"
            echo "architecture=$(uname -m)"
            echo "os_release=$(grep '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '"')"
          } | tee -a "$RC004_OUT/environment_manifest.txt"
          "$VENV/bin/python" -m pip freeze | tee "$RC004_OUT/dependency-manifest.txt"
          echo "RC004_VENV=$VENV" >> "$GITHUB_ENV"

      - name: Corrective-003 workflow security, protected-drift, and publisher fault controls
        shell: bash
        run: |
          set -euo pipefail
          "$RC004_VENV/bin/python" "$GITHUB_WORKSPACE/reviews/CORE_RC_REFREEZE_004_CORRECTIVE_003/probes/workflow_security_static_probe.py" "$GITHUB_WORKSPACE/.github/workflows/core-rc-refreeze-004-formal-gate.yml" 2>&1 | tee "$RC004_OUT/workflow-security-static.txt"
          grep -q 'WORKFLOW_SECURITY_STATIC=PASS' "$RC004_OUT/workflow-security-static.txt"
          probe="$GITHUB_WORKSPACE/reviews/CORE_RC_REFREEZE_004_CORRECTIVE_003/probes/carry_forward/publisher_http_contract.sh"
          : > "$RC004_OUT/publisher-fault-injection.txt"
          for code in 201 401 403 500; do
            set +e
            bash "$probe" "$code" >> "$RC004_OUT/publisher-fault-injection.txt" 2>&1
            prc=$?
            set -e
            echo "simulated_http=$code corrected_logic_exit=$prc" | tee -a "$RC004_OUT/publisher-fault-injection.txt"
            if [ "$code" = "201" ]; then
              test "$prc" -eq 0
            else
              test "$prc" -ne 0
            fi
          done
          GITHUB_EVENT_NAME=workflow_dispatch "$RC004_VENV/bin/python" "$GITHUB_WORKSPACE/reviews/CORE_RC_REFREEZE_004_CORRECTIVE_003/probes/publisher_fault_matrix.py" "$GITHUB_WORKSPACE/.github/workflows/core-rc-refreeze-004-formal-gate.yml" 2>&1 | tee "$RC004_OUT/publisher-exact-shell-fault-matrix.txt"
          grep -q 'PUBLISHER_FAULT_MATRIX=PASS' "$RC004_OUT/publisher-exact-shell-fault-matrix.txt"
          "$RC004_VENV/bin/python" "$GITHUB_WORKSPACE/reviews/CORE_RC_REFREEZE_004_CORRECTIVE_003/probes/terminal_protected_drift_controls.py" 2>&1 | tee "$RC004_OUT/terminal-protected-drift-controls.txt"
          grep -q 'TERMINAL_PROTECTED_DRIFT_CONTROLS=PASS' "$RC004_OUT/terminal-protected-drift-controls.txt"

      - name: Fresh complete Core regression
        shell: bash
        run: |
          set -euo pipefail
          cd "$RC004_TARGET"
          "$RC004_VENV/bin/python" -m pytest -o addopts='' -q --tb=no             tests/unit tests/integration tests/runtime tests/habitation             --junitxml="$RC004_OUT/core-regression-junit.xml"             2>&1 | tee "$RC004_OUT/core-regression.txt"
          grep -qE '[0-9]+ passed' "$RC004_OUT/core-regression.txt"
          grep -qE '[0-9]+ (failed|error)' "$RC004_OUT/core-regression.txt" && exit 1 || true

      - name: Fresh extract and run frozen Window 20 A/B and Window 17 reviewer probes
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git fetch --no-tags --force origin             "+refs/pull/311/head:refs/remotes/rc004/pr-311"             "+refs/heads/arena/01a0fd4d-haneof-aios-core-v3-0:refs/remotes/rc004/w17"
          git merge-base --is-ancestor "$W20_REVIEW" refs/remotes/rc004/pr-311 || { echo "WINDOW20_REVIEW_IDENTITY_MISMATCH"; exit 1; }
          test "$(git rev-parse refs/remotes/rc004/w17)" = "$W17_REVIEW" || { echo "WINDOW17_REVIEW_IDENTITY_MISMATCH"; exit 1; }
          mkdir -p "$RUNNER_TEMP/rc004-probes"
          extract () {
            review="$1"; path="$2"; blob_expected="$3"; sha_expected="$4"; out="$5"; label="$6"
            blob="$(git ls-tree "$review" -- "$path" | awk '{print $3}')"
            test "$blob" = "$blob_expected" || { echo "${label}_BLOB_MISMATCH expected=$blob_expected actual=$blob"; exit 1; }
            git cat-file blob "$blob" > "$out"
            sha="$(sha256sum "$out" | awk '{print $1}')"
            test "$sha" = "$sha_expected" || { echo "${label}_SHA256_MISMATCH expected=$sha_expected actual=$sha"; exit 1; }
            echo "$label commit=$review blob=$blob sha256=$sha bytes=$(wc -c < "$out")"
          }
          {
            extract "$W20_REVIEW" "$W20_PROBE_DIR/window20_independent_attack.py" "$SUITE_A_BLOB" "$SUITE_A_SHA256" "$RUNNER_TEMP/rc004-probes/suite_a.py" "WINDOW20_SUITE_A"
            extract "$W20_REVIEW" "$W20_PROBE_DIR/window20_migration_rsa_attack.py" "$SUITE_B_BLOB" "$SUITE_B_SHA256" "$RUNNER_TEMP/rc004-probes/suite_b.py" "WINDOW20_SUITE_B"
            extract "$W17_REVIEW" "$W17_PROBE_DIR/window17_independent_attack.py" "$W17_BLOB" "$W17_SHA256" "$RUNNER_TEMP/rc004-probes/w17.py" "WINDOW17"
          } | tee "$RC004_OUT/probe-identities.txt"
          cd "$RC004_TARGET"
          PYTHONPATH="$RC004_TARGET/src" "$RC004_VENV/bin/python" "$RUNNER_TEMP/rc004-probes/suite_a.py" 2>&1 | tee "$RC004_OUT/window20-suite-a.txt"
          PYTHONPATH="$RC004_TARGET/src" "$RC004_VENV/bin/python" "$RUNNER_TEMP/rc004-probes/suite_b.py" 2>&1 | tee "$RC004_OUT/window20-suite-b.txt"
          PYTHONPATH="$RC004_TARGET/src" "$RC004_VENV/bin/python" "$RUNNER_TEMP/rc004-probes/w17.py" 2>&1 | tee "$RC004_OUT/window17-probe.txt"
          test "$(grep -E '^SUMMARY \|' "$RC004_OUT/window20-suite-a.txt" | tail -1)" = "SUMMARY | probes=4 failures=0"
          test "$(grep -E '^SUMMARY \|' "$RC004_OUT/window20-suite-b.txt" | tail -1)" = "SUMMARY | probes=7 failures=0"
          test "$(grep -E '^SUMMARY \|' "$RC004_OUT/window17-probe.txt" | tail -1)" = "SUMMARY | probes=14 failures=0"

      - name: Corrective-003 trust-root, alternate-mint, replay/conflict, supersession, and partial-commit checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RC004_TARGET"
          "$RC004_VENV/bin/python" - <<'PY' | tee "$RC004_OUT/trust-mint-inventory.txt"
          import ast
          from pathlib import Path
          root=Path("src/aios_core")
          tables={
            "background_model_request_bindings",
            "background_model_return_verifiers",
            "background_model_response_receipts",
            "background_model_return_handoffs",
            "background_model_responses",
          }
          records=[]
          for p in root.rglob("*.py"):
            src=p.read_text(encoding="utf-8")
            tree=ast.parse(src)
            parents={}
            for node in ast.walk(tree):
              for child in ast.iter_child_nodes(node):
                parents[child]=node
            for node in ast.walk(tree):
              if isinstance(node, ast.Constant) and isinstance(node.value,str):
                text=node.value
                touched=[t for t in tables if t in text]
                if not touched: continue
                upper=text.upper()
                if not any(k in upper for k in ("INSERT","UPDATE","DELETE","CREATE TABLE")): continue
                cur=node
                fn="<module>"
                while cur in parents:
                  cur=parents[cur]
                  if isinstance(cur,(ast.FunctionDef,ast.AsyncFunctionDef)):
                    fn=cur.name; break
                records.append((str(p),getattr(node,"lineno",None),fn,touched,upper.split()[0] if upper.split() else ""))
          for r in records: print(r)
          dml=[r for r in records if r[4] in {"INSERT","UPDATE","DELETE"}]
          assert dml, "no durable writer inventory"
          assert {r[0] for r in dml} == {"src/aios_core/runtime/background_attempt.py"}, {r[0] for r in dml}
          ins_receipt={r[2] for r in dml if "background_model_response_receipts" in r[3] and r[4]=="INSERT"}
          ins_handoff={r[2] for r in dml if "background_model_return_handoffs" in r[3] and r[4]=="INSERT"}
          ins_response={r[2] for r in dml if "background_model_responses" in r[3] and r[4]=="INSERT"}
          assert ins_receipt == {"attach_late_trusted_return"}, ins_receipt
          assert ins_handoff == {"attach_late_trusted_return"}, ins_handoff
          assert ins_response == {"stage_exact_response"}, ins_response
          print("TRUST_MINT_INVENTORY=PASS")
          print("SOLE_TRUST_ROOT=attach_late_trusted_return")
          print("STAGED_RESPONSE_CONSUMER=stage_exact_response")
          PY

          SYMBOLS='record_live_provider_return|_capture_trusted_response_return|consume_live_provider_return_window|_ISSUE_SENTINEL|_OPEN_WINDOWS|_HANDLER_RETURNS|ModelResponseAuthenticator|model_response_authenticator|_live_provider_return_window|_capture_live_provider_return'
          if grep -RnE "^[[:space:]]*(def|class)[[:space:]]+(${SYMBOLS})([^A-Za-z0-9_]|$)" src/; then echo "LOCAL_TRUST_AUTHORITY_DEFINITION_PRESENT"; exit 1; fi
          if grep -RnE "^[[:space:]]*(${SYMBOLS})[[:space:]]*(:[^=]*)?=" src/; then echo "LOCAL_TRUST_AUTHORITY_ASSIGNMENT_PRESENT"; exit 1; fi
          if grep -RnE "^[[:space:]]*(from|import)[[:space:]].*(${SYMBOLS})" src/; then echo "LOCAL_TRUST_AUTHORITY_IMPORT_PRESENT"; exit 1; fi
          test -f src/aios_core/runtime/live_return.py
          grep -q '^LOCAL_LIVE_RETURN_AUTHORITY_DECOMMISSIONED = True$' src/aios_core/runtime/live_return.py
          "$RC004_VENV/bin/python" - <<'PY' | tee "$RC004_OUT/tombstone-import-audit.txt"
          import ast
          from pathlib import Path

          root = Path("src/aios_core/runtime")
          offenders = []
          for path in root.glob("*.py"):
              if path.name in {"live_return.py", "__init__.py"}:
                  continue
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom):
                      module = node.module or ""
                      if module.endswith("live_return"):
                          offenders.append((str(path), node.lineno, "ImportFrom", module))
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.endswith("live_return"):
                              offenders.append((str(path), node.lineno, "Import", alias.name))
          print("authorization_import_offenders=", offenders)
          assert not offenders, offenders

          init_tree = ast.parse((root / "__init__.py").read_text(encoding="utf-8"))
          compatibility_reexports = []
          for node in ast.walk(init_tree):
              if isinstance(node, ast.ImportFrom) and (node.module or "").endswith("live_return"):
                  compatibility_reexports.extend(alias.name for alias in node.names)
          print("runtime_init_tombstone_reexports=", sorted(compatibility_reexports))
          assert compatibility_reexports, "expected inert reviewer-probe compatibility re-export is absent"
          print("TOMBSTONE_AUTHORIZATION_IMPORT_AUDIT=PASS")
          PY

          "$RC004_VENV/bin/python" -m pytest -o addopts='' -q --tb=short             tests/runtime/test_background_late_return_route_b.py             tests/runtime/test_late_return_canonical_encoding_002.py             tests/integration/test_core_background_late_trusted_return_corrective_003_c3_matrix.py             tests/integration/test_core_background_late_trusted_return_corrective_002.py             tests/integration/test_core_background_late_trusted_return_corrective_001.py             tests/integration/test_core_background_late_trusted_return_consumption_001.py             tests/integration/test_core_background_late_trusted_return_secret_upgrade_001.py             tests/integration/test_core_background_response_recovery_001_corrective_002_recovery.py             tests/integration/test_core_background_response_recovery_001_corrective_001.py             tests/integration/test_core_background_trusted_return_recovery_001.py             tests/integration/test_core_background_trusted_return_adversarial_001.py             tests/integration/test_core_background_trusted_return_r5_001.py             tests/integration/test_core_background_trusted_return_r5_conflicts_001.py             2>&1 | tee "$RC004_OUT/corrective003-security.txt"
          grep -qE '[0-9]+ passed' "$RC004_OUT/corrective003-security.txt"
          grep -qE '[0-9]+ (failed|error)' "$RC004_OUT/corrective003-security.txt" && exit 1 || true

      - name: Real SIGKILL and fresh-process recovery
        shell: bash
        run: |
          set -euo pipefail
          cd "$RC004_TARGET"
