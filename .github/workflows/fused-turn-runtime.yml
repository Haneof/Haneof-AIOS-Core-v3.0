name: fused-turn-runtime

on:
  push:
    branches: [main]
    paths:
      - "src/aios_core/context/**"
      - "src/aios_core/runtime/turn_runtime.py"
      - "src/aios_core/runtime/cognitive_runtime.py"
      - "src/aios_core/recommendation/**"
      - "src/aios_core/query/**"
      - "tests/integration/test_v3_fused_turn_runtime.py"
      - ".github/workflows/fused-turn-runtime.yml"
  pull_request:
    paths:
      - "src/aios_core/context/**"
      - "src/aios_core/runtime/turn_runtime.py"
      - "tests/integration/test_v3_fused_turn_runtime.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_v3_fused_turn_runtime.py tests/runtime/test_cognitive_runtime.py

