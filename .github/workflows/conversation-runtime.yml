name: conversation-runtime

on:
  push:
    branches: [main]
    paths:
      - "src/aios_core/runtime/conversation_state.py"
      - "src/aios_core/runtime/conversation_timeline.py"
      - "tests/runtime/test_conversation_state.py"
      - "tests/runtime/test_conversation_timeline.py"
      - ".github/workflows/conversation-runtime.yml"
  pull_request:
    paths:
      - "src/aios_core/runtime/conversation_state.py"
      - "src/aios_core/runtime/conversation_timeline.py"
      - "tests/runtime/test_conversation_state.py"
      - "tests/runtime/test_conversation_timeline.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/runtime/test_conversation_state.py tests/runtime/test_conversation_timeline.py
