name: c15-rcc-c014-validation

on:
  push:
    branches:
      - validation/c15-rcc-b-preflight-c014

permissions:
  contents: write

jobs:
  frozen-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact corrective candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 92a201a38c77595ed01ced00e2e7dc53c5dd6421

      - name: Print canonical shell transcript digests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, importlib.util
          from pathlib import Path
          p = Path("reviews/internal_habitation/c15-rcc/v1/resident/C15-RCC-RES-B-PREFLIGHT-002/checks/runbook_lifecycle_checker.py").resolve()
          spec = importlib.util.spec_from_file_location("lc", p)
          lc = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(lc)
          base = p.parent.parent
          for rel, text in lc.read_docs(base).items():
              commands, _ = lc._shell_contents_in(text)
              payload = "\\0".join(lc._normalize_shell_ws(c) for c in commands).encode("utf-8")
              print(f"SHELL_TRANSCRIPT_SHA256 {rel} {len(commands)} {hashlib.sha256(payload).hexdigest()}")
          PY

      - name: Run exact Debian 12 frozen gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/c014-artifacts"
          docker run --privileged --rm \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/work/repo" \
            -w /work/repo \
            debian:12 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                python3 python3-pip sudo util-linux iproute2 procps \
                coreutils findutils grep sed gawk openssl ca-certificates
              python3 --version
              /usr/bin/python3 --version
              python3 -m pip install --break-system-packages \
                -r reviews/internal_habitation/c15-rcc/v1/resident/C15-RCC-RES-B-PREFLIGHT-002/harness/requirements.freeze.txt
              BPREP=/work/repo/reviews/internal_habitation/c15-rcc/v1/resident/C15-RCC-RES-B-PREFLIGHT-002
              python3 "$BPREP/checks/runbook_lifecycle_checker.py" --base "$BPREP" --self-test \
                | tee /work/repo/c014-artifacts/lifecycle-selftest.log
              grep -q "RUNBOOK_SHELL_SEMANTICS_MUTATION_RED_PASS cases=82" \
                /work/repo/c014-artifacts/lifecycle-selftest.log
              success=0
              for attempt in 1 2 3 4 5; do
                export RUN_ROOT="/tmp/c014-e2e-fresh-$attempt"
                rm -rf "$RUN_ROOT"
                set +e
                bash "$BPREP/isolation/probe_e2e.sh"
                rc=$?
                set -e
                if [ -f "$RUN_ROOT/e2e.log" ]; then
                  cp "$RUN_ROOT/e2e.log" "/work/repo/c014-artifacts/e2e-attempt-$attempt.log"
                fi
                if [ "$rc" -eq 0 ]; then
                  cp "$RUN_ROOT/e2e.log" /work/repo/c014-artifacts/e2e.log
                  echo "$attempt" > /work/repo/c014-artifacts/successful-attempt.txt
                  success=1
                  break
                fi
              done
              [ "$success" -eq 1 ] || exit 1
            '

      - name: Verify frozen markers
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/c014-artifacts/e2e.log"
          grep -q '^ENVIRONMENT_PASS$' "$LOG"
          grep -q '^ALL_CHECKS=158/158 FAILURES=0$' "$LOG"
          grep -q '^RUNBOOK_CROSS_DOCUMENT_MUTATION_RED_PASS cases=5$' "$LOG"
          grep -q '^RUNBOOK_EXECUTABLE_MUTATION_RED_PASS cases=18$' "$LOG"
          grep -q '^RUNBOOK_SHELL_SEMANTICS_MUTATION_RED_PASS cases=82$' "$LOG"
          grep -q '^NO_COMMITTED_CURSOR14_PAYLOAD_PASS ' "$LOG"
          grep -q '^CANONICAL_RUNBOOK_ORDER_PASS ' "$LOG"
          grep -q '^CORRECTIVE_013_E2E_PASS$' "$LOG"
          if grep -q '^CHECK FAIL:' "$LOG"; then exit 1; fi
          sha256sum "$LOG"

      - name: Freeze exact E2E evidence onto PR branch
        shell: bash
        env:
          EXPECTED_PR_HEAD: 92a201a38c77595ed01ced00e2e7dc53c5dd6421
          PR_BRANCH: arena/01a0d692-haneof-aios-core-v3-0
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/c014-artifacts/e2e.log" /tmp/c014-e2e.log
          TARGET="reviews/internal_habitation/c15-rcc/v1/resident/C15-RCC-RES-B-PREFLIGHT-002/isolation/e2e_probe_output.txt"
          git fetch origin "$PR_BRANCH"
          remote_before="$(git rev-parse "origin/$PR_BRANCH")"
          test "$remote_before" = "$EXPECTED_PR_HEAD"
          git checkout -B c014-evidence "origin/$PR_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          cp /tmp/c014-e2e.log "$TARGET"
          cmp -s /tmp/c014-e2e.log "$TARGET"
          git add -- "$TARGET"
          test "$(git diff --cached --name-only)" = "$TARGET"
          git config user.name "Arena.ai Agent"
          git config user.email "arena-ai-agent@users.noreply.github.com"
          git commit -m "CORRECTIVE-014-FIXUP-005: freeze synchronized document-semantic E2E evidence"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PR_HEAD"
          remote_now="$(git ls-remote origin "refs/heads/$PR_BRANCH" | awk '{print $1}')"
          test "$remote_now" = "$EXPECTED_PR_HEAD"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          echo "EVIDENCE_COMMIT=$(git rev-parse HEAD)"
          echo "EVIDENCE_BLOB=$(git rev-parse HEAD:$TARGET)"
          sha256sum "$TARGET"

      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c15-rcc-c014-frozen-evidence
          path: c014-artifacts/
          if-no-files-found: error
          retention-days: 7
