name: c15-rcc-c014-validation

on:
  push:
    branches:
      - validation/c15-rcc-b-preflight-c014

permissions:
  contents: read

jobs:
  frozen-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact corrective candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: bfcb0b205e83b7fca7f0d406b03ea21a3b373363

      - name: Run exact Debian 12 frozen gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/c014-artifacts"
          docker run --privileged --rm \
            --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE:/work/repo" \
            -w /work/repo \
            debian:12 \
            bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                python3 python3-pip sudo util-linux iproute2 procps \
                coreutils findutils grep sed gawk openssl ca-certificates
              python3 --version
              /usr/bin/python3 --version
              python3 -m pip install --break-system-packages \
                -r reviews/internal_habitation/c15-rcc/v1/resident/C15-RCC-RES-B-PREFLIGHT-002/harness/requirements.freeze.txt
              BPREP=/work/repo/reviews/internal_habitation/c15-rcc/v1/resident/C15-RCC-RES-B-PREFLIGHT-002
              python3 "$BPREP/checks/runbook_lifecycle_checker.py" --base "$BPREP" --self-test \
                | tee /work/repo/c014-artifacts/lifecycle-selftest.log
              grep -q "RUNBOOK_SHELL_SEMANTICS_MUTATION_RED_PASS cases=48" \
                /work/repo/c014-artifacts/lifecycle-selftest.log
              success=0
              for attempt in 1 2 3 4 5; do
                export RUN_ROOT="/tmp/c014-e2e-fresh-$attempt"
                rm -rf "$RUN_ROOT"
                set +e
                bash "$BPREP/isolation/probe_e2e.sh"
                rc=$?
                set -e
                if [ -f "$RUN_ROOT/e2e.log" ]; then
                  cp "$RUN_ROOT/e2e.log" "/work/repo/c014-artifacts/e2e-attempt-$attempt.log"
                fi
                if [ "$rc" -eq 0 ]; then
                  cp "$RUN_ROOT/e2e.log" /work/repo/c014-artifacts/e2e.log
                  echo "$attempt" > /work/repo/c014-artifacts/successful-attempt.txt
                  success=1
                  break
                fi
              done
              [ "$success" -eq 1 ] || exit 1
            '

      - name: Verify frozen markers
        shell: bash
        run: |
          set -euo pipefail
          LOG="$GITHUB_WORKSPACE/c014-artifacts/e2e.log"
          grep -q '^ENVIRONMENT_PASS$' "$LOG"
          grep -q '^ALL_CHECKS=158/158 FAILURES=0$' "$LOG"
          grep -q '^RUNBOOK_CROSS_DOCUMENT_MUTATION_RED_PASS cases=5$' "$LOG"
          grep -q '^RUNBOOK_EXECUTABLE_MUTATION_RED_PASS cases=18$' "$LOG"
          grep -q '^RUNBOOK_SHELL_SEMANTICS_MUTATION_RED_PASS cases=48$' "$LOG"
          grep -q '^CORRECTIVE_013_E2E_PASS$' "$LOG"
          sha256sum "$LOG"

      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c15-rcc-c014-frozen-evidence
          path: c014-artifacts/
          if-no-files-found: error
          retention-days: 7
