name: core-scale

on:
  pull_request:
    paths:
      - "src/aios_core/**"
      - "tests/**"
      - "tools/core_scale_001_bench.py"
      - "reviews/CORE_SCALE_001_COMPLETION_EVIDENCE_2026-09-24.md"
      - ".github/workflows/core-scale.yml"

env:
  CORE_SCALE_CONSTRUCTION_MAIN: "3fe3c924fd855251e8fe195486a072ddf5d86169"

jobs:
  scale-s10k:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Prove baseline Core source is exact construction main before any repair
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet "$CORE_SCALE_CONSTRUCTION_MAIN" -- src/aios_core; then
            echo "Baseline branch already changes Core; refusing pre-repair measurement."
            git diff --stat "$CORE_SCALE_CONSTRUCTION_MAIN" -- src/aios_core
            exit 1
          fi
      - name: Frozen S10K scale envelope
        run: |
          mkdir -p scale-evidence
          python tools/core_scale_001_bench.py \
            --tier S10K \
            --output scale-evidence/s10k.json
      - name: Upload S10K evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-scale-s10k
          path: scale-evidence/
          if-no-files-found: warn

  scale-s100k:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Prove baseline Core source is exact construction main before any repair
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet "$CORE_SCALE_CONSTRUCTION_MAIN" -- src/aios_core; then
            echo "Baseline branch already changes Core; refusing pre-repair measurement."
            git diff --stat "$CORE_SCALE_CONSTRUCTION_MAIN" -- src/aios_core
            exit 1
          fi
      - name: Frozen S100K scale envelope including cold/stale restart probes
        run: |
          mkdir -p scale-evidence
          python tools/core_scale_001_bench.py \
            --tier S100K \
            --output scale-evidence/s100k.json
      - name: Upload S100K evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-scale-s100k
          path: scale-evidence/
          if-no-files-found: warn

  scale-s1m:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Prove baseline Core source is exact construction main before any repair
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet "$CORE_SCALE_CONSTRUCTION_MAIN" -- src/aios_core; then
            echo "Baseline branch already changes Core; refusing pre-repair measurement."
            git diff --stat "$CORE_SCALE_CONSTRUCTION_MAIN" -- src/aios_core
            exit 1
          fi
      - name: Frozen S1M capacity envelope under explicit 4 GiB process limit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scale-evidence
          prlimit --as=4294967296 -- \
            python tools/core_scale_001_bench.py \
              --tier S1M \
              --output scale-evidence/s1m.json
      - name: Upload S1M evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-scale-s1m
          path: scale-evidence/
          if-no-files-found: warn

  due-backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Prove baseline Core source is exact construction main before any repair
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet "$CORE_SCALE_CONSTRUCTION_MAIN" -- src/aios_core; then
            echo "Baseline branch already changes Core; refusing pre-repair measurement."
            git diff --stat "$CORE_SCALE_CONSTRUCTION_MAIN" -- src/aios_core
            exit 1
          fi
      - name: Mechanical due-work backlog envelope
        run: |
          mkdir -p scale-evidence
          python tools/core_scale_001_bench.py \
            --backlog \
            --output scale-evidence/backlog.json
      - name: Upload backlog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-scale-backlog
          path: scale-evidence/
          if-no-files-found: warn
