name: C14 Resident Repair Isolated R4

on:
  push:
    branches:
      - c14/resident-semrepair-sol-9f4c7b2e
    paths:
      - reviews/internal_habitation/c14-resident/semantic-repair-v1/runs/resident-repair-20260922-r4-9f4c7b2e/live_driver.py
      - .github/workflows/c14-resident-repair-isolated-r4.yml

permissions:
  contents: write

concurrency:
  group: c14-sem-repair-resident-isolated-r4
  cancel-in-progress: false

jobs:
  resident-live-r4:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout isolated resident branch
        uses: actions/checkout@v4
        with:
          ref: c14/resident-semrepair-sol-9f4c7b2e
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AIOS Core
        run: python -m pip install -e .

      - name: Configure evidence commits
        run: |
          git config user.name "aios-resident-evidence"
          git config user.email "aios-resident-evidence@users.noreply.github.com"

      - name: Run isolated real Resident bridge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python reviews/internal_habitation/c14-resident/semantic-repair-v1/runs/resident-repair-20260922-r4-9f4c7b2e/live_driver.py
