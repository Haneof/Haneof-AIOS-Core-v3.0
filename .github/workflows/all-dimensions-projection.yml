name: all-dimensions-projection

on:
  push:
    branches: [main]
    paths:
      - "src/aios_core/projections/**"
      - "src/aios_core/summaries/**"
      - "src/aios_core/query/**"
      - "tests/integration/test_v3_all_dimensions_projection.py"
      - ".github/workflows/all-dimensions-projection.yml"
  pull_request:
    paths:
      - "src/aios_core/projections/**"
      - "tests/integration/test_v3_all_dimensions_projection.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_v3_all_dimensions_projection.py tests/integration/test_v3_dimension_summary.py
