name: core-rc-refreeze-003-formal-gate

on:
  pull_request:
    paths:
      - ".github/workflows/core-rc-refreeze-003-formal-gate.yml"
      - "release/rc/CORE_RC_REFREEZE_003*"
      - "reviews/CORE_RC_REFREEZE_003/**"
      - "governance/CORE_RC_REFREEZE_003*"
  push:
    branches:
      - "arena/01a0e829-haneof-aios-core-v3-0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-rc-refreeze-003-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-software-regression:
    name: frozen f20f2ed software / CPython 3.12.14
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate evidence head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Select formal CPython
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Pin and verify exact frozen software tree
        shell: bash
        run: |
          set -euo pipefail
          target="f20f2edfa7af00d0286493fd15196ca9503bc315"
          target_dir="$RUNNER_TEMP/aios-rc003-frozen-software"
          mkdir -p "$GITHUB_WORKSPACE/reviews/CORE_RC_REFREEZE_003/ci-output"
          git cat-file -e "$target^{commit}"
          git worktree add --detach "$target_dir" "$target"
          test "$(git -C "$target_dir" rev-parse HEAD)" = "$target"
          test "$(git -C "$target_dir" rev-parse HEAD^{tree})" = "1ac3a675b884167d3a29aa432e7ef3eaff94d404"
          test "$(git -C "$target_dir" rev-parse HEAD:src/aios_core)" = "9adcbe07fa84d70d3fcd65724f8e6c53ad6b8623"
          test "$(git -C "$target_dir" rev-parse HEAD:tests)" = "7e33b5ef8432370234965d3ccd61248c703c4019"
          test "$(git -C "$target_dir" rev-parse HEAD:.github/workflows)" = "fb168f8540070ff7b0c521e5990b03c7f3c56bf4"
          printf 'target=%s\nrepo_tree=%s\ncore_tree=%s\ntests_tree=%s\nworkflow_tree=%s\n' \
            "$target" \
            "$(git -C "$target_dir" rev-parse HEAD^{tree})" \
            "$(git -C "$target_dir" rev-parse HEAD:src/aios_core)" \
            "$(git -C "$target_dir" rev-parse HEAD:tests)" \
            "$(git -C "$target_dir" rev-parse HEAD:.github/workflows)" \
            | tee "$GITHUB_WORKSPACE/reviews/CORE_RC_REFREEZE_003/ci-output/frozen_identity.txt"
          echo "AIOS_RC_TARGET_ROOT=$target_dir" >> "$GITHUB_ENV"
          echo "RC003_OUTPUT=$GITHUB_WORKSPACE/reviews/CORE_RC_REFREEZE_003/ci-output" >> "$GITHUB_ENV"


      - name: Create isolated formal environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/rc003-formal-venv"
          "$RUNNER_TEMP/rc003-formal-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/rc003-formal-venv/bin/python" -m pip install \
            -e "$AIOS_RC_TARGET_ROOT" \
            "pydantic==2.13.5" \
            "pytest==8.4.2"

      - name: Record exact formal environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RC003_OUTPUT"
          {
            echo "task=CORE-RC-REFREEZE-003"
            echo "software_sha=f20f2edfa7af00d0286493fd15196ca9503bc315"
            echo "python=$("$RUNNER_TEMP/rc003-formal-venv/bin/python" -c 'import sys; print(sys.version.replace("\\n", " "))')"
            echo "implementation=$("$RUNNER_TEMP/rc003-formal-venv/bin/python" -c 'import platform; print(platform.python_implementation())')"
            echo "pydantic=$("$RUNNER_TEMP/rc003-formal-venv/bin/python" -c 'import pydantic; print(pydantic.__version__)')"
            echo "pytest=$("$RUNNER_TEMP/rc003-formal-venv/bin/python" -c 'import pytest; print(pytest.__version__)')"
            echo "sqlite=$("$RUNNER_TEMP/rc003-formal-venv/bin/python" -c 'import sqlite3; print(sqlite3.sqlite_version)')"
            echo "platform=$("$RUNNER_TEMP/rc003-formal-venv/bin/python" -c 'import platform; print(platform.platform())')"
            echo "system=$(uname -a)"
            echo "architecture=$(uname -m)"
            echo "os_release=$(grep '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '\"')"
            echo "candidate_head=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "workflow_run_id=${{ github.run_id }}"
          } | tee "$RC003_OUTPUT/environment_manifest.txt"
          "$RUNNER_TEMP/rc003-formal-venv/bin/python" -m pip freeze \
            | tee "$RC003_OUTPUT/formal-pip-freeze.txt"
          "$RUNNER_TEMP/rc003-formal-venv/bin/python" -c \
            'import aios_core; print("formal_import=" + aios_core.__file__)' \
            | tee "$RC003_OUTPUT/formal-import.txt"

      - name: Complete repository pytest on exact frozen software
        shell: bash
        run: |
          set -euo pipefail
          cd "$AIOS_RC_TARGET_ROOT"
          "$RUNNER_TEMP/rc003-formal-venv/bin/python" -m pytest \
            -o addopts='' -q --tb=no \
            --junitxml="$RC003_OUTPUT/full-regression-junit.xml" \
            | tee "$RC003_OUTPUT/full-regression.txt"

      - name: Trusted-return R1-R5 / replay / authenticity / process-loss / recovery matrix
        shell: bash
        run: |
          set -euo pipefail
          cd "$AIOS_RC_TARGET_ROOT"
          "$RUNNER_TEMP/rc003-formal-venv/bin/python" -m pytest \
            -o addopts='' -q --tb=short \
            --junitxml="$RC003_OUTPUT/trusted-return-junit.xml" \
            tests/integration/test_core_background_trusted_return_recovery_001.py \
            tests/integration/test_core_background_trusted_return_adversarial_001.py \
            tests/integration/test_core_background_trusted_return_r5_001.py \
            tests/integration/test_core_background_trusted_return_r5_conflicts_001.py \
            tests/integration/test_core_background_trusted_return_corrective_001_capability_replay.py \
            tests/integration/test_core_background_trusted_return_corrective_001_store_fail_closed.py \
            tests/integration/test_core_background_trusted_return_corrective_001_process_loss.py \
            tests/integration/test_core_background_response_recovery_001.py \
            tests/integration/test_core_background_response_recovery_001_corrective_001.py \
            tests/integration/test_core_background_response_recovery_001_corrective_002_authenticity.py \
            tests/integration/test_core_background_response_recovery_001_corrective_002_recovery.py \
            tests/integration/test_core_gap_fix_002_background_attempts.py \
            tests/runtime/test_background_model_attempt.py \
            tests/runtime/test_cognitive_runtime_trusted_return.py \
            tests/runtime/test_turn_execution_recovery.py \
            | tee "$RC003_OUTPUT/trusted-return-regression.txt"
          AIOS_RC_TARGET_ROOT="$AIOS_RC_TARGET_ROOT" \
          PYTHONPATH="$AIOS_RC_TARGET_ROOT/src:$AIOS_RC_TARGET_ROOT/tests/integration" \
            "$RUNNER_TEMP/rc003-formal-venv/bin/python" \
            "$GITHUB_WORKSPACE/reviews/CORE_RC_REFREEZE_003/probes/trusted_return_registry_inventory.py" \
            | tee "$RC003_OUTPUT/trusted-return-registry-inventory.txt"

      - name: World / index / Wake / Review / C14 / cognition / headless / recovery / SCALE
        shell: bash
        run: |
          set -euo pipefail
          cd "$AIOS_RC_TARGET_ROOT"
          "$RUNNER_TEMP/rc003-formal-venv/bin/python" -m pytest \
            -o addopts='' -q --tb=short \
            --junitxml="$RC003_OUTPUT/core-systems-junit.xml" \
            tests/unit/test_observation.py \
            tests/unit/test_store.py \
            tests/unit/test_world_revision_atomicity.py \
            tests/integration/test_m0_prime_store_delta_and_search.py \
            tests/integration/test_v3_world_map_cockpit.py \
            tests/integration/test_v3_wake_dispatch.py \
            tests/integration/test_v3_attention_watch.py \
            tests/integration/test_v3_execution_world.py \
            tests/integration/test_v3_periodic_review.py \
            tests/integration/test_v3_fused_turn_runtime.py \
            tests/integration/test_v3_ai_world.py \
            tests/integration/test_v3_cognition_revision.py \
            tests/integration/test_v3_cognition_writeback.py \
            tests/integration/test_v3_c15_cognition_evidence_policy.py \
            tests/integration/test_v3_c15_cognition_fields.py \
            tests/integration/test_v3_constitutional_cognition_closure.py \
            tests/integration/test_v3_c14_cognitive_derivation_runtime.py \
            tests/integration/test_v3_c14_cognitive_derivation_scheduler.py \
            tests/integration/test_v3_completeness_closure.py \
            tests/integration/test_v3_background_budget_gate.py \
            tests/integration/test_v3_dimension_summary.py \
            tests/integration/test_v3_summary_hierarchy.py \
            tests/integration/test_v3_long_context_continuity.py \
            tests/integration/test_v3_memory_recommendation.py \
            tests/runtime/test_cognitive_runtime.py \
            tests/runtime/test_metering_ledger.py \
            tests/habitation/test_t28_proactive_memory_boundary.py \
            tests/integration/test_core_headless.py \
            tests/integration/test_core_recovery.py \
            tests/integration/test_core_scale_semantics.py \
            tests/habitation \
            | tee "$RC003_OUTPUT/core-systems-regression.txt"

      - name: Clean wheel install and headless lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/rc003-wheel"
          smoke_venv="$RUNNER_TEMP/rc003-clean-install-venv"
          mkdir -p "$wheel_dir"
          "$RUNNER_TEMP/rc003-formal-venv/bin/python" -m pip wheel \
            --no-deps "$AIOS_RC_TARGET_ROOT" -w "$wheel_dir" \
            | tee "$RC003_OUTPUT/wheel-build.txt"
          wheel="$(find "$wheel_dir" -maxdepth 1 -type f -name 'aios_core-*.whl' -print -quit)"
          test -n "$wheel"
          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install --upgrade pip \
            | tee "$RC003_OUTPUT/clean-install-pip.txt"
          "$smoke_venv/bin/python" -m pip install \
            "pydantic==2.13.5" "$wheel" \
            | tee -a "$RC003_OUTPUT/clean-install-pip.txt"
          "$smoke_venv/bin/python" -m pip freeze \
            | tee "$RC003_OUTPUT/clean-install-pip-freeze.txt"
          "$smoke_venv/bin/python" \
            "$GITHUB_WORKSPACE/reviews/CORE_RC_REFREEZE_003/probes/clean_install_headless_smoke.py" \
            "$smoke_venv/bin/aios-core-headless" \
            | tee "$RC003_OUTPUT/clean-install-headless-smoke.txt"

      - name: Backup / restore / index rebuild / writer recovery proof
        shell: bash
        run: |
          set -euo pipefail
          cd "$AIOS_RC_TARGET_ROOT"
          PYTHONPATH="$AIOS_RC_TARGET_ROOT/src" \
          AIOS_RC_TARGET_ROOT="$AIOS_RC_TARGET_ROOT" \
            "$RUNNER_TEMP/rc003-formal-venv/bin/python" \
            "$GITHUB_WORKSPACE/reviews/CORE_RC_REFREEZE_003/probes/backup_restore_trusted_return.py" \
            | tee "$RC003_OUTPUT/backup-restore-trusted-return.txt"

      - name: Upload reproducible RC regression and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-rc-refreeze-003-${{ github.run_id }}
          if-no-files-found: warn
          path: reviews/CORE_RC_REFREEZE_003/ci-output/
