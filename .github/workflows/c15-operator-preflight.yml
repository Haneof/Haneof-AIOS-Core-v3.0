name: c15-operator-preflight
on:
  pull_request:
    paths:
      - "tools/c15_preflight/**"
      - "tests/preflight/**"
      - ".github/workflows/c15-operator-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce formal Python gate
        run: python -c 'import sys; print(sys.version); assert sys.version_info >= (3, 12)'
      - run: pip install -e ".[dev]"
      - name: Frozen Core and sealed evidence unchanged
        run: |
          git diff --exit-code bcd6bf353126318f9a97076b52ec1740d43f35a4 HEAD -- src/aios_core
          git diff --exit-code 849bfd41c623fb336b392a3e6e933cfad93620e9 HEAD -- reviews/internal_habitation
      - name: Synthetic transport and handoff-negative checks only
        run: |
          set +e
          python -m pytest -o addopts='' -q tests/preflight --junitxml=preflight-results.xml 2>&1 | tee preflight-q.log
          CODE=${PIPESTATUS[0]}
          echo "exit code $CODE"
          python - <<'PY'
          import xml.etree.ElementTree as ET, pathlib
          p=pathlib.Path('preflight-results.xml')
          if p.exists():
            tree=ET.parse(p)
            fails=[]
            for tc in tree.getroot().iter('testcase'):
              for child in tc:
                if child.tag in ('failure','error'):
                  name=f"{tc.get('classname')}::{tc.get('name')}"
                  fails.append(name)
                  print(f"::error title={name}::failed")
                  print(f"FAILED: {name}")
                  print((child.text or '')[:5000])
            print(f"TOTAL FAILS: {len(fails)}")
          PY
          exit $CODE
      - name: Relevant existing Core regressions (synthetic Worlds)
        run: |
          python -m pytest -o addopts='' -q --junitxml=regression-results.xml \
            tests/runtime \
            tests/integration/test_v3_fused_turn_runtime.py \
            tests/integration/test_v3_conversation_world_ingest.py \
            tests/integration/test_v3_dimension_summary.py \
            tests/integration/test_v3_summary_hierarchy.py \
            tests/integration/test_v3_periodic_review.py \
            tests/integration/test_v3_wake_dispatch.py \
            tests/integration/test_v3_c14_cognitive_derivation_runtime.py \
            tests/integration/test_v3_c14_cognitive_derivation_scheduler.py
      - name: Publish mechanical counts in check summary (no private artifacts)
        if: always()
        run: |
          python - <<'PYTHON'
          import json, os, sys, xml.etree.ElementTree as ET, pathlib
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          head = event.get("pull_request", {}).get("head", {}).get("sha", os.environ["GITHUB_SHA"])
          for name in ("preflight", "regression"):
            p = pathlib.Path(name + "-results.xml")
            if not p.exists():
              print(f"missing {name}-results.xml")
              continue
            try:
              suites = list(ET.parse(p).getroot().iter("testsuite"))
              counts = {key: sum(int(s.get(key, 0)) for s in suites) for key in ("tests", "failures", "errors", "skipped")}
              receipt = json.dumps({"suite": name, "python": sys.version.split()[0], "head": head, **counts})
              print("::notice title=C15 synthetic test receipt::" + receipt)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                out.write(receipt + "\n")
              if counts["failures"] or counts["errors"]:
                print(open(p).read()[:20000])
            except Exception as e:
              print(f"parse error {e}")
          PYTHON
