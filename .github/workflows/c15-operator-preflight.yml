name: c15-operator-preflight
on:
  pull_request:
    paths:
      - "tools/c15_preflight/**"
      - "tests/preflight/**"
      - ".github/workflows/c15-operator-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-mechanics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head for exact-head evidence (not merge commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce formal Python gate
        run: python -c 'import sys; print(sys.version); assert sys.version_info >= (3, 12)'
      - run: pip install -e ".[dev]"
      - name: Frozen Core and sealed evidence unchanged
        run: |
          git diff --exit-code bcd6bf353126318f9a97076b52ec1740d43f35a4 HEAD -- src/aios_core
          # Main already added a governance-only Resident prompt after Core freeze.
          # Prove this increment changes no existing evidence/fixture material.
          git diff --exit-code 849bfd41c623fb336b392a3e6e933cfad93620e9 HEAD -- reviews/internal_habitation
      - name: Synthetic transport and handoff-negative checks only
        run: python -m pytest -o addopts='' -q tests/preflight --junitxml=preflight-results.xml
      - name: Relevant existing Core regressions (synthetic Worlds)
        run: |
          python -m pytest -o addopts='' -q --junitxml=regression-results.xml \
            tests/runtime \
            tests/integration/test_v3_fused_turn_runtime.py \
            tests/integration/test_v3_conversation_world_ingest.py \
            tests/integration/test_v3_dimension_summary.py \
            tests/integration/test_v3_summary_hierarchy.py \
            tests/integration/test_v3_periodic_review.py \
            tests/integration/test_v3_wake_dispatch.py \
            tests/integration/test_v3_c14_cognitive_derivation_runtime.py \
            tests/integration/test_v3_c14_cognitive_derivation_scheduler.py
      - name: Publish mechanical counts with exact-head evidence
        run: |
          python - <<'PYTHON'
          import json, os, sys, subprocess, xml.etree.ElementTree as ET
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          event = json.load(open(event_path)) if event_path and os.path.exists(event_path) else {}
          event_name = os.environ.get("GITHUB_EVENT_NAME", "unknown")
          event_head_sha = event.get("pull_request", {}).get("head", {}).get("sha") or os.environ.get("GITHUB_SHA", "unknown")
          tested_sha = subprocess.check_output(["git","rev-parse","HEAD"], text=True).strip()
          print(f"event_name={event_name} event_head_sha={event_head_sha} tested_sha={tested_sha}")
          if event_name == "pull_request":
              assert tested_sha == event_head_sha, f"exact-head mismatch: tested {tested_sha} != event head {event_head_sha}"
              mode = "exact-head"
          elif event_name == "workflow_dispatch":
              mode = "workflow_dispatch"
          else:
              mode = "merge-result" if event.get("pull_request") else event_name
          for name in ("preflight", "regression"):
              suites = list(ET.parse(name + "-results.xml").getroot().iter("testsuite"))
              counts = {key: sum(int(s.get(key, 0)) for s in suites) for key in ("tests", "failures", "errors", "skipped")}
              assert counts["failures"] == counts["errors"] == counts["skipped"] == 0
              receipt = json.dumps({
                  "suite": name,
                  "python": sys.version.split()[0],
                  "event_name": event_name,
                  "mode": mode,
                  "event_head_sha": event_head_sha,
                  "tested_sha": tested_sha,
                  "head": tested_sha,
                  **counts
              })
              print(f"::notice title=C15 synthetic test receipt::{receipt}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  out.write(receipt + "\n")
          PYTHON
