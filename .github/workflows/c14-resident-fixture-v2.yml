# C14-RES-B-FIX-001 canonical conversation release gate
name: c14-resident-fixture-v2

on:
  pull_request:
    paths:
      - "reviews/internal_habitation/c14-resident/v2/**"
      - "governance/C14_RES_B_CONVERSATION_INGEST_PREFLIGHT_2026-09-21.md"
      - ".github/workflows/c14-resident-fixture-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-conversation-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record formal Python version
        run: python --version
      - run: pip install -e ".[dev]"
      - name: Run generic durable blind-release regressions
        run: python -m unittest -v reviews/internal_habitation/c14-resident/v2/release/test_release_operator.py
      - name: Run canonical conversation release and idempotency regressions
        run: python -m unittest -v reviews/internal_habitation/c14-resident/v2/release/test_canonical_conversation_release.py
      - name: Run existing canonical conversation and fused-runtime regressions
        run: |
          pytest -q             tests/integration/test_v3_conversation_world_ingest.py             tests/integration/test_v3_fused_turn_runtime.py
      - name: Prove frozen fixture SHA256
        shell: bash
        run: |
          actual="sha256:$(sha256sum reviews/internal_habitation/c14-resident/v2/fixture/sealed_fixture.json | awk '{print $1}')"
          expected="sha256:1fb973499664d0d71d94a7b94071e3d7210395ea6a54ec4dcbb1ba115d069253"
          test "$actual" = "$expected"
      - name: Confirm no Core or Resident-A evidence changes
        shell: bash
        run: |
          set -euo pipefail

          guard_could_not_be_evaluated() {
            echo "::error::guard could not be evaluated: $*" >&2
            exit 2
          }

          if [ -z "${GITHUB_REF:-}" ]; then
            guard_could_not_be_evaluated "GITHUB_REF is unavailable"
          fi

          if ! shallow_state="$(git rev-parse --is-shallow-repository 2>&1)"; then
            guard_could_not_be_evaluated "cannot determine repository shallow state: ${shallow_state}"
          fi

          if [ "$shallow_state" = "true" ]; then
            if ! git fetch --no-tags --prune --unshallow origin \
              "+${GITHUB_REF}:refs/remotes/origin/ci-guard-head" \
              "+refs/heads/main:refs/remotes/origin/main"; then
              guard_could_not_be_evaluated "failed to fetch complete current-ref and main history"
            fi
          else
            if ! git fetch --no-tags --prune origin \
              "+refs/heads/main:refs/remotes/origin/main"; then
              guard_could_not_be_evaluated "failed to refresh main history"
            fi
          fi

          if ! merge_base="$(git merge-base origin/main HEAD 2>&1)"; then
            guard_could_not_be_evaluated "git merge-base origin/main HEAD failed: ${merge_base}"
          fi

          if ! changed="$(git diff --name-only "$merge_base" HEAD 2>&1)"; then
            guard_could_not_be_evaluated "git diff from merge base failed: ${changed}"
          fi
          if printf '%s\n' "$changed" | grep -q '^src/aios_core/'; then
            echo "::error::invariant rejected: C14-RES-B-FIX-001 must not modify src/aios_core/**"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -q '^reviews/internal_habitation/c14-resident/v2/runs/resident-a-restart-20260921/'; then
            echo "::error::invariant rejected: C14-RES-B-FIX-001 must not modify frozen Resident-A evidence"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -q '^reviews/internal_habitation/c14-resident/v2/fixture/sealed_fixture.json
; then
            echo "::error::invariant rejected: C14-RES-B-FIX-001 must not modify sealed fixture bytes"
            exit 1
          fi
          echo "guard evaluated: invariants accepted (merge-base=$merge_base)"
