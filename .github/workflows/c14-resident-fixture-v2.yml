# C14-RES-B-FIX-001 canonical conversation release gate
name: c14-resident-fixture-v2

on:
  pull_request:
    paths:
      - "reviews/internal_habitation/c14-resident/v2/**"
      - "governance/C14_RES_B_CONVERSATION_INGEST_PREFLIGHT_2026-09-21.md"
      - ".github/workflows/c14-resident-fixture-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-conversation-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record formal Python version
        run: python --version
      - run: pip install -e ".[dev]"
      - name: Run generic durable blind-release regressions
        run: python -m unittest -v reviews/internal_habitation/c14-resident/v2/release/test_release_operator.py
      - name: Run canonical conversation release and idempotency regressions
        run: python -m unittest -v reviews/internal_habitation/c14-resident/v2/release/test_canonical_conversation_release.py
      - name: Run existing canonical conversation and fused-runtime regressions
        run: |
          pytest -q             tests/integration/test_v3_conversation_world_ingest.py             tests/integration/test_v3_fused_turn_runtime.py
      - name: Prove frozen fixture SHA256
        shell: bash
        run: |
          actual="sha256:$(sha256sum reviews/internal_habitation/c14-resident/v2/fixture/sealed_fixture.json | awk '{print $1}')"
          expected="sha256:1fb973499664d0d71d94a7b94071e3d7210395ea6a54ec4dcbb1ba115d069253"
          test "$actual" = "$expected"
      - name: Confirm no Core or Resident-A evidence changes
        shell: bash
        run: |
          set -euo pipefail

          guard_error() {
            echo "::error::Guard could not be evaluated: $1"
            exit 2
          }

          event_name='${{ github.event_name }}'
          pr_base_sha='${{ github.event.pull_request.base.sha }}'

          if [ "$event_name" = "pull_request" ]; then
            if [ -z "$pr_base_sha" ]; then
              guard_error "pull_request.base.sha is missing"
            fi
            if ! git cat-file -e "${pr_base_sha}^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$pr_base_sha"; then
                guard_error "failed to fetch PR base $pr_base_sha"
              fi
            fi
            if ! changed="$(git diff --name-only "$pr_base_sha" HEAD)"; then
              guard_error "git diff failed for PR base $pr_base_sha"
            fi
            echo "Guard evaluated against PR base $pr_base_sha"
          else
            if ! shallow="$(git rev-parse --is-shallow-repository)"; then
              guard_error "could not determine whether checkout is shallow"
            fi
            if [ "$shallow" = "true" ]; then
              if ! git fetch --no-tags --unshallow origin; then
                guard_error "failed to unshallow checkout"
              fi
            fi
            if ! git fetch --no-tags origin main; then
              guard_error "failed to fetch main"
            fi
            if ! merge_base="$(git merge-base origin/main HEAD)"; then
              guard_error "no merge base between origin/main and HEAD"
            fi
            if ! changed="$(git diff --name-only "$merge_base" HEAD)"; then
              guard_error "git diff failed from merge base $merge_base"
            fi
            echo "Guard evaluated from merge base $merge_base"
          fi
          if grep -q '^src/aios_core/' <<<"$changed"; then
            echo "::error::Invariant rejected: C14-RES-B-FIX-001 must not modify src/aios_core/**"
            exit 1
          fi
          if grep -q '^reviews/internal_habitation/c14-resident/v2/runs/resident-a-restart-20260921/' <<<"$changed"; then
            echo "::error::Invariant rejected: C14-RES-B-FIX-001 must not modify frozen Resident-A evidence"
            exit 1
          fi
          if grep -q '^reviews/internal_habitation/c14-resident/v2/fixture/sealed_fixture.json$' <<<"$changed"; then
            echo "::error::Invariant rejected: C14-RES-B-FIX-001 must not modify sealed fixture bytes"
            exit 1
          fi
