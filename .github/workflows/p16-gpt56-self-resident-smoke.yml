name: p16-gpt56-self-resident-smoke

on:
  push:
    branches:
      - "experiment/p16-gpt56-self-resident-smoke-*"
    paths:
      - "tests/experimental/test_p16_gpt56_self_resident_smoke_20260920.py"
      - ".github/workflows/p16-gpt56-self-resident-smoke.yml"
      - "tests/habitation/**"
      - "src/aios_core/**"

jobs:
  self-resident-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run GPT-5.6 Sol self-resident Current-Core smoke
        run: pytest -q tests/experimental/test_p16_gpt56_self_resident_smoke_20260920.py
