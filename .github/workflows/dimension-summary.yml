name: dimension-summary

on:
  push:
    branches: [main]
    paths:
      - "src/aios_core/contracts/models.py"
      - "src/aios_core/query/search.py"
      - "src/aios_core/summaries/**"
      - "tests/integration/test_v3_dimension_summary.py"
      - ".github/workflows/dimension-summary.yml"
  pull_request:
    paths:
      - "src/aios_core/contracts/models.py"
      - "src/aios_core/query/search.py"
      - "src/aios_core/summaries/**"
      - "tests/integration/test_v3_dimension_summary.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/test_v3_dimension_summary.py
