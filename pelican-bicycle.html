<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101b35" />
  <title>鹈鹕的风之旅 · SVG 2D 动画</title>
  <style>
    :root {
      --ink: #18243e;
      --muted: #6e7890;
      --paper: #f6f8fc;
      --card: rgba(255, 255, 255, 0.86);
      --line: rgba(29, 48, 83, 0.12);
      --accent: #ed805c;
      --accent-dark: #c95843;
      --blue: #5677b9;
      --motion-speed: 1;
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(255, 209, 165, 0.42), transparent 31rem),
        radial-gradient(circle at 100% 18%, rgba(173, 210, 255, 0.38), transparent 36rem),
        var(--paper);
    }

    .page-shell {
      width: min(1240px, calc(100% - 40px));
      margin: 0 auto;
      padding: clamp(28px, 5vw, 68px) 0 46px;
    }

    .intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      margin-bottom: 26px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 13px;
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      display: block;
      width: 28px;
      height: 2px;
      border-radius: 999px;
      background: var(--accent);
    }

    h1 {
      max-width: 720px;
      margin: 0;
      font-size: clamp(32px, 5.2vw, 66px);
      line-height: 0.98;
      letter-spacing: -0.055em;
      font-weight: 850;
    }

    .subtitle {
      max-width: 530px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: clamp(14px, 1.8vw, 17px);
      line-height: 1.7;
    }

    .badge {
      flex: 0 0 auto;
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 11px 15px;
      border: 1px solid rgba(237, 128, 92, 0.22);
      border-radius: 999px;
      color: #ae563f;
      background: rgba(255, 243, 237, 0.78);
      box-shadow: 0 8px 22px rgba(177, 91, 64, 0.08);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.13em;
      white-space: nowrap;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ec8d65;
      box-shadow: 0 0 0 4px rgba(236, 141, 101, 0.14);
    }

    .art-card {
      overflow: hidden;
      border: 1px solid rgba(30, 50, 88, 0.1);
      border-radius: 28px;
      background: var(--card);
      box-shadow:
        0 26px 70px rgba(36, 53, 91, 0.13),
        0 3px 9px rgba(36, 53, 91, 0.05);
      backdrop-filter: blur(12px);
    }

    .scene-frame {
      position: relative;
      overflow: hidden;
      background: #d7e4f4;
    }

    #animationScene {
      display: block;
      width: 100%;
      height: auto;
      min-height: 320px;
    }

    .scene-note {
      position: absolute;
      top: 22px;
      left: 24px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, 0.44);
      border-radius: 999px;
      color: rgba(23, 39, 67, 0.78);
      background: rgba(255, 255, 255, 0.48);
      box-shadow: 0 7px 18px rgba(50, 77, 109, 0.07);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
    }

    .scene-note svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 22px 19px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
    }

    .control-actions,
    .control-meta,
    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-actions { flex-wrap: wrap; }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .control-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 15px;
      border: 1px solid rgba(28, 47, 82, 0.13);
      border-radius: 12px;
      color: var(--ink);
      background: #fff;
      box-shadow: 0 4px 12px rgba(29, 49, 85, 0.05);
      font-size: 13px;
      font-weight: 750;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .control-button:hover {
      border-color: rgba(237, 128, 92, 0.38);
      box-shadow: 0 7px 17px rgba(29, 49, 85, 0.1);
      transform: translateY(-1px);
    }

    .control-button:active { transform: translateY(0); }

    .control-button.primary {
      border-color: transparent;
      color: white;
      background: var(--ink);
    }

    .control-button.primary:hover { background: #26385d; }

    .control-button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(237, 128, 92, 0.35);
      outline-offset: 3px;
    }

    .button-icon {
      display: inline-grid;
      place-items: center;
      width: 15px;
      height: 15px;
    }

    .button-icon svg { width: 100%; height: 100%; }

    .speed-control {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .speed-control input {
      width: 112px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .speed-value {
      display: inline-block;
      min-width: 35px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .feature-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      border-top: 1px solid var(--line);
      background: var(--line);
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 58px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.63);
      color: var(--muted);
      font-size: 12px;
    }

    .feature strong {
      display: block;
      margin-bottom: 2px;
      color: var(--ink);
      font-size: 13px;
    }

    .feature-icon {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border-radius: 10px;
      color: var(--accent-dark);
      background: #fff0e9;
    }

    .feature-icon svg { width: 17px; height: 17px; }

    .footer-note {
      margin: 18px 0 0;
      color: #8a92a4;
      font-size: 12px;
      text-align: center;
    }

    /* SVG motion */
    .cloud-drift { animation: cloudDrift calc(34s / var(--motion-speed)) linear infinite; }
    .cloud-drift-slow { animation: cloudDriftSlow calc(48s / var(--motion-speed)) linear infinite; }
    .road-flow { animation: roadFlow calc(1.6s / var(--motion-speed)) linear infinite; }
    .wheel-spin { transform-box: view-box; transform-origin: center; animation: wheelSpin calc(1.7s / var(--motion-speed)) linear infinite; }
    #rearWheel { transform-origin: 390px 525px; }
    #frontWheel { transform-origin: 810px 525px; }
    #crank { transform-origin: 600px 525px; animation-duration: calc(1.05s / var(--motion-speed)); }
    .rider-bob { transform-box: view-box; transform-origin: 620px 390px; animation: riderBob calc(1.7s / var(--motion-speed)) ease-in-out infinite; }
    .wing-flap { transform-box: view-box; transform-origin: 594px 270px; animation: wingFlap calc(1.7s / var(--motion-speed)) ease-in-out infinite; }
    .wing-flap-back { transform-box: view-box; transform-origin: 602px 276px; animation: wingFlapBack calc(1.7s / var(--motion-speed)) ease-in-out infinite; }
    .pedal-leg { transform-box: view-box; transform-origin: 620px 354px; animation: pedalSwing calc(1.05s / var(--motion-speed)) ease-in-out infinite; }
    .pedal-leg.front { animation-delay: calc(-0.525s / var(--motion-speed)); }
    .reed-sway { transform-box: fill-box; transform-origin: bottom center; animation: reedSway calc(2.8s / var(--motion-speed)) ease-in-out infinite alternate; }
    .reed-sway.delay-1 { animation-delay: -0.9s; }
    .reed-sway.delay-2 { animation-delay: -1.7s; }
    .tiny-wave { animation: tinyWave calc(2.6s / var(--motion-speed)) ease-in-out infinite; }

    @keyframes cloudDrift {
      from { transform: translateX(-330px); }
      to { transform: translateX(760px); }
    }
    @keyframes cloudDriftSlow {
      from { transform: translateX(290px); }
      to { transform: translateX(-420px); }
    }
    @keyframes roadFlow {
      from { transform: translateX(0); }
      to { transform: translateX(-240px); }
    }
    @keyframes wheelSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes riderBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes wingFlap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg) translate(-2px, -4px); }
    }
    @keyframes wingFlapBack {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg) translate(1px, -2px); }
    }
    @keyframes pedalSwing {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(18deg); }
    }
    @keyframes reedSway {
      from { transform: rotate(-3deg); }
      to { transform: rotate(4deg); }
    }
    @keyframes tinyWave {
      0%, 100% { opacity: 0.42; transform: translateX(0); }
      50% { opacity: 0.92; transform: translateX(10px); }
    }

    .is-paused * { animation-play-state: paused !important; }

    @media (prefers-reduced-motion: reduce) {
      .cloud-drift,
      .cloud-drift-slow,
      .road-flow,
      .wheel-spin,
      .rider-bob,
      .wing-flap,
      .wing-flap-back,
      .pedal-leg,
      .reed-sway,
      .tiny-wave { animation-play-state: paused; }
    }

    @media (max-width: 760px) {
      .page-shell { width: min(100% - 24px, 1240px); padding-top: 28px; }
      .intro { display: block; }
      .badge { margin-top: 22px; }
      .scene-note { top: 13px; left: 14px; padding: 8px 10px; font-size: 11px; }
      .control-bar { align-items: flex-start; flex-direction: column; padding: 15px 16px 17px; }
      .control-meta { width: 100%; justify-content: space-between; }
      .feature-strip { grid-template-columns: 1fr; }
      .feature { min-height: 52px; padding: 9px 16px; }
      .art-card { border-radius: 20px; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="intro">
      <div>
        <p class="eyebrow">SVG 2D MOTION · 海边小故事</p>
        <h1>风起，鹈鹕出发了。</h1>
        <p class="subtitle">一只爱骑车的鹈鹕，沿着海岸线慢慢前进。云朵、车轮和翅膀都在动，整幅画只用 SVG 绘制。</p>
      </div>
      <div class="badge"><span class="badge-dot"></span>纯 SVG 动画</div>
    </header>

    <section class="art-card" aria-label="鹈鹕骑自行车 SVG 动画">
      <div class="scene-frame">
        <div class="scene-note">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5A8.5 8.5 0 0 0 12 3.5Zm0 4.2v4.7l3.1 1.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          沿海骑行中
        </div>

        <svg id="animationScene" viewBox="0 0 1200 720" role="img" aria-labelledby="sceneTitle sceneDesc" xmlns="http://www.w3.org/2000/svg">
          <title id="sceneTitle">鹈鹕骑着自行车穿过海边的 2D 动画</title>
          <desc id="sceneDesc">夕阳、云朵、海岸和一只踩着自行车前进的鹈鹕，车轮与鹈鹕的翅膀正在轻轻运动。</desc>
          <defs>
            <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#b7c9ed"/>
              <stop offset="0.52" stop-color="#d8e6f5"/>
              <stop offset="1" stop-color="#f9d9bd"/>
            </linearGradient>
            <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#fff9df" stop-opacity="0.98"/>
              <stop offset="0.44" stop-color="#ffe4ae" stop-opacity="0.9"/>
              <stop offset="1" stop-color="#ffc28e" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="seaGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#8fb9ce"/>
              <stop offset="1" stop-color="#4f839e"/>
            </linearGradient>
            <linearGradient id="roadGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#d4a486"/>
              <stop offset="1" stop-color="#a66f68"/>
            </linearGradient>
            <linearGradient id="featherWhite" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fffdf7"/>
              <stop offset="1" stop-color="#e9edf0"/>
            </linearGradient>
            <linearGradient id="wingGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a7b9c8"/>
              <stop offset="0.55" stop-color="#718ba7"/>
              <stop offset="1" stop-color="#4f6987"/>
            </linearGradient>
            <linearGradient id="beakGradient" x1="0" y1="0" x2="0.95" y2="1">
              <stop offset="0" stop-color="#ffcb74"/>
              <stop offset="1" stop-color="#e87556"/>
            </linearGradient>
            <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
              <feGaussianBlur stdDeviation="10"/>
            </filter>
            <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
              <feGaussianBlur stdDeviation="4"/>
            </filter>
          </defs>

          <!-- sky -->
          <rect width="1200" height="720" fill="url(#skyGradient)"/>
          <circle cx="935" cy="145" r="132" fill="url(#sunGlow)"/>
          <circle cx="935" cy="145" r="49" fill="#ffe6b5" opacity="0.98"/>
          <circle cx="935" cy="145" r="36" fill="#fff0c9" opacity="0.78"/>

          <!-- distant clouds -->
          <g class="cloud-drift-slow" opacity="0.43" fill="#fff" transform="translate(290 0)">
            <path d="M80 152c8-27 34-45 65-45 23 0 43 10 55 28 8-7 19-11 31-11 28 0 51 20 54 47H80c-2-6-2-13 0-19Z"/>
            <path d="M755 205c7-22 28-37 54-37 20 0 36 8 47 23 7-6 16-9 26-9 23 0 42 17 45 39H755c-2-5-2-11 0-16Z"/>
          </g>
          <g class="cloud-drift" opacity="0.68" fill="#fff">
            <path d="M-105 252c8-25 32-42 61-42 22 0 40 9 52 26 8-7 19-11 30-11 27 0 49 19 52 45H-105c-2-6-2-12 0-18Z"/>
            <path d="M1060 111c8-19 27-32 49-32 17 0 32 7 42 20 6-5 14-8 23-8 20 0 36 15 39 35h-153c-2-5-2-10 0-15Z"/>
          </g>

          <!-- hills and sea -->
          <path d="M0 355c100-61 181-74 275-27 68 34 121 40 189-12 63-48 123-43 184-4 63 41 120 42 182 0 76-50 156-44 234 6 51 32 93 38 136 15v151H0Z" fill="#a1b4c8" opacity="0.7"/>
          <path d="M0 405c113-30 183-25 270 15 81 37 142 31 211-7 74-41 139-36 209 6 77 46 135 45 211 0 86-51 180-40 299 14v141H0Z" fill="#6c9aaa"/>
          <path d="M0 444c109-31 183-29 282 8 85 32 147 29 220-4 71-32 137-28 210 6 84 39 148 38 225-4 94-51 177-37 263 4v102H0Z" fill="url(#seaGradient)"/>
          <g class="tiny-wave" fill="none" stroke="#c4e0e5" stroke-linecap="round" opacity="0.55">
            <path d="M96 489c26-8 47-8 73 0m15 0c24-7 43-7 66 0" stroke-width="4"/>
            <path d="M866 468c28-8 52-8 78 0m21 0c26-7 45-7 68 0" stroke-width="3"/>
            <path d="M188 544c35-9 63-9 96 0m26 0c26-7 46-7 70 0" stroke-width="3" opacity="0.5"/>
          </g>
          <g fill="#e7bd88" opacity="0.8">
            <path d="M110 423l7-14 7 14-7 12Z"/>
            <path d="M1048 414l6-12 7 12-7 11Z"/>
            <path d="M1093 428l5-10 6 10-6 9Z"/>
          </g>

          <!-- road and shoulder -->
          <path d="M0 512c214 9 370 2 550-2 225-5 421 9 650-7v217H0Z" fill="url(#roadGradient)"/>
          <path d="M0 508c227 11 401 3 563-1 214-5 430 8 637-8" fill="none" stroke="#f7d9b7" stroke-width="7" opacity="0.82"/>
          <path d="M0 535c241 12 431 4 582 0 231-6 413 7 618-7" fill="none" stroke="#8f5e60" stroke-width="2" opacity="0.35"/>
          <g class="road-flow" fill="#f5d9b7" opacity="0.65">
            <rect x="20" y="622" width="126" height="8" rx="4"/>
            <rect x="277" y="622" width="126" height="8" rx="4"/>
            <rect x="534" y="622" width="126" height="8" rx="4"/>
            <rect x="791" y="622" width="126" height="8" rx="4"/>
            <rect x="1048" y="622" width="126" height="8" rx="4"/>
          </g>

          <!-- shoreline grasses -->
          <g fill="none" stroke-linecap="round">
            <g class="reed-sway" stroke="#416d67" stroke-width="5">
              <path d="M76 540c2-28 3-56-8-81m9 50c11-22 23-38 31-51"/>
            </g>
            <g class="reed-sway delay-1" stroke="#5a8270" stroke-width="4">
              <path d="M127 539c-2-30 0-51 12-78m-10 51c-12-19-19-34-23-48"/>
            </g>
            <g class="reed-sway delay-2" stroke="#416d67" stroke-width="5">
              <path d="M1110 536c-3-34-1-59 12-92m-11 61c-14-22-24-44-27-61m28 75c15-24 29-42 39-55"/>
            </g>
            <g class="reed-sway" stroke="#638676" stroke-width="4">
              <path d="M1161 539c-3-26-2-47 7-68m-4 46c-11-14-18-28-21-41"/>
            </g>
          </g>

          <!-- bicycle shadow -->
          <ellipse cx="603" cy="635" rx="279" ry="22" fill="#314658" opacity="0.27" filter="url(#softShadow)"/>
          <ellipse cx="603" cy="628" rx="238" ry="9" fill="#52616a" opacity="0.18" filter="url(#smallShadow)"/>

          <!-- bicycle -->
          <g id="bicycle">
            <!-- wheels -->
            <g id="rearWheel" class="wheel-spin">
              <circle cx="390" cy="525" r="95" fill="#1c2d3d" opacity="0.96"/>
              <circle cx="390" cy="525" r="87" fill="none" stroke="#d9e2e6" stroke-width="4" opacity="0.85"/>
              <circle cx="390" cy="525" r="78" fill="none" stroke="#607a89" stroke-width="2" opacity="0.55"/>
              <g stroke="#c6d5d9" stroke-width="2" opacity="0.65">
                <path d="M390 440V610M305 525h170M330 465l120 120M450 465L330 585M347 449l86 152M433 449l-86 152"/>
              </g>
              <circle cx="390" cy="525" r="10" fill="#e7885d" stroke="#fff0d2" stroke-width="4"/>
            </g>
            <g id="frontWheel" class="wheel-spin">
              <circle cx="810" cy="525" r="95" fill="#1c2d3d" opacity="0.96"/>
              <circle cx="810" cy="525" r="87" fill="none" stroke="#d9e2e6" stroke-width="4" opacity="0.85"/>
              <circle cx="810" cy="525" r="78" fill="none" stroke="#607a89" stroke-width="2" opacity="0.55"/>
              <g stroke="#c6d5d9" stroke-width="2" opacity="0.65">
                <path d="M810 440V610M725 525h170M750 465l120 120M870 465L750 585M767 449l86 152M853 449l-86 152"/>
              </g>
              <circle cx="810" cy="525" r="10" fill="#e7885d" stroke="#fff0d2" stroke-width="4"/>
            </g>

            <!-- frame -->
            <g fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M390 525 496 405 600 525 390 525ZM496 405h215l-111 120M600 525l111-125 99 125" stroke="#ed805c" stroke-width="12"/>
              <path d="M496 405 468 372" stroke="#273b52" stroke-width="9"/>
              <path d="M448 371h61" stroke="#273b52" stroke-width="12"/>
              <path d="M711 400l-10-54" stroke="#273b52" stroke-width="9"/>
              <path d="M701 347c20-4 39-1 55 8m-19-4 15-15" stroke="#273b52" stroke-width="8"/>
              <path d="M390 525 496 405M711 400 810 525" stroke="#ffd096" stroke-width="3" opacity="0.9"/>
            </g>
            <g id="crank" class="wheel-spin">
              <circle cx="600" cy="525" r="18" fill="#203449" stroke="#f5c176" stroke-width="5"/>
              <path d="M600 525l38-39" stroke="#f5c176" stroke-width="6" stroke-linecap="round"/>
              <path d="M638 486h27" stroke="#203449" stroke-width="7" stroke-linecap="round"/>
              <path d="M600 525l-34 37" stroke="#f5c176" stroke-width="6" stroke-linecap="round"/>
              <path d="M566 562h-27" stroke="#203449" stroke-width="7" stroke-linecap="round"/>
            </g>
            <circle cx="600" cy="525" r="6" fill="#fff0d2"/>
          </g>

          <!-- pelican rider -->
          <g id="rider" class="rider-bob">
            <!-- legs behind the body -->
            <g class="pedal-leg" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M612 344c-7 34-28 72-35 112-6 31 2 53 21 68" stroke="#e3784d" stroke-width="13"/>
              <path d="M598 524c10 4 24 7 34 4" stroke="#e3784d" stroke-width="9"/>
              <path d="M627 526c-11 8-25 8-35 4" stroke="#2b3b4c" stroke-width="11"/>

  </main>

  <script>
    (() => {
      const body = document.body;
      const toggle = document.getElementById('toggleMotion');
      const toggleLabel = document.getElementById('toggleLabel');
      const pauseIcon = document.getElementById('pauseIcon');
      const replay = document.getElementById('replayMotion');
      const speed = document.getElementById('speedRange');
      const speedValue = document.getElementById('speedValue');
      const scene = document.getElementById('animationScene');

      const playIcon = '<path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none"/>';
      const pauseIconMarkup = '<path d="M8 5v14M16 5v14"/>';

      function updatePauseButton() {
        const paused = body.classList.contains('is-paused');
        toggle.setAttribute('aria-pressed', String(paused));
        toggleLabel.textContent = paused ? '继续动画' : '暂停动画';
        pauseIcon.innerHTML = paused ? playIcon : pauseIconMarkup;
      }

      toggle.addEventListener('click', () => {
        body.classList.toggle('is-paused');
        updatePauseButton();
      });

      replay.addEventListener('click', () => {
        const freshScene = scene.cloneNode(true);
        scene.replaceWith(freshScene);
      });

      speed.addEventListener('input', (event) => {
        const value = Number(event.target.value);
        document.documentElement.style.setProperty('--motion-speed', value);
        speedValue.textContent = `${value.toFixed(1)}×`;
      });

      updatePauseButton();
    })();
  </script>
</body>
