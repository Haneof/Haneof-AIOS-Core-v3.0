<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<meta name="description" content="一只鹈鹕骑着自行车飞驰的纯 SVG 2D 动画：车轮旋转、双腿真实踩踏、身体起伏、脖子与喉囊晃动。">
<style>
  :root{
    --ink:#0d1621;
    --loop: 1.05s;          /* 踏频 / 车轮周期 */
    --loop-ease: ease-in-out;
  }
  *{ box-sizing:border-box }
  html,body{ margin:0; min-height:100% }
  body{
    background:
      radial-gradient(120% 90% at 50% 0%, #24405e 0%, #16273a 45%, #0a1119 100%);
    color:#dce8f4;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:2.2vh 2vw;
  }
  .stage{ width:100%; display:flex; flex-direction:column; align-items:center; gap:14px }
  .frame{
    position:relative;
    border-radius:22px;
    overflow:hidden;
    background:#0f1d2c;
    box-shadow:
      0 2px 0 rgba(255,255,255,.06) inset,
      0 30px 70px -25px rgba(0,0,0,.85),
      0 0 0 1px rgba(255,255,255,.09);
    line-height:0;
  }
  svg.art{
    display:block;
    width: min(1280px, 96vw, calc(88vh * 1100 / 720));
    height:auto;
    transform-box:view-box;
  }
  /* —— 向量图形统一坐标盒：让所有 transform-origin 直接使用 viewBox 坐标 —— */
  svg.art *{ transform-box:view-box }
  /* 车轮以自身圆心为原点旋转（选择器需比 svg.art * 更具体） */
  svg.art .wheel{ transform-box:fill-box; transform-origin:center }

  /* ============ 动画 ============ */
  .wheel{ animation: spin var(--loop) linear infinite }
  .bobs { animation: bob var(--loop) linear infinite }
  .necksway{ animation: necksway 2.1s var(--loop-ease) infinite alternate;
             transform-origin:410px 340px }
  .head    { animation: headsway 2.1s var(--loop-ease) infinite alternate;
             transform-origin:452px 238px }
  .beak    { animation: beakbob .7s var(--loop-ease) infinite alternate;
             transform-origin:460px 232px }
  .pouch   { animation: pouchjiggle .7s var(--loop-ease) infinite alternate;
             transform-origin:580px 265px }
  .wingflap{ animation: wingflap var(--loop) var(--loop-ease) infinite alternate;
             transform-origin:424px 348px }   /* 以肩部为轴轻扇 */
  .scarf-a { animation: flut 1.3s var(--loop-ease) infinite alternate;
             transform-origin:390px 305px }
  .scarf-b { animation: flut .95s var(--loop-ease) infinite alternate-reverse;
             transform-origin:390px 315px }
  .lid     { animation: blink 5.3s var(--loop-ease) infinite;
             transform-origin:452px 228px }
  .steer   { animation: steer 2.4s var(--loop-ease) infinite alternate;
             transform-origin:690px 462px }
  .sunpulse{ animation: sunpulse 4.6s var(--loop-ease) infinite alternate;
             transform-origin:150px 132px }
  .flowA   { animation: flow .3077s linear infinite }
  .flowB   { animation: flow .3077s linear infinite; animation-delay:-.11s }
  .clouds  { animation: clouds 34s linear infinite }
  .wind    { animation: wind 1.6s linear infinite }
  .wind.w2 { animation-duration:1.9s; animation-delay:-.5s }
  .wind.w3 { animation-duration:2.2s; animation-delay:-1.1s }
  .puff    { animation: puff 1.5s ease-out infinite }
  .puff.p2 { animation-delay:-.5s }
  .puff.p3 { animation-delay:-1s }

  @keyframes spin    { from{ transform:rotate(0) } to{ transform:rotate(360deg) } }
  @keyframes flow    { from{ transform:translateX(0) } to{ transform:translateX(-140px) } }
  @keyframes clouds  { from{ transform:translateX(0) } to{ transform:translateX(-560px) } }
  @keyframes bob{
    0%  { transform:translateY(0)      rotate(0deg) }
    14% { transform:translateY(3.4px)  rotate(1deg) }
    50% { transform:translateY(-.6px)  rotate(-.4deg) }
    64% { transform:translateY(-3.4px) rotate(-1deg) }
    100%{ transform:translateY(0)      rotate(0deg) }
  }
  @keyframes necksway{ from{ transform:rotate(-2.4deg) } to{ transform:rotate(2.4deg) } }
  @keyframes headsway{ from{ transform:rotate(1.8deg) }  to{ transform:rotate(-1.8deg) } }
  @keyframes beakbob { from{ transform:rotate(-1.4deg) } to{ transform:rotate(1.4deg) } }
  @keyframes pouchjiggle{ from{ transform:scale(1,1) } to{ transform:scale(1,.93) translateY(4px) } }
  @keyframes wingflap{ from{ transform:rotate(-2.6deg) } to{ transform:rotate(2.6deg) } }
  @keyframes flut    { from{ transform:rotate(-7deg) } to{ transform:rotate(9deg) } }
  @keyframes blink   { 0%,86%{ transform:scaleY(.06) } 90%,94%{ transform:scaleY(1) } 100%{ transform:scaleY(.06) } }
  @keyframes steer   { from{ transform:rotate(-3deg) } to{ transform:rotate(3deg) } }
  @keyframes sunpulse{ from{ transform:scale(1) } to{ transform:scale(1.07) } }
  @keyframes wind    { 0%{ transform:translateX(120px); opacity:0 }
                       25%{ opacity:.75 } 70%{ opacity:.5 }
                       100%{ transform:translateX(-330px); opacity:0 } }
  @keyframes puff    { 0%{ transform:translate(0,0) scale(.35); opacity:.75 }
                       100%{ transform:translate(-96px,-26px) scale(1.9); opacity:0 } }

  @media (prefers-reduced-motion: reduce){
    svg.art *{ animation-duration:6s !important; animation-iteration-count:1 !important }
  }

  .caption{
    display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; justify-content:center;
    font-size:clamp(13px,1.5vw,16px); letter-spacing:.02em;
  }
  .caption b{ font-size:clamp(15px,1.9vw,20px); font-weight:700; color:#fff; letter-spacing:.06em }
  .caption span{ color:#8ba7c4 }
  .dot{ width:5px; height:5px; border-radius:50%; background:#3fd0c0; display:inline-block }
</style>
</head>
<body>
<main class="stage">
  <div class="frame">
    <svg class="art" viewBox="0 0 1100 720" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ttl dsc">
      <title id="ttl">鹈鹕骑自行车</title>
      <desc id="dsc">一只白色的鹈鹕骑着青绿色自行车沿公路飞驰：车轮旋转、双腿踩踏、身体起伏、长喙与喉囊随节奏晃动、围巾迎风飞扬。</desc>

      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="#7fc9f7"/>
          <stop offset="52%" stop-color="#bfe6ff"/>
          <stop offset="100%" stop-color="#eaf8ff"/>
        </linearGradient>
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0"   stop-color="#fff8c9" stop-opacity=".95"/>
          <stop offset="55%" stop-color="#ffe9a3" stop-opacity=".35"/>
          <stop offset="100%" stop-color="#ffe9a3" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a9dcc8"/><stop offset="100%" stop-color="#8ccbb4"/>
        </linearGradient>
        <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#79c6a6"/><stop offset="100%" stop-color="#57a98a"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9aa6b3"/>
          <stop offset="45%" stop-color="#7a8794"/>
          <stop offset="100%" stop-color="#59636e"/>
        </linearGradient>
        <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="#ffffff"/>
          <stop offset="62%" stop-color="#f4f8fc"/>
          <stop offset="100%" stop-color="#dbe6f1"/>
        </linearGradient>
        <linearGradient id="featherShade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e5edf6"/><stop offset="100%" stop-color="#becdde"/>
        </linearGradient>
        <linearGradient id="billGrad" x1="0" y1="0" x2="1" y2=".4">
          <stop offset="0" stop-color="#ffe08a"/><stop offset="100%" stop-color="#f2a13c"/>
        </linearGradient>
        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"  stop-color="#ffc24d"/>
          <stop offset="60%" stop-color="#fb9b2c"/>
          <stop offset="100%" stop-color="#ef7d16"/>
        </linearGradient>
        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#43d8c8"/><stop offset="100%" stop-color="#159c92"/>
        </linearGradient>
        <radialGradient id="tyreGrad" cx="50%" cy="35%" r="70%">
          <stop offset="0" stop-color="#3a4149"/><stop offset="100%" stop-color="#1b1f24"/>
        </radialGradient>
        <filter id="soft" x="-30%" y="-120%" width="160%" height="340%">
          <feGaussianBlur stdDeviation="7"/>
        </filter>
        <filter id="blur6" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="3.2"/>
        </filter>

        <!-- 车轮辐条 -->
        <g id="spokes" stroke="#c6d2de" stroke-width="1.7" stroke-linecap="round">
          <line y1="-11" y2="-64"/>
          <line y1="-11" y2="-64" transform="rotate(45)"/>
          <line y1="-11" y2="-64" transform="rotate(90)"/>
          <line y1="-11" y2="-64" transform="rotate(135)"/>
          <line y1="-11" y2="-64" transform="rotate(180)"/>
          <line y1="-11" y2="-64" transform="rotate(225)"/>
          <line y1="-11" y2="-64" transform="rotate(270)"/>
          <line y1="-11" y2="-64" transform="rotate(315)"/>
        </g>

        <!-- 路面速度虚线（周期 140px，位移 -140px 无缝循环） -->
        <g id="dashA"><rect x="-30" y="-4" width="62" height="7" rx="3.5" fill="#ffffff" opacity=".30"/></g>
        <g id="dashB"><rect x="-30" y="-3" width="38" height="6" rx="3"   fill="#ffffff" opacity=".20"/></g>
        <g id="dashC"><rect x="-30" y="-2" width="20" height="4" rx="2"   fill="#ffffff" opacity=".16"/></g>

        <!-- 云（周期 560px） -->
        <g id="cloud1">
          <path d="M 0 0 c 10 -18 34 -22 46 -10 c 8 -20 40 -22 52 -4 c 20 -8 42 4 42 22 c -2 12 -16 18 -30 18 l -96 0 c -16 -1 -22 -16 -14 -26 z"
                fill="#ffffff" opacity=".88"/>
        </g>
        <g id="cloud2">
          <path d="M 0 0 c 12 -14 30 -18 42 -8 c 12 -14 36 -12 44 4 c 18 -2 30 8 28 20 c -2 10 -14 14 -26 14 l -78 0 c -14 -1 -20 -12 -10 -30 z"
                fill="#ffffff" opacity=".78"/>
        </g>

        <!-- 通用腿/脚（枢轴在原点，向下延伸） -->
      </defs>

      <!-- ================= 背景 ================= -->
      <rect width="1100" height="720" fill="url(#sky)"/>
      <g class="sunpulse">
        <circle cx="150" cy="132" r="128" fill="url(#sunGlow)"/>
        <circle cx="150" cy="132" r="38" fill="#fff6c4"/>
      </g>

      <g class="clouds" opacity=".95">
        <use href="#cloud1" x="60"   y="120"/>
        <use href="#cloud2" x="240"  y="86"/>
        <use href="#cloud1" x="620"  y="128"/>
        <use href="#cloud2" x="800"  y="92"/>
        <use href="#cloud1" x="1010" y="150"/>
        <use href="#cloud1" x="1180" y="120"/>
        <use href="#cloud2" x="1360" y="86"/>
      </g>

      <path d="M -20 600 C 110 548 232 552 330 578 C 430 604 520 556 640 548
               C 760 540 862 584 1120 548 L 1120 660 L -20 660 Z" fill="url(#hillFar)"/>
      <path d="M -20 626 C 140 586 250 616 392 610 C 548 604 648 570 812 594
               C 930 612 1040 604 1120 590 L 1120 700 L -20 700 Z" fill="url(#hillNear)"/>

      <rect x="0" y="602" width="1100" height="118" fill="url(#road)"/>
      <rect x="0" y="602" width="1100" height="3" fill="#e9f3fa" opacity=".55"/>

      <g class="flowA">
        <use href="#dashA" x="0"   y="628"/><use href="#dashB" x="140" y="636"/>
        <use href="#dashA" x="280" y="626"/><use href="#dashC" x="420" y="640"/>
        <use href="#dashB" x="560" y="630"/><use href="#dashA" x="700" y="638"/>
        <use href="#dashC" x="840" y="628"/><use href="#dashB" x="980" y="642"/>
        <use href="#dashA" x="1120" y="632"/>
      </g>
      <g class="flowB">
        <use href="#dashB" x="0"   y="676"/><use href="#dashC" x="140" y="668"/>
        <use href="#dashA" x="280" y="680"/><use href="#dashB" x="420" y="670"/>
        <use href="#dashC" x="560" y="682"/><use href="#dashA" x="700" y="672"/>
        <use href="#dashB" x="840" y="684"/><use href="#dashC" x="980" y="674"/>
        <use href="#dashA" x="1120" y="678"/>
      </g>

      <!-- ================= 场景 ================= -->
      <g class="scene">

        <!-- 落地阴影 -->
        <ellipse cx="528" cy="614" rx="252" ry="17" fill="#20303f" opacity=".26" filter="url(#soft)"/>

        <!-- 风线 -->
        <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".85">
          <path class="wind"    d="M 940 250 L 1046 250" stroke-width="5" opacity=".7"/>
          <path class="wind w2" d="M 900 330 L 1010 330" stroke-width="4" opacity=".55"/>
          <path class="wind w3" d="M 960 420 L 1070 420" stroke-width="3.4" opacity=".45"/>
        </g>

        <!-- 后方（远侧）肢体与脚踏 -->
        <g opacity=".92">
          <g id="legFar">
            <g id="thighFar" transform="translate(400,385) rotate(-80.532)">
              <path d="M -15 -6 C -19 40 -16 92 -11 118 C -5 128 5 128 11 118 C 16 92 19 40 15 -6 Z"
                    fill="url(#featherShade)" stroke="#a9b9cb" stroke-width="1.6"/>
              <g id="shinFar" transform="translate(0,124) rotate(100.650)">
                <path d="M -11 -4 C -13 40 -11 82 -8 108 C -4 118 4 118 8 108 C 11 82 13 40 11 -4 Z"
                      fill="url(#featherShade)" stroke="#a9b9cb" stroke-width="1.6"/>
              </g>
            </g>
            <g id="footFar" transform="translate(482.41,514.32)">
              <path d="M -22 -3 C -10 -11 12 -12 26 -5 C 31 -1 29 6 21 7 C 4 10 -14 10 -20 5 C -25 2 -25 -1 -22 -3 Z"
                    fill="#e5b184" stroke="#c58f5c" stroke-width="1.6"/>
            </g>
          </g>
          <g id="crankFar" transform="translate(520,540) rotate(200)">
            <rect x="-6" y="-4.5" width="46" height="9" rx="4.5" fill="#9aa7b3"/>
          </g>
          <g id="pedalFar" transform="translate(482.4,526.3)">
            <rect x="-17" y="-4.5" width="34" height="9" rx="3" fill="#8c99a6" stroke="#6d7986" stroke-width="1.4"/>
          </g>
          <g id="armFar" transform="translate(424,352) rotate(18) scale(.978,1)">
            <path d="M 0 -12 C 60 -18 150 -17 246 -9 C 253 -7 257 -4 257 0 C 257 4 253 7 246 9
                     C 150 17 60 18 0 12 C -9 9 -11 5 -9 0 C -11 -5 -9 -9 0 -12 Z"
                  fill="url(#featherShade)" stroke="#a9b9cb" stroke-width="1.6"/>
            <g fill="none" stroke="#cddaea" stroke-width="8" stroke-linecap="round">
              <path d="M 246 -7 C 268 -7 280 1 282 9"/>
              <path d="M 246 0 C 268 2 280 8 280 16"/>
            </g>
          </g>
        </g>

        <!-- ================= 自行车 ================= -->
        <g id="bike">
          <!-- 后轮 -->
          <g transform="translate(350,530)">
            <g class="wheel" id="wheelRear">
              <circle r="76" fill="none" stroke="url(#tyreGrad)" stroke-width="11"/>
              <circle r="67" fill="none" stroke="#e9f0f7" stroke-width="4"/>
              <use href="#spokes"/>
              <circle r="9"  fill="#d4dde7" stroke="#8d9aa8" stroke-width="2"/>
            </g>
          </g>

          <!-- 前轮 + 车把（转向组） -->
          <g class="steer" id="steer">
            <g transform="translate(700,530)">
              <g class="wheel" id="wheelFront">
                <circle r="76" fill="none" stroke="url(#tyreGrad)" stroke-width="11"/>
                <circle r="67" fill="none" stroke="#e9f0f7" stroke-width="4"/>
                <use href="#spokes"/>
                <circle r="9"  fill="#d4dde7" stroke="#8d9aa8" stroke-width="2"/>
              </g>
            </g>
            <!-- 前挡泥板 -->
            <path d="M 614 499 A 92 92 0 0 1 786 499" fill="none" stroke="#159c92"
                  stroke-width="8" stroke-linecap="round" opacity=".95"/>
            <!-- 前叉 -->
            <path d="M 692 484 C 694 498 697 514 700 526" fill="none" stroke="#2b323a"
                  stroke-width="8" stroke-linecap="round"/>
            <!-- 车把 -->
            <path d="M 676 462 L 668 438" fill="none" stroke="#3a424b" stroke-width="9" stroke-linecap="round"/>
            <path d="M 648 430 C 658 444 672 452 688 453 C 700 453 707 447 708 437"
                  fill="none" stroke="#3a424b" stroke-width="8.5" stroke-linecap="round"/>
            <path d="M 644 434 L 651 426" fill="none" stroke="#1c2228" stroke-width="13" stroke-linecap="round"/>
            <path d="M 703 443 L 711 432" fill="none" stroke="#1c2228" stroke-width="13" stroke-linecap="round"/>
          </g>

          <!-- 后挡泥板 -->
          <path d="M 264 499 A 92 92 0 0 1 436 499" fill="none" stroke="#159c92"
                stroke-width="8" stroke-linecap="round" opacity=".95"/>

          <!-- 牙盘 / 链条 / 后飞轮 -->
          <path d="M 350 517 L 520 518 M 350 543 L 520 562" fill="none" stroke="#98a3ae" stroke-width="4.5"/>
          <circle cx="520" cy="540" r="23" fill="#e3e9f0" stroke="#7f8b98" stroke-width="4"
                  stroke-dasharray="5 4" stroke-linecap="round"/>
          <circle cx="520" cy="540" r="13" fill="#cfd8e2" stroke="#8b97a4" stroke-width="2.5"/>
          <circle cx="350" cy="530" r="13" fill="#cfd8e2" stroke="#8b97a4" stroke-width="2.5"/>

          <!-- 车架 -->
          <g fill="none" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round">
            <path d="M 350 530 L 520 540"/>
            <path d="M 350 530 L 406 412"/>
            <path d="M 520 540 L 414 414"/>
            <path d="M 520 540 L 686 470"/>
            <path d="M 410 420 L 678 458"/>
          </g>
          <path d="M 678 458 L 692 484" fill="none" stroke="#2b323a" stroke-width="13" stroke-linecap="round"/>
          <path d="M 406 412 L 410 396" fill="none" stroke="#8b97a3" stroke-width="7" stroke-linecap="round"/>
          <!-- 车座 -->
          <path d="M 344 404 C 362 392 416 390 442 400 C 448 404 440 412 424 412
                   C 396 414 360 412 346 408 C 340 406 340 406 344 404 Z" fill="#2b323a"/>

          <!-- 近侧曲柄 + 脚踏 -->
          <g id="crankNear" transform="translate(520,540) rotate(20)">
            <rect x="-6" y="-4.5" width="46" height="9" rx="4.5" fill="#b9c4d0"/>
          </g>
          <g id="pedalNear" transform="translate(557.6,553.7)">
            <rect x="-17" y="-4.5" width="34" height="9" rx="3" fill="#aab6c2" stroke="#7d8894" stroke-width="1.4"/>
          </g>
        </g>

        <!-- 近侧腿（画在车架之上，胯部被身体盖住） -->
        <g id="legNear">
          <g id="thighNear" transform="translate(400,385) rotate(-66.590)">
            <path d="M -16 -6 C -21 40 -17 92 -12 118 C -5 129 5 129 12 118 C 17 92 21 40 16 -6 Z"
                  fill="url(#feather)" stroke="#c3d0dd" stroke-width="1.8"/>
            <path d="M -8 24 C -10 56 -9 84 -6 104" fill="none" stroke="#d7e2ed" stroke-width="3" stroke-linecap="round"/>
            <g id="shinNear" transform="translate(0,124) rotate(44.409)">
              <path d="M -12 -4 C -14 40 -12 82 -9 108 C -4 119 4 119 9 108 C 12 82 14 40 12 -4 Z"
                    fill="url(#feather)" stroke="#c3d0dd" stroke-width="1.8"/>
              <path d="M -5 10 C -6 44 -5 76 -3 96" fill="none" stroke="#d7e2ed" stroke-width="3" stroke-linecap="round"/>
            </g>
          </g>
          <g id="footNear" transform="translate(557.59,541.68)">
            <path d="M -24 -3 C -11 -12 13 -13 28 -5 C 33 -1 31 7 22 8 C 4 11 -15 11 -22 5 C -27 2 -27 -1 -24 -3 Z"
                  fill="#f2b878" stroke="#c98f52" stroke-width="1.8"/>
            <path d="M -16 3 C 0 -1 16 -1 26 2" fill="none" stroke="#cf9455" stroke-width="2.4" stroke-linecap="round"/>
          </g>
        </g>

        <!-- ================= 鹈鹕身体（随踏频起伏） ================= -->
        <g class="bobs" id="bobs">
          <!-- 尾羽 -->
          <path d="M 300 390 C 286 376 268 364 250 358 C 240 355 233 362 240 370
                   C 252 382 264 394 272 406 C 283 404 295 398 300 390 Z"
                fill="url(#feather)" stroke="#b9c8d8" stroke-width="1.8"/>
          <path d="M 294 388 C 280 374 264 363 250 358" fill="none" stroke="#cddaea"
                stroke-width="2.4" stroke-linecap="round"/>
          <!-- 远侧翅膀（露出背线） -->
          <path d="M 406 316 C 382 300 350 292 316 298 C 340 310 366 324 388 342 Z"
                fill="url(#featherShade)" stroke="#a9b9cb" stroke-width="1.6"/>
          <path d="M 392 312 C 372 302 348 297 326 298" fill="none" stroke="#a9b9cb"
                stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
          <!-- 身体 -->
          <path d="M 292 378 C 296 342 330 316 374 314 C 418 312 452 336 460 368
                   C 466 396 448 424 410 430 C 368 436 326 422 302 396
                   C 294 388 290 384 292 378 Z"
                fill="url(#feather)" stroke="#c3d0dd" stroke-width="2"/>
          <!-- 胸口暖色 -->
          <path d="M 456 372 C 462 396 448 418 416 428 C 436 416 448 396 450 370 Z"
                fill="#fff0d8" opacity=".85"/>

          <!-- 近侧收拢的翅膀 -->
          <g class="wingflap">
            <path d="M 398 318 C 360 326 326 348 308 372 C 328 394 364 402 396 394

    <span>Pelican on a Bicycle · 纯 SVG 2D 动画：车轮自转、真实踩踏（IK 解算）、身体起伏、长喙与喉囊晃动</span>

</main>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     几何参数（与 SVG 坐标一致）
     中轴 BB、脚踏轨迹半径 = 曲柄长 40，胯 HIP 藏在身体里，
     大腿 124 / 小腿 116，用二连杆 IK 反解每个瞬间的膝盖位置。
     ------------------------------------------------------------------ */
  var BB = { x: 520, y: 540 }, CRANK = 40;
  var HIP = { x: 400, y: 385 }, THIGH = 124, SHIN = 116;
  var ANKLE_LIFT = 12;          // 脚踝略高于脚踏轴心 = 踩在脚踏面上
  var START = 20;               // 起始曲柄角（度）
  var PERIOD = 1050;            // 一圈踏频 1.05s（与 CSS --loop 对齐）
  var D2R = Math.PI / 180;

  var NEAR = ["thighNear", "shinNear", "footNear", "crankNear", "pedalNear"];
  var FAR  = ["thighFar",  "shinFar",  "footFar",  "crankFar",  "pedalFar"];
  var el = {};
  function node(id) {
    if (!(id in el)) el[id] = document.getElementById(id);
    return el[id];
  }

  function angleTo(dx, dy) { return Math.atan2(-dx, dy) / D2R; }   // “向下” → 目标方向

  /* 二连杆 IK：给定脚踏位置，返回膝盖坐标（膝关节朝前） */
  function solveKnee(px, py) {
    var ax = px, ay = py - ANKLE_LIFT;
    var dx = ax - HIP.x, dy = ay - HIP.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1e-6;
    var a = (d * d + THIGH * THIGH - SHIN * SHIN) / (2 * d);
    var h = Math.sqrt(Math.max(THIGH * THIGH - a * a, 0));
    var mx = HIP.x + a * dx / d, my = HIP.y + a * dy / d;
    var ux = -dy / d, uy = dx / d;
    var k1x = mx + h * ux, k1y = my + h * uy;
    var k2x = mx - h * ux, k2y = my - h * uy;
    return k1x > k2x ? { x: k1x, y: k1y } : { x: k2x, y: k2y };
  }

  /* 应用某一瞬间的姿态：deg 为曲柄角 */
  function pose(deg, ids) {
    var a = deg * D2R;
    var px = BB.x + CRANK * Math.cos(a);
    var py = BB.y + CRANK * Math.sin(a);
    var ax = px, ay = py - ANKLE_LIFT;
    var knee = solveKnee(px, py);
    var tRot = angleTo(knee.x - HIP.x, knee.y - HIP.y);
    var sRot = angleTo(ax - knee.x, ay - knee.y);

    var g = node(ids[0]); if (g) g.setAttribute("transform",
      "translate(" + HIP.x + "," + HIP.y + ") rotate(" + tRot.toFixed(3) + ")");
    g = node(ids[1]); if (g) g.setAttribute("transform",
      "translate(0," + THIGH + ") rotate(" + (sRot - tRot).toFixed(3) + ")");
    g = node(ids[2]); if (g) g.setAttribute("transform",
      "translate(" + ax.toFixed(2) + "," + ay.toFixed(2) + ")");
    g = node(ids[3]); if (g) g.setAttribute("transform",
      "translate(" + BB.x + "," + BB.y + ") rotate(" + deg.toFixed(3) + ")");
    g = node(ids[4]); if (g) g.setAttribute("transform",
      "translate(" + px.toFixed(2) + "," + py.toFixed(2) + ")");
  }

  function apply(t) {
    pose(START + t, NEAR);          // 近侧脚：t=0 时在下前方
    pose(START + 180 + t, FAR);     // 远侧脚：相位差 180°
  }

  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  apply(0);

  if (reduce || !window.requestAnimationFrame) return;   // 尊重“减少动态效果”

  var t0 = null;
  function loop(now) {
    if (t0 === null) t0 = now;
    var phase = ((now - t0) / PERIOD % 1) * 360;
    apply(phase);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
