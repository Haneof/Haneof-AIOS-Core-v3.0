<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071a2d">
  <title>鹈鹕，出发！ · SVG 2D 动画</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f7fb;
      --muted: #9fb2c7;
      --accent: #ffbd69;
      --accent-soft: #f7e5c0;
      --panel: rgba(13, 34, 55, 0.84);
      --line: rgba(184, 213, 234, 0.16);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 76% 8%, rgba(55, 102, 151, 0.24), transparent 35rem),
        #061523;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .page-shell {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      padding: 42px 0 34px;
    }

    .masthead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 28px;
      margin-bottom: 24px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 28px;
      height: 2px;
      content: "";
      background: var(--accent);
      box-shadow: 0 0 14px rgba(255, 189, 105, 0.8);
    }

    h1 {
      max-width: 690px;
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 5.4rem);
      font-weight: 850;
      letter-spacing: -0.07em;
      line-height: 0.98;
    }

    .intro {
      max-width: 590px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: clamp(0.94rem, 2vw, 1.08rem);
      line-height: 1.7;
    }

    .signature {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 15px 11px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(21, 48, 73, 0.54);
      color: #d7e6f2;
      font-size: 0.78rem;
      white-space: nowrap;
    }

    .signature-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      color: #12263a;
      background: var(--accent);
      font-size: 0.9rem;
      font-weight: 900;
    }

    .scene-card {
      overflow: hidden;
      border: 1px solid rgba(183, 213, 232, 0.2);
      border-radius: 26px;
      background: var(--panel);
      box-shadow:
        0 32px 90px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(16px);
    }

    .scene-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 18px;
      border-bottom: 1px solid rgba(183, 213, 232, 0.12);
    }

    .scene-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #cfdeea;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #72e0a0;
      box-shadow: 0 0 0 5px rgba(114, 224, 160, 0.12), 0 0 14px rgba(114, 224, 160, 0.8);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .scene-note {
      color: #8ba2b8;
      font-size: 0.75rem;
    }

    .art-wrap {
      position: relative;
      padding: 14px;
      background: #0b2238;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 340px;
      border-radius: 17px;
      background: #16324b;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.24);
    }

    .controls {
      position: absolute;
      right: 30px;
      bottom: 29px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px 8px 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(7, 25, 42, 0.72);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(10px);
    }

    .control-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      color: #10253a;
      background: var(--accent);
      cursor: pointer;
      font: inherit;
      font-size: 0.76rem;
      font-weight: 800;
      transition: transform 160ms ease, background 160ms ease;
    }

    .control-button:hover { background: #ffd28d; transform: translateY(-1px); }
    .control-button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    .speed-control {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #b7c9d9;
      font-size: 0.7rem;
      white-space: nowrap;
    }

    .speed-control input {
      width: 74px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .info-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 22px;
      padding: 17px 20px 19px;
    }

    .caption {
      margin: 0;
      color: #d6e3ed;
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .caption strong { color: var(--accent-soft); }

    .tech-tag {
      padding: 8px 10px;
      border: 1px solid rgba(255, 189, 105, 0.26);
      border-radius: 10px;
      color: #ffc87e;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
    }

    .footer-note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 3px 0;
      color: #718ba2;
      font-size: 0.73rem;
    }

    .footer-note span:last-child { color: #96abc0; }

    /* All scene motion is controlled by this single speed variable. */
    #pelicanRide { --motion-speed: 1; }
    #pelicanRide.is-paused * { animation-play-state: paused !important; }

    .wheel-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin calc(1.15s / var(--motion-speed)) linear infinite;
    }

    .pedal-spin {
      transform-box: fill-box;
      transform-origin: center;
      animation: wheel-spin calc(1.15s / var(--motion-speed)) linear infinite reverse;
    }

    .road-dashes {
      animation: road-drift calc(1.85s / var(--motion-speed)) linear infinite;
    }

    .landmark-scroll {
      animation: landscape-drift calc(12s / var(--motion-speed)) linear infinite;
    }

    .cloud-a {
      animation: cloud-drift calc(23s / var(--motion-speed)) linear infinite;
    }

    .cloud-b {
      animation: cloud-drift-reverse calc(31s / var(--motion-speed)) linear infinite;
    }

    .pelican-bob {
      transform-box: view-box;
      transform-origin: 640px 322px;
      animation: pelican-bob calc(0.72s / var(--motion-speed)) ease-in-out infinite;
    }

    .wing-flap {
      transform-box: view-box;
      transform-origin: 663px 296px;
      animation: wing-flap calc(0.92s / var(--motion-speed)) ease-in-out infinite;
    }

    .leg-a {
      transform-box: view-box;
      transform-origin: 620px 385px;
      animation: leg-a calc(1.15s / var(--motion-speed)) ease-in-out infinite;
    }

    .leg-b {
      transform-box: view-box;
      transform-origin: 653px 382px;
      animation: leg-b calc(1.15s / var(--motion-speed)) ease-in-out infinite;
    }

    .star {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 2.4s ease-in-out infinite;
    }

    .star:nth-child(2n) { animation-delay: -0.8s; }
    .star:nth-child(3n) { animation-delay: -1.6s; }

    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes road-drift { to { transform: translateX(-220px); } }
    @keyframes landscape-drift { from { transform: translateX(0); } to { transform: translateX(-320px); } }
    @keyframes cloud-drift { from { transform: translateX(-120px); } to { transform: translateX(1160px); } }
    @keyframes cloud-drift-reverse { from { transform: translateX(1120px); } to { transform: translateX(-180px); } }
    @keyframes pelican-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes wing-flap { 0%, 100% { transform: rotate(3deg); } 50% { transform: rotate(-11deg); } }
    @keyframes leg-a { 0%, 100% { transform: rotate(9deg); } 50% { transform: rotate(-15deg); } }
    @keyframes leg-b { 0%, 100% { transform: rotate(-13deg); } 50% { transform: rotate(11deg); } }
    @keyframes twinkle { 0%, 100% { opacity: 0.42; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.18); } }
    @keyframes pulse { 0%, 100% { opacity: 0.68; } 50% { opacity: 1; } }

    @media (max-width: 720px) {
      .page-shell { width: min(100% - 24px, 620px); padding-top: 28px; }
      .masthead { display: block; }
      .signature { display: inline-flex; margin-top: 19px; }
      .scene-toolbar { align-items: flex-start; flex-direction: column; gap: 6px; }
      .scene-note { font-size: 0.7rem; }
      .art-wrap { padding: 8px; }
      .controls { right: 17px; bottom: 22px; }
      .speed-control { display: none; }
      .info-row { grid-template-columns: 1fr; gap: 12px; padding-inline: 14px; }
      .tech-tag { justify-self: start; }
      .footer-note { align-items: flex-start; flex-direction: column; gap: 6px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="masthead">
      <div>
        <div class="eyebrow">SVG MOTION STUDY · 01</div>
        <h1>鹈鹕，出发！</h1>
        <p class="intro">一只不太擅长飞行、但很会骑车的鹈鹕，沿着海边把晚风和好心情一起送到远方。</p>
      </div>
      <div class="signature" aria-label="纯 SVG 二维动画">
        <span class="signature-mark">✦</span>
        <span>纯 SVG · 2D 动画</span>
      </div>
    </header>

    <section class="scene-card" aria-label="鹈鹕骑自行车动画">
      <div class="scene-toolbar">
        <div class="scene-label"><span class="live-dot" aria-hidden="true"></span>海岸线快递员正在路上</div>
        <div class="scene-note">车轮、翅膀与风景同步运动</div>
      </div>

      <div class="art-wrap">
        <svg id="pelicanRide" viewBox="0 0 1200 680" role="img" aria-labelledby="sceneTitle sceneDesc">
          <title id="sceneTitle">鹈鹕骑自行车穿过海边的二维动画</title>
          <desc id="sceneDesc">夕阳下，一只鹈鹕踩着橙色自行车向右前进，车轮转动，翅膀轻轻扇动，远处的云朵、树木和道路都在移动。</desc>

          <defs>
            <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0b203b" />
              <stop offset="0.52" stop-color="#24516b" />
              <stop offset="1" stop-color="#f09a70" />
            </linearGradient>
            <linearGradient id="seaGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3b8da0" />
              <stop offset="1" stop-color="#1b526f" />
            </linearGradient>
            <linearGradient id="roadGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#283b4a" />
              <stop offset="1" stop-color="#142333" />
            </linearGradient>
            <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0" stop-color="#ffdca1" stop-opacity="0.95" />
              <stop offset="0.48" stop-color="#ffb170" stop-opacity="0.55" />
              <stop offset="1" stop-color="#ff9f70" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="featherGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fffdf5" />
              <stop offset="1" stop-color="#d5e1e3" />
            </linearGradient>
            <linearGradient id="beakGradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffd46f" />
              <stop offset="1" stop-color="#e7864e" />
            </linearGradient>
            <filter id="softShadow" x="-25%" y="-25%" width="150%" height="170%">
              <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#061523" flood-opacity="0.3" />
            </filter>
            <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
              <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#071624" flood-opacity="0.35" />
            </filter>
            <g id="spoke">
              <line x1="0" y1="-82" x2="0" y2="82" />
            </g>
            <g id="sparkle">
              <path d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z" />
            </g>
          </defs>

          <!-- sky -->
          <rect width="1200" height="680" fill="url(#skyGradient)" />
          <circle cx="960" cy="375" r="208" fill="url(#sunGlow)" />
          <circle cx="960" cy="375" r="74" fill="#ffd99a" opacity="0.9" />
          <circle cx="960" cy="375" r="54" fill="#ffe4ad" opacity="0.86" />

          <!-- little lights in the evening sky -->
          <g fill="#f9e8bc" opacity="0.85">
            <use class="star" href="#sparkle" transform="translate(106 112) scale(0.7)" />
            <use class="star" href="#sparkle" transform="translate(205 74) scale(0.42)" />
            <use class="star" href="#sparkle" transform="translate(336 135) scale(0.5)" />
            <use class="star" href="#sparkle" transform="translate(468 80) scale(0.34)" />
            <use class="star" href="#sparkle" transform="translate(784 121) scale(0.48)" />
            <use class="star" href="#sparkle" transform="translate(1106 120) scale(0.6)" />
            <circle class="star" cx="550" cy="162" r="2.6" />
            <circle class="star" cx="866" cy="68" r="2.3" />
          </g>

          <!-- slow clouds -->
          <g class="cloud-a" fill="#e7f1f0" opacity="0.25">
            <path d="M-170 180 C-127 145 -83 151 -52 179 C-19 143 50 151 66 190 C95 183 122 199 127 227 L-170 227 Z" />
          </g>
          <g class="cloud-b" fill="#f9e7d8" opacity="0.19">
            <path d="M1100 260 C1131 226 1176 233 1194 267 C1220 242 1269 251 1282 286 L1282 308 L1100 308 Z" />
          </g>

          <!-- distant hills and sea -->
          <path d="M0 410 C120 355 187 391 281 350 C365 314 435 366 511 337 C604 300 675 345 752 329 C854 308 923 340 1011 314 C1097 288 1140 318 1200 292 L1200 520 L0 520 Z" fill="#1b4659" opacity="0.78" />
          <path d="M0 444 C140 407 248 422 348 398 C457 373 570 402 667 380 C803 350 901 392 1009 366 C1092 346 1152 360 1200 345 L1200 542 L0 542 Z" fill="#286577" opacity="0.72" />
          <path d="M0 466 C175 449 283 458 411 439 C558 417 670 439 795 419 C942 397 1073 423 1200 397 L1200 554 L0 554 Z" fill="url(#seaGradient)" />
          <g fill="none" stroke="#a9d9d2" stroke-width="3" opacity="0.27">
            <path d="M34 481 C126 474 174 477 243 472" />
            <path d="M875 456 C969 448 1041 453 1129 447" />
            <path d="M76 513 C161 507 236 510 322 505" />
            <path d="M836 501 C925 496 1024 499 1176 490" />

          <!-- scrolling shoreline landmarks -->
          <g class="landmark-scroll">
            <g opacity="0.72">
              <path d="M118 502 L118 405 L127 405 L127 502 Z" fill="#1a3343" />
              <path d="M78 414 Q122 360 166 414 Q127 397 78 414Z" fill="#153243" />
              <path d="M87 386 Q122 337 157 386 Q124 371 87 386Z" fill="#183b4a" />
              <path d="M94 362 Q122 322 150 362 Q122 350 94 362Z" fill="#1e4652" />
            </g>
            <g transform="translate(255 28)" opacity="0.76">
              <path d="M118 502 L118 405 L127 405 L127 502 Z" fill="#1a3343" />
              <path d="M78 414 Q122 360 166 414 Q127 397 78 414Z" fill="#153243" />
              <path d="M87 386 Q122 337 157 386 Q124 371 87 386Z" fill="#183b4a" />
              <path d="M94 362 Q122 322 150 362 Q122 350 94 362Z" fill="#1e4652" />
            </g>
            <g transform="translate(650 -8)" opacity="0.76">
              <path d="M118 502 L118 405 L127 405 L127 502 Z" fill="#1a3343" />
              <path d="M78 414 Q122 360 166 414 Q127 397 78 414Z" fill="#153243" />
              <path d="M87 386 Q122 337 157 386 Q124 371 87 386Z" fill="#183b4a" />
              <path d="M94 362 Q122 322 150 362 Q122 350 94 362Z" fill="#1e4652" />
            </g>
            <g transform="translate(980 21)" opacity="0.68">
              <path d="M118 502 L118 405 L127 405 L127 502 Z" fill="#1a3343" />
              <path d="M78 414 Q122 360 166 414 Q127 397 78 414Z" fill="#153243" />
              <path d="M87 386 Q122 337 157 386 Q124 371 87 386Z" fill="#183b4a" />
              <path d="M94 362 Q122 322 150 362 Q122 350 94 362Z" fill="#1e4652" />
            </g>
            <g transform="translate(420 62)" opacity="0.35">
              <rect x="0" y="330" width="94" height="77" rx="5" fill="#163546" />
              <path d="M-13 333 L47 283 L107 333 Z" fill="#153243" />
              <rect x="18" y="351" width="18" height="56" fill="#2e6471" />
              <rect x="59" y="351" width="18" height="26" fill="#2e6471" />
            </g>
          </g>

          <!-- road and motion -->
          <path d="M0 523 C256 505 460 515 605 514 C816 512 1013 511 1200 519 L1200 680 L0 680 Z" fill="url(#roadGradient)" />
          <path d="M0 524 C276 507 473 517 625 516 C831 514 1017 514 1200 521" fill="none" stroke="#78909f" stroke-width="3" opacity="0.34" />
          <g class="road-dashes" fill="#f6c878" opacity="0.82">
            <path d="M-130 611 L35 607 L57 613 L-111 620 Z" />
            <path d="M168 600 L334 598 L350 604 L184 608 Z" />
            <path d="M472 593 L638 593 L650 599 L486 601 Z" />
            <path d="M776 594 L942 595 L950 601 L786 600 Z" />
            <path d="M1080 603 L1246 607 L1249 614 L1086 610 Z" />
          </g>
          <g fill="#f5d69a" opacity="0.15">
            <ellipse cx="214" cy="642" rx="92" ry="4" />
            <ellipse cx="930" cy="650" rx="120" ry="5" />

          <!-- tiny route marker -->
          <g transform="translate(102 407)" opacity="0.86">
            <path d="M10 116 L10 0" stroke="#d9aa70" stroke-width="6" />
            <path d="M8 5 Q64 6 76 39 Q42 49 8 39 Z" fill="#f1b566" />
            <path d="M20 18 Q43 19 55 31" fill="none" stroke="#8e4d49" stroke-width="3" stroke-linecap="round" />
          </g>

          <!-- bicycle -->
          <g class="bicycle" filter="url(#softShadow)">
            <!-- rear wheel -->
            <g transform="translate(500 505)">
              <g class="wheel-spin">
                <circle r="92" fill="#0c1722" stroke="#06111b" stroke-width="9" />
                <circle r="80" fill="none" stroke="#d2e0e2" stroke-width="4" opacity="0.88" />
                <g fill="none" stroke="#94aeb8" stroke-width="2" opacity="0.75">
                  <use href="#spoke" />

            <!-- front wheel -->
            <g transform="translate(770 505)">

              <path d="M585 395 L567 369" stroke="#f19a56" stroke-width="8" />

            </g>

            <!-- crank -->
            <g transform="translate(654 505)">
              <g class="pedal-spin">
                <circle r="15" fill="#172938" stroke="#ffd083" stroke-width="4" />
                <path d="M0 0 L43 14" stroke="#f7ae5c" stroke-width="7" stroke-linecap="round" />
                <path d="M39 10 L59 16" stroke="#172938" stroke-width="7" stroke-linecap="round" />
                <path d="M0 0 L-30 -22" stroke="#f7ae5c" stroke-width="7" stroke-linecap="round" />
                <path d="M-34 -26 L-52 -30" stroke="#172938" stroke-width="7" stroke-linecap="round" />
              </g>
            </g>

            <!-- front basket -->

      <span>愿你今天也骑得轻快。</span>
    </div>
  </main>

  <script>
    const scene = document.getElementById('pelicanRide');
    const pauseButton = document.getElementById('pauseButton');
    const speedRange = document.getElementById('speedRange');
    const pauseLabel = pauseButton.querySelector('span:last-child');
    const pauseIcon = pauseButton.querySelector('span:first-child');

    pauseButton.addEventListener('click', () => {
      const paused = scene.classList.toggle('is-paused');
      pauseButton.setAttribute('aria-pressed', String(paused));
      pauseLabel.textContent = paused ? '继续' : '暂停';
      pauseIcon.textContent = paused ? '▶' : 'Ⅱ';
    });

    speedRange.addEventListener('input', (event) => {
      scene.style.setProperty('--motion-speed', event.target.value);
    });
  </script>
